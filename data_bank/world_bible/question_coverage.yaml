- id: C1
  parent_id: null
  text: How many executives have been posted in the Delhi office for 5 years or more?
    Break down by grade and discipline.
  personas: &id001
  - CMD
  answer_type: sql
  tables:
  - posting_history
  - employee_master
  - dim_work_centre
  - dim_grade
  - dim_discipline
  columns:
  - posting_history.emp_id
  - posting_history.wc_id
  - posting_history.from_date
  - posting_history.to_date
  - posting_history.grade_id
  - posting_history.discipline_id
  - posting_history.tenure_months
  - employee_master.emp_id
  - dim_work_centre.wc_id
  - dim_work_centre.city
  - dim_grade.grade_id
  - dim_discipline.discipline_id
  filters: dim_work_centre.city = 'Delhi' AND posting_history.to_date IS NULL AND
    posting_history.tenure_months >= 60
  grouping_drill_dims:
  - posting_history.grade_id
  - posting_history.discipline_id
  metric_definition: COUNT(DISTINCT posting_history.emp_id) FILTER(WHERE posting_history.tenure_months
    >= 60)
  documents:
  - JRTP Clause 3.0
  - JRTP Clause 4.0
  story_ids:
  - S1
  expected_output: table
  gold_layer_object: gold.mart_postings
  answerable: true
  gap: null
