    sap_field_map:
      TRFGR: grade_id
      TRFST: level_order
    scd_type: SCD1
    partitioning_clustering_suggestion:
      partition_by: null
      cluster_by:
        - cadre
        - group
    drill_dimensions:
      - grade_id
      - cadre
      - group
      - promotion_mode
      - level_order
    questions_served:
      - C1
      - C4
      - E4
      - E5
      - D1
      - P7
      - P10
      - P12
      - T3
