version: '1.0'
layer: silver
metadata:
  title: ONGC Silver Layer Data Contract
  project: ONGC HR & Finance Agentic Data Bank
  description: Authoritative silver schema defining conformed, typed, and keyed entities
    across Reference (R1-R10), HR (H1-H20), Finance (F1-F17), and Governance (G1-G5).
  total_tables: 53
  total_columns: 828
  total_additions_from_followups: 75
  total_served_by_documents: 27
served_by_documents:
  - id: D1
    type: refusal
    question: What is the salary of my reporting officer?
    governing_document: ONGC Conduct, Discipline and Appeal (CDA) Rules 1991 & HR
      Privacy Charter
    clause: Rule 5 (Confidentiality of Remuneration & Individual Service Records)
    handling: 'Refusal: Individual officer salary is confidential under CDA rules.
      Provide public salary grade band (E6) instead.'
  - id: D2
    type: refusal
    question: Show me the draft transfer list for Mumbai.
    governing_document: Job Rotation and Transfer Policy (JRTP)
    clause: Section 8 (Confidentiality of Draft Transfer Proposals)
    handling: 'Refusal: Draft transfer proposals are strictly confidential until formally
      notified by Director (HR). Provide general tenure criteria.'
  - id: D3
    type: refusal
    question: Who is getting promoted in the next DPC?
    governing_document: DPC Promotion Regulations & Manual
    clause: Regulation 14 (Confidentiality of Departmental Promotion Committee Proceedings)
    handling: 'Refusal: DPC committee deliberations and candidate lists are classified.
      Provide published promotion notification schedule.'
  - id: D4
    type: refusal
    question: Which fields are loss-making, and what is the capex plan for next year?
    governing_document: Commercial Information Disclosure Policy & Book of Delegated
      Powers
    clause: Section 3.2 (Commercial Sensitivity of Field-Level Financial Performance)
    handling: 'Refusal: Field-level P&L and forward capex budgets are restricted from
      junior functional officers. Provide company-wide public totals.'
  - id: D5
    type: refusal
    question: List all employees in Delhi with more than 5 years' tenure.
    governing_document: ONGC Personnel Information Security Policy
    clause: Section 4.1 (Restriction on Mass Extraction of Personnel Movement Data)
    handling: 'Refusal: Mass extraction of personnel tenure in Corporate HQ is restricted
      to authorised HR officers.'
  - id: D6
    type: refusal
    question: Is any officer in my asset under vigilance inquiry?
    governing_document: Central Vigilance Commission (CVC) Vigilance Manual & ONGC
      Vigilance Charter
    clause: Chapter III (Confidentiality of Preliminary Inquiries & Disciplinary Investigations)
    handling: 'Refusal: Vigilance inquiries are strictly confidential and privileged
      under CVC guidelines.'
  - id: P1
    type: policy
    question: What is the minimum tenure at a station, and the maximum cumulative
      stay in one city?
    governing_document: Job Rotation and Transfer Policy (JRTP)
    clause: Clause 4.1 (Minimum Tenure of 3 Years) & Clause 5.2 (10-Year Cumulative
      Station Cap)
    handling: 'Policy look-up: Explains standard minimum 3-year tenure at a work centre
      and 10-year cumulative cap in one urban cluster.'
  - id: P2
    type: policy
    question: Which stations count as one cluster for tenure purposes?
    governing_document: Job Rotation and Transfer Policy (JRTP)
    clause: Schedule B (Cluster Classification of Work Centres)
    handling: 'Policy look-up: Specifies defined geographic clusters (Delhi NCR, Mumbai
      Region, Gujarat Region) treated as single units for tenure.'
  - id: P3
    type: policy
    question: Am I exempt from transfer if I retire in 2 years?
    governing_document: Job Rotation and Transfer Policy (JRTP)
    clause: Clause 7.3 (Exemption for Impending Superannuation)
    handling: 'Policy look-up: Officers within 2 years of retirement (or 3 years upon
      representation) are exempt from inter-station transfer.'
  - id: P4
    type: policy
    question: How many earned leave days can I accumulate and encash at retirement?
    governing_document: ONGC Leave Rules 1995
    clause: Rule 18 (Earned Leave Accumulation & Encashment Ceiling of 300 Days)
    handling: 'Policy look-up: Earned leave accumulation ceiling is 300 days for encashment
      at retirement; annual encashment rules during service.'
  - id: P5
    type: policy
    question: Am I eligible for study leave, and what bond applies?
    governing_document: ONGC Study Leave & Sabbatical Rules
    clause: 'Rule 12 (Eligibility: Minimum 5 Years Continuous Service; Mandatory 3-Year
      Service Bond)'
    handling: 'Policy look-up: Eligibility requires 5 years regular service; maximum
      24 months duration; execution of service bond required.'
  - id: P6
    type: policy
    question: Can I accept a gift from a vendor at Diwali? What is the limit?
    governing_document: ONGC Conduct, Discipline and Appeal (CDA) Rules 1991
    clause: "Rule 13 (Acceptance of Gifts from Commercial Entities; Monetary Limit\
      \ of \u20B95,000 for Executives)"
    handling: 'Policy look-up: Commercial gifts from vendors strictly prohibited;
      ceremonial gifts from relatives/friends subject to DPE ceiling.'
  - id: P7
    type: policy
    question: What is my travel class and lodging allowance for official travel to
      Mumbai as an E2?
    governing_document: ONGC Traveling Allowance (TA/DA) Rules 2017
    clause: "Schedule I (Grade E2 Entitlement: Economy Air / AC 2-Tier; Class-A Lodging\
      \ Ceiling \u20B94,500/day)"
    handling: 'Policy look-up: Specifies travel class and daily lodging entitlements
      for executive grades in metropolitan cities.'
  - id: P8
    type: policy
    question: How do I raise a concern confidentially without being victimised?
    governing_document: ONGC Whistleblower Policy (PIDPI Resolution)
    clause: Clause 6 (Confidential Reporting Channel to CVO & Statutory Protection
      against Victimisation)
    handling: 'Policy look-up: Details confidential submission to Chief Vigilance
      Officer and statutory safeguards against retaliatory action.'
  - id: P9
    type: policy
    question: How do I file a POSH complaint, and who is on the committee at my station?
    governing_document: ONGC Policy on Prevention of Sexual Harassment (POSH) 2014
    clause: Section 4 (Statutory Constitution of Internal Complaints Committee at
      Every Work Centre)
    handling: 'Policy look-up: Details filing procedure with Presiding Officer and
      lists station committee members.'
  - id: P10
    type: policy
    question: What are the criteria for promotion from E3 to E4?
    governing_document: ONGC Modified Recruitment & Promotion (R&P) Regulations 2020
    clause: 'Section 3.2 (Promotion E3 to E4: 3 Years Residency, PAR Benchmark of
      75, Fitness Review)'
    handling: 'Policy look-up: Specifies residency, PAR benchmark, and screening criteria
      for promotion from E3 to E4.'
  - id: P18
    type: refusal
    question: Show me the Draft FY27 Transfer Order.
    governing_document: Job Rotation and Transfer Policy (JRTP)
    clause: Section 8.1 (Privileged Status of Annual Transfer Order Prior to Official
      Release)
    handling: 'Refusal: Draft FY27 Transfer Order is strictly confidential and awaiting
      competent approval.'
  - id: P19
    type: refusal
    question: What are the full financial limits for Directors in the delegated powers?
    governing_document: ONGC Book of Delegated Powers (BDoP)
    clause: Commercial Delegations Summary (Director Thresholds Classified for Internal
      Procurement)
    handling: 'Refusal: Comprehensive schedule of Director financial powers is restricted
      to authorised finance officers.'
  - id: P20
    type: refusal
    question: Summarise the Board note on divesting marginal fields.
    governing_document: Board Secretariat Confidential Records Manual
    clause: Section 5 (Confidentiality of Board Memoranda & Strategic Asset Divestment
      Notes)
    handling: 'Refusal: Board notes regarding field divestment are market-sensitive
      and classified strictly confidential.'
  - id: M3
    type: refusal
    question: '"Show me the salary and APAR of employee 104523."'
    governing_document: Role-Based Access Control (RBAC) Security Policy
    clause: Policy Rule RBAC-HR-04 (Restriction on Cross-Employee Salary & APAR Inspection)
    handling: 'Refusal: Individual officer salary and APAR rating access denied under
      functional separation rules.'
  - id: M4
    type: refusal
    question: '"Which fields are loss-making?"'
    governing_document: Role-Based Access Control (RBAC) Security Policy
    clause: Policy Rule RBAC-FIN-02 (Restriction on Granular Field P&L Access for
      Junior Staff)
    handling: 'Refusal: Field-level P&L details are restricted to executive leadership;
      junior officers receive company-wide public reports.'
  - id: E4
    type: policy
    question: What are the eligibility criteria for promotion from E2 to E3?
    governing_document: ONGC Recruitment & Promotion Regulations 2020
    clause: 'Clause 2.1 (Time-Bound Promotion E2 to E3: 3 Years Residency, Satisfactory
      APAR)'
    handling: 'Policy look-up: Confirms residency period of 3 years and APAR fitness
      requirement.'
  - id: E5
    type: policy
    question: What is the TA/DA entitlement for an offshore posting?
    governing_document: ONGC Offshore Allowance Rules & Circulars
    clause: Circular No. ONGC/HR/OFFSHORE/2022/01 (14-Day Shift Hardship Allowance
      & Conveyance)
    handling: 'Policy look-up: Explains 14-day rotational shift allowance, offshore
      hardship daily rate, and helicopter transit conveyance.'
  - id: C14
    type: document
    question: 'Prepare a one-page board note on the top 5 loss-making fields: production,
      cost, staffing and a recommendation.'
    governing_document: Board Memorandum Format & Guidelines
    clause: Standard Board Note Template for Marginal Field Monetization
    handling: 'Document generation: Formats structured data from field_pnl_annual
      into a one-page executive Board Note.'
  - id: H10
    type: document
    question: Generate an Excel transfer proposal for FY27 using rotation rules.
    governing_document: Annual Transfer Exercise Operating Guidelines
    clause: Transfer Proposal Annexure Spreadsheet Standards
    handling: 'Document generation: Generates transfer recommendation proposal using
      JRTP tenure rules.'
  - id: F10
    type: document
    question: Generate a quarterly asset-wise P&L sheet.
    governing_document: Corporate Performance Review Manual
    clause: Quarterly Asset MIS & P&L Reporting Standards
    handling: 'Document generation: Formats field revenues, statutory levies, and
      operating margins into quarterly asset P&L sheet.'
  - id: X7
    type: document
    question: 'Draft a reply to a Parliament question: "Vacancies in ONGC in the North-East
      region, category-wise."'
    governing_document: Parliament Cell Standard Operating Procedure
    clause: MoPNG Parliamentary Question Reply Protocol
    handling: 'Document generation: Formats category-wise sanctioned vs in-position
      vacancies into official parliamentary answer format.'
additions_from_followups:
  - table: posting_history
    column: exemption_tag
    followup_id: C1.f2
    followup_text: What are the approved administrative justifications or exemption
      tags recorded in SAP for those exceeding 5 years in Delhi?
    rationale: Captures administrative justifications and exemption tags recorded
      in SAP HR for officers exceeding 5 years at a station.
  - table: posting_history
    column: exemption_reason_code
    followup_id: C1.f2
    followup_text: What are the approved administrative justifications or exemption
      tags recorded in SAP for those exceeding 5 years in Delhi?
    rationale: Captures codified exemption category codes (e.g. medical, spouse posting,
      retirement within 2-3 years, project dependency).
  - table: posting_history
    column: exemption_approved_by
    followup_id: C1.f2
    followup_text: What are the approved administrative justifications or exemption
      tags recorded in SAP for those exceeding 5 years in Delhi?
    rationale: Records the competent sanctioning authority (Director HR or CMD) approving
      the tenure relaxation.
  - table: posting_history
    column: exemption_valid_until
    followup_id: P11.f2
    followup_text: Why have 31 senior executives been granted superannuation exemptions
      from the upcoming transfer order?
    rationale: Specifies the formal expiry date of administrative transfer exemption
      granted.
  - table: employee_master
    column: has_hard_station_tenure
    followup_id: C2.f3
    followup_text: How many of the overdue executives have never completed a mandatory
      tenure in a Category-C or offshore location?
    rationale: Enables immediate identification of executives who have never completed
      mandatory Category-C or North-East hardship postings.
  - table: employee_master
    column: has_offshore_tenure
    followup_id: C2.f3
    followup_text: How many of the overdue executives have never completed a mandatory
      tenure in a Category-C or offshore location?
    rationale: Tracks completion of mandatory offshore rotational duty stints required
      for leadership advancement.
  - table: dpc_cases
    column: accelerated_merit_benchmark_score
    followup_id: C4.f3
    followup_text: What percentage of eligible E6 Chief Engineers / Chief Geologists
      meet the DPC benchmark for accelerated promotion to GM?
    rationale: Quantifies DPC accelerated promotion benchmark score required for fast-track
      progression from E6 to GM (E7).
  - table: dpc_cases
    column: delay_bottleneck_reason
    followup_id: H5.f2
    followup_text: What procedural bottlenecks (e.g. pending vigilance clearances,
      APAR grading appeals, seniority litigation) delayed convening the DPCs?
    rationale: Identifies procedural bottlenecks (pending CVO vigilance clearance,
      APAR appeal, court stay) delaying promotion panels.
  - table: production_monthly
    column: water_cut_pct
    followup_id: C6.f2
    followup_text: What are the primary cost drivers (e.g. high water cut, power costs,
      workover frequency, aging surface facilities) behind the loss-making fields?
    rationale: Captures water cut percentage as the primary reservoir and surface
      processing cost driver in mature loss-making fields.
  - table: production_monthly
    column: water_produced_m3
    followup_id: C6.f2
    followup_text: What are the primary cost drivers (e.g. high water cut, power costs,
      workover frequency, aging surface facilities) behind the loss-making fields?
    rationale: Quantifies volume of associated produced water requiring separation,
      handling, and reinjection.
  - table: production_monthly
    column: gas_utilisation_pct
    followup_id: F1.f1
    followup_text: What are the individual cost components (power, workover, chemicals,
      surface repair, water handling) of lifting cost for the highest-cost asset?
    rationale: Measures beneficial utilization vs flaring of associated natural gas
      across field installations.
  - table: production_monthly
    column: gas_flared_mmscm
    followup_id: F1.f1
    followup_text: What are the individual cost components (power, workover, chemicals,
      surface repair, water handling) of lifting cost for the highest-cost asset?
    rationale: Quantifies flaring volumes due to compressor downtime or lack of evacuation
      infrastructure.
  - table: production_monthly
    column: active_producing_wells
    followup_id: C6.f2
    followup_text: What are the primary cost drivers (e.g. high water cut, power costs,
      workover frequency, aging surface facilities) behind the loss-making fields?
    rationale: Tracks flowing well counts and well servicing requirements impacting
      field lifting cost.
  - table: production_monthly
    column: active_injection_wells
    followup_id: C6.f2
    followup_text: What are the primary cost drivers (e.g. high water cut, power costs,
      workover frequency, aging surface facilities) behind the loss-making fields?
    rationale: Tracks pressure maintenance water and gas injection wells active in
      the field.
  - table: production_monthly
    column: well_downtime_hours
    followup_id: X10.f2
    followup_text: What specific maintenance or compressor downtime event caused the
      12% lifting cost spike in Field X this week?
    rationale: Logs well outage hours due to compressor downtime, sand ingress, or
      electrical faults.
  - table: capex_budget
    column: secondary_recovery_capex_inr_cr
    followup_id: C8.f2
    followup_text: What technical operating constraints make in-house secondary/tertiary
      recovery uneconomic compared to third-party PEC operators?
    rationale: Separates capital deployed on secondary/tertiary IOR/EOR schemes to
      evaluate technical return vs PEC farm-out.
  - table: field_pnl_annual
    column: is_loss_making_3yr_consecutive
    followup_id: C8.f1
    followup_text: Which specific fields in Assam and Cambay have sustained negative
      EBITDA for 3 consecutive fiscal years?
    rationale: Flags mature fields with negative EBITDA for 3 consecutive fiscal years
      for marginal field monetization review.
  - table: field_pnl_annual
    column: is_divestment_candidate
    followup_id: C8.f1
    followup_text: Which specific fields in Assam and Cambay have sustained negative
      EBITDA for 3 consecutive fiscal years?
    rationale: Flags candidate fields eligible for divestment, farm-out, or Discovered
      Small Field (DSF) offer.
  - table: field_pnl_annual
    column: pec_monetisation_potential_flag
    followup_id: C8.f2
    followup_text: What technical operating constraints make in-house secondary/tertiary
      recovery uneconomic compared to third-party PEC operators?
    rationale: Identifies fields suitable for third-party Production Enhancement Contract
      (PEC) bidding.
  - table: field_pnl_annual
    column: estimated_annual_opex_savings_inr_cr
    followup_id: C8.f3
    followup_text: What would be the estimated capex and opex savings if the bottom
      5 loss-making marginal fields are monetised or farmed out?
    rationale: Quantifies estimated corporate operating expenditure savings if marginal
      loss-making fields are farmed out.
  - table: field_pnl_annual
    column: estimated_annual_capex_savings_inr_cr
    followup_id: C8.f3
    followup_text: What would be the estimated capex and opex savings if the bottom
      5 loss-making marginal fields are monetised or farmed out?
    rationale: Quantifies development capex freed up by monetising low-yield mature
      assets.
  - table: field_pnl_annual
    column: root_cause_loss_code
    followup_id: C14.f2
    followup_text: What specific reservoir recovery mechanism or operating constraint
      is identified as the root cause of loss in each field?
    rationale: Categorizes operating constraint causing net loss (high water cut,
      high manpower, low productivity, aging facilities).
  - table: field_pnl_annual
    column: projected_pec_farmout_payoff_5yr_inr_cr
    followup_id: C14.f3
    followup_text: What is the quantified financial payoff of farm-out/PEC versus
      continued in-house operation over a 5-year outlook?
    rationale: Models the 5-year NPV financial payoff of third-party PEC operator
      entry vs continued in-house operation.
  - table: field_pnl_annual
    column: total_production_boe
    followup_id: C11.f3
    followup_text: How does the labor productivity (BOE per employee) in expanding
      assets compare with the ONGC corporate average?
    rationale: Provides total field hydrocarbon volume in BOE to compute labor productivity
      and lifting cost per barrel.
  - table: field_pnl_annual
    column: boe_per_employee
    followup_id: C11.f3
    followup_text: How does the labor productivity (BOE per employee) in expanding
      assets compare with the ONGC corporate average?
    rationale: Direct labor productivity input metric (hydrocarbon BOE output per
      regular employee) for cross-asset comparisons.
  - table: field_pnl_annual
    column: manpower_cost_per_boe_usd
    followup_id: C12.f1
    followup_text: Break down the manpower cost per BOE for Mumbai High, Neelam-Heera,
      Ahmedabad, and Assam into executive vs non-executive payroll.
    rationale: Unit manpower cost per barrel of oil equivalent for benchmarking against
      domestic and global upstream peers.
  - table: field_pnl_annual
    column: lifting_cost_per_boe_usd
    followup_id: F1.f3
    followup_text: How does the lifting cost of Mumbai High offshore compare with
      onshore assets and the overall company average ($11.5/BOE)?
    rationale: Unit direct lifting cost per BOE compared to company average ($11.5/BOE
      target).
  - table: project_progress
    column: revised_cost_estimate_rce_inr_cr
    followup_id: C9.f3
    followup_text: How does the anticipated final cost compare against the original
      Board-sanctioned budget and subsequent Revised Cost Estimates (RCE)?
    rationale: Compares current anticipated expenditure against original sanction
      and Board-approved Revised Cost Estimates (RCE).
  - table: project_progress
    column: cost_overrun_inr_cr
    followup_id: C9.f1
    followup_text: What is the current schedule slippage and cost overrun on the KG-DWN-98/2
      development and Western Offshore pipeline replacement projects?
    rationale: Directly reports quantified capital cost overrun in INR Crore.
  - table: project_progress
    column: cost_overrun_pct
    followup_id: C9.f3
    followup_text: How does the anticipated final cost compare against the original
      Board-sanctioned budget and subsequent Revised Cost Estimates (RCE)?
    rationale: Calculates percentage cost overrun over sanctioned budget for executive
      reporting.
  - table: project_progress
    column: schedule_slippage_months
    followup_id: C9.f1
    followup_text: What is the current schedule slippage and cost overrun on the KG-DWN-98/2
      development and Western Offshore pipeline replacement projects?
    rationale: Quantifies milestone schedule slippage in calendar months beyond baseline
      completion date.
  - table: project_progress
    column: delay_root_cause_category
    followup_id: C9.f2
    followup_text: What engineering, fabrication, or contractor delivery delays caused
      the milestone slippages across these projects?
    rationale: Categorizes delivery bottleneck (engineering drawing approval, fabrication
      delay, contractor standby, weather).
  - table: mou_targets
    column: composite_score
    followup_id: C10.f3
    followup_text: What is the projected year-end composite score under current trends
      compared to the 'Excellent' rating achieved in FY25?
    rationale: Computes cumulative weighted performance composite score under DPE
      guidelines.
  - table: mou_targets
    column: projected_composite_score
    followup_id: C10.f3
    followup_text: What is the projected year-end composite score under current trends
      compared to the 'Excellent' rating achieved in FY25?
    rationale: Calculates projected year-end composite score from Q2 run-rate to forecast
      final rating tier.
  - table: posting_history
    column: composite_transfer_grant_cta_inr
    followup_id: C13.f2
    followup_text: What one-time transfer grant, composite transfer allowance (CTA),
      and baggage transportation costs would be incurred?
    rationale: Determines Composite Transfer Grant (CTG/CTA) entitlement cost incurred
      when relocating executives to field assets.
  - table: posting_history
    column: baggage_transport_cost_inr
    followup_id: C13.f2
    followup_text: What one-time transfer grant, composite transfer allowance (CTA),
      and baggage transportation costs would be incurred?
    rationale: Records household baggage and personal vehicle shifting costs upon
      inter-station transfer.
  - table: posting_history
    column: total_transfer_cost_inr
    followup_id: C13.f2
    followup_text: What one-time transfer grant, composite transfer allowance (CTA),
      and baggage transportation costs would be incurred?
    rationale: Total financial expense incurred per transferred officer to model transfer
      rebalancing scenarios.
  - table: separations
    column: exit_interview_reason
    followup_id: H4.f2
    followup_text: What primary exit reasons (compensation gap with private E&P, location
      hardship, career progression) were cited in exit interviews?
    rationale: Records primary voluntary resignation root causes (compensation gap
      with private E&P, location hardship, career progression).
  - table: separations
    column: target_company_or_sector
    followup_id: H4.f1
    followup_text: "Which technical disciplines (IT, Drilling, Reservoir, Finance)\
      \ account for the highest share of voluntary resignations in E3\u2013E5?"
    rationale: Tracks destination employment sector of exiting mid-career technical
      officers.
  - table: sanctioned_posts
    column: social_category
    followup_id: X7.f1
    followup_text: What are the exact sanctioned versus in-position numbers in Assam
      and Tripura broken down by SC, ST, OBC, EWS, and General?
    rationale: Enables statutory breakdown of sanctioned strength and vacancies across
      SC, ST, OBC, EWS, and General.
  - table: sanctioned_posts
    column: backlog_vacancies
    followup_id: X7.f1
    followup_text: What are the exact sanctioned versus in-position numbers in Assam
      and Tripura broken down by SC, ST, OBC, EWS, and General?
    rationale: Tracks accumulated unfilled reservation quota vacancies specifically
      required for Parliament replies.
  - table: sanctioned_posts
    column: special_drive_flag
    followup_id: X7.f2
    followup_text: What specific recruitment initiatives and special drives have been
      launched to fill reserved category vacancies in the North-East?
    rationale: Flags special recruitment drives instituted to clear reserved category
      deficits in the North-East.
  - table: sanctioned_posts
    column: special_drive_name
    followup_id: X7.f2
    followup_text: What specific recruitment initiatives and special drives have been
      launched to fill reserved category vacancies in the North-East?
    rationale: Documents official recruitment advertisement and notification reference
      for special hiring drives.
  - table: sanctioned_posts
    column: special_drive_target_vacancies
    followup_id: X7.f2
    followup_text: What specific recruitment initiatives and special drives have been
      launched to fill reserved category vacancies in the North-East?
    rationale: Specifies targeted vacancy clearance quota under the special recruitment
      initiative.
  - table: grievances_litigation
    column: case_category
    followup_id: H9.f1
    followup_text: Break down pending cases by category (promotion dispute, transfer
      challenge, disciplinary action, pay anomaly) across High Courts and CAT.
    rationale: Categorizes pending legal proceedings (promotion dispute, transfer
      challenge, disciplinary action, pay anomaly).
  - table: grievances_litigation
    column: interim_stay_granted
    followup_id: H9.f1
    followup_text: Break down pending cases by category (promotion dispute, transfer
      challenge, disciplinary action, pay anomaly) across High Courts and CAT.
    rationale: Flags cases where High Court or CAT has granted judicial stay orders
      halting administrative transfers or promotions.
  - table: grievances_litigation
    column: is_aged_over_3_years
    followup_id: H9.f2
    followup_text: What institutional delays in the internal grievance redressal mechanism
      contributed to cases escalating to litigation?
    rationale: Flags litigation cases with prolonged judicial pendency exceeding 3
      years.
  - table: dim_price_fx
    column: cess_per_barrel_usd
    followup_id: F4.f1
    followup_text: "What was the exact dollar-per-barrel impact of OIDB cess (\u20B9\
      10,000/MT equivalent) and royalty on gross crude revenue?"
    rationale: Quantifies per-barrel impact of statutory OIDB cess in USD for net
      crude realization analysis.
  - table: dim_price_fx
    column: royalty_per_barrel_usd
    followup_id: F4.f1
    followup_text: "What was the exact dollar-per-barrel impact of OIDB cess (\u20B9\
      10,000/MT equivalent) and royalty on gross crude revenue?"
    rationale: Quantifies per-barrel statutory royalty impact in USD on gross upstream
      revenues.
  - table: purchase_orders
    column: engineers_estimate_inr
    followup_id: F5.f3
    followup_text: How does actual contract expenditure compare against the initial
      purchase order commitment and engineer's estimate?
    rationale: Provides internal baseline technical cost estimate to evaluate tender
      award price variance.
  - table: purchase_orders
    column: scope_variation_value_inr
    followup_id: F5.f2
    followup_text: What contract variations, scope changes, or standby day rates caused
      cost overruns on major turnkey contracts?
    rationale: Quantifies post-award contractual variations and amendments driving
      spend overruns.
  - table: purchase_orders
    column: standby_charges_inr
    followup_id: F5.f2
    followup_text: What contract variations, scope changes, or standby day rates caused
      cost overruns on major turnkey contracts?
    rationale: Details standby day rate charges incurred on chartered rigs and support
      vessels.
  - table: purchase_orders
    column: cost_overrun_inr
    followup_id: F5.f3
    followup_text: How does actual contract expenditure compare against the initial
      purchase order commitment and engineer's estimate?
    rationale: Quantifies total contract expenditure excess over initial awarded commitment.
  - table: purchase_orders
    column: overrun_reason
    followup_id: F5.f2
    followup_text: What contract variations, scope changes, or standby day rates caused
      cost overruns on major turnkey contracts?
    rationale: Documents root cause of contract overrun (scope expansion, extended
      well testing, weather standby).
  - table: receivables
    column: is_disputed
    followup_id: F6.f2
    followup_text: What billing disputes, price reconciliation delays, or subsidy
      settlement issues delayed clearance of aged trade receivables?
    rationale: Flags commercial invoices withheld by oil marketing companies or gas
      buyers due to dispute.
  - table: receivables
    column: dispute_reason
    followup_id: F6.f2
    followup_text: What billing disputes, price reconciliation delays, or subsidy
      settlement issues delayed clearance of aged trade receivables?
    rationale: Identifies billing hold cause (price reconciliation, volume reconciliation,
      gas calorific value, subsidy delay).
  - table: wells_drilled
    column: result_status
    followup_id: F8.f2
    followup_text: Why have complex HP-HT and exploratory drilling dry holes elevated
      exploration costs in frontier basins?
    rationale: Records well outcome (oil discovery, gas discovery, dry hole, water
      injector) to compute exploration success rates.
  - table: forex_hedges
    column: unhedged_exposure_usd
    followup_id: F9.f1
    followup_text: What is our net unhedged foreign currency liability across USD-denominated
      charter hires, EPC contracts, and equipment imports?
    rationale: Quantifies net unhedged foreign exchange liability across USD-denominated
      charter hires and equipment contracts.
  - table: benefit_liabilities
    column: discount_rate_pct
    followup_id: X4.f2
    followup_text: What demographic aging trends and discount rate assumptions drove
      the expansion of actuarial liabilities over 5 years?
    rationale: Records certified actuarial discount rate assumption used to evaluate
      present value of benefit liabilities.
  - table: benefit_liabilities
    column: funded_ratio_pct
    followup_id: X4.f3
    followup_text: How does our funded asset coverage ratio under the PRBS trust compare
      with total actuarial benefit obligations?
    rationale: Tracks funded asset coverage ratio under PRBS trust against actuarial
      obligations.
  - table: subsidiary_financials
    column: gross_refining_margin_usd_bbl
    followup_id: X5.f2
    followup_text: What refining margins at MRPL/HPCL and international production
      volumes at OVL drove their financial performance?
    rationale: Reports Gross Refining Margin (GRM) in $/bbl for refining subsidiaries
      (MRPL, HPCL).
  - table: subsidiary_financials
    column: international_production_mmtoe
    followup_id: X5.f2
    followup_text: What refining margins at MRPL/HPCL and international production
      volumes at OVL drove their financial performance?
    rationale: Reports overseas equity hydrocarbon production volume from ONGC Videsh
      (OVL).
  - table: energy_transition
    column: engineers_reskilled_count
    followup_id: X6.f2
    followup_text: What technical training programmes have been established at ONGC
      Academy to transition conventional engineers into renewable energy roles?
    rationale: Counts conventional oil & gas engineers trained at ONGC Academy for
      renewable energy roles.
  - table: contract_workforce
    column: contractor_cost_per_boe_usd
    followup_id: X1.f3
    followup_text: How does the contractor cost per BOE compare with regular employee
      cost across onshore and offshore assets?
    rationale: Computes contractor cost per barrel of oil equivalent produced for
      comparison against regular payroll.
  - table: contract_workforce
    column: is_core_activity
    followup_id: X2.f1
    followup_text: Which production installations in Gujarat and Assam employ contract
      personnel in drilling or hydrocarbon processing roles?
    rationale: Classifies whether contractor deployment is in core drilling/processing
      vs non-core support under CLRA.
  - table: hse_incidents
    column: monthly_overtime_hours_per_worker
    followup_id: X3.f1
    followup_text: Which offshore platforms in Mumbai High and Neelam-Heera recorded
      the highest monthly overtime hours per technician?
    rationale: Captures platform monthly overtime hours to correlate fatigue with
      near-miss and LTI rates.
  - table: hse_incidents
    column: calculated_ltifr
    followup_id: X3.f3
    followup_text: How does the safety incident frequency rate (LTIFR) in high-overtime
      assets compare with the corporate safety target?
    rationale: Computes Lost Time Injury Frequency Rate (LTIFR) per million man-hours
      to compare with corporate safety target.
  - table: hse_incidents
    column: fatigue_factor_flag
    followup_id: X3.f2
    followup_text: What role does fatigue from extended shift overtime play in near-misses
      and Lost Time Injuries (LTI)?
    rationale: Records whether investigation findings established extended shift fatigue
      as a root contributor.
  - table: cag_paras
    column: operating_department
    followup_id: X8.f1
    followup_text: Which operating departments (Procurement/MM, Finance, HR) have
      the largest volume of outstanding CAG audit paragraphs?
    rationale: Categorizes outstanding audit paragraphs by functional department (Procurement/MM,
      Finance, HR).
  - table: cag_paras
    column: is_aged_over_3_years
    followup_id: X8.f2
    followup_text: What procedural bottlenecks or documentation delays have prevented
      closure of audit paras aged over 3 years?
    rationale: Flags audit objections aged beyond 3 years awaiting final Action Taken
      Note (ATN) submission.
  - table: cag_paras
    column: bottleneck_reason
    followup_id: X8.f2
    followup_text: What procedural bottlenecks or documentation delays have prevented
      closure of audit paras aged over 3 years?
    rationale: Identifies documentation or reconciliation delays preventing closure
      of aged audit paras.
  - table: rti_applications
    column: is_within_30_days_statutory
    followup_id: X8.f3
    followup_text: What is our current RTI compliance and disposal rate compared to
      the statutory 30-day timeline mandated by the RTI Act?
    rationale: Tracks statutory compliance with the mandatory 30-day disposal timeline
      under the RTI Act.
  - table: rti_applications
    column: turnaround_days
    followup_id: X8.f3
    followup_text: What is our current RTI compliance and disposal rate compared to
      the statutory 30-day timeline mandated by the RTI Act?
    rationale: Measures elapsed processing days from receipt of application to formal
      disposal.
  - table: access_audit_log
    column: resource_data_classification
    followup_id: M5.f1
    followup_text: Break down the unauthorized access attempts by department (HR vs
      Finance vs Operations) and data type (salary, transfer, P&L).
    rationale: Classifies data confidentiality tier (confidential_salary, confidential_transfer_draft,
      confidential_field_pnl) for audit tracking.
  - table: access_audit_log
    column: denial_reason
    followup_id: M5.f2
    followup_text: Why did specific user accounts trigger repeated RBAC access denials
      on confidential commercial and personnel tables?
    rationale: Documents specific Role-Based Access Control rule triggering authorization
      denial on restricted tables.
tables:
  - table_name: dim_work_centre
    spec_id: R1
    description: Master reference dimension of ONGC work centres including operational
      assets, basins, processing plants, institutes, and corporate offices.
    grain: One row per canonical ONGC work centre
    primary_key:
      - wc_id
    columns:
      - name: wc_id
        type: STRING
        nullable: false
        description: Canonical work centre identifier (e.g. WC-DEL, WC-MUM)
      - name: name
        type: STRING
        nullable: false
        description: Official work centre name
      - name: short_name
        type: STRING
        nullable: false
        description: Common abbreviated name
      - name: type
        type: STRING
        nullable: false
        description: Work centre facility type
        accepted_values:
          - asset
          - basin
          - plant
          - institute
          - office
          - services
      - name: director_owner
        type: STRING
        nullable: false
        description: Functional Director responsible on Executive Committee
        accepted_values:
          - Chairman
          - Director (HR)
          - Director (Finance)
          - Director (Exploration)
          - Director (Production)
          - Director (Technical & Field Services)
      - name: city
        type: STRING
        nullable: false
        description: City or town location
      - name: state
        type: STRING
        nullable: false
        description: State of operation
      - name: state_code
        type: STRING
        nullable: false
        description: Two-letter state postal abbreviation
        fk: dim_geography.state_code
      - name: sector
        type: STRING
        nullable: false
        description: Geographical operational sector
        accepted_values:
          - Northern
          - Western
          - Southern
          - Eastern
          - North-East
          - Corporate
      - name: cluster_id
        type: STRING
        nullable: false
        description: Tenure cluster grouping identifier (e.g. CL-DEL, CL-MUM, CL-NE)
      - name: cluster_name
        type: STRING
        nullable: false
        description: Descriptive name of the transfer/tenure cluster
      - name: hard_station_cat
        type: STRING
        nullable: false
        description: Hard-station hardship category under Job Rotation & Transfer
          Policy
        accepted_values:
          - A
          - B
          - C
          - Special_Hardship
          - Offshore
      - name: onshore_offshore
        type: STRING
        nullable: false
        description: Operational domain classification
        accepted_values:
          - onshore
          - offshore
          - corporate
          - plant
      - name: is_corporate_hq
        type: BOOL
        nullable: false
        description: True if facility is Corporate HQ Delhi or Tel Bhavan Dehradun
      - name: aliases
        type: ARRAY<STRING>
        nullable: true
        description: Alternate or colloquial names used in queries
    source_system: Reference Data / HR Organogram
    source_format: YAML
    source_table: work_centres.yaml
    sap_field_map:
      WERKS: wc_id
      NAME1: name
      CITY1: city
      TXJCD: state_code
    scd_type: SCD1
    partitioning_clustering_suggestion:
      partition_by: null
      cluster_by:
        - sector
        - hard_station_cat
    drill_dimensions:
      - wc_id
      - type
      - director_owner
      - sector
      - cluster_id
      - hard_station_cat
      - onshore_offshore
    questions_served:
      - C1
      - C2
      - C3
      - C13
      - H1
      - H2
      - H3
      - H7
      - H10
      - P1
      - P2
      - P11
      - P12
      - T2
      - W3
      - M1
  - table_name: dim_grade
    spec_id: R2
    description: "Reference dimension of employee job grades across executive cadre\
      \ (E0\u2013E9) and non-executive pay bands."
    grain: One row per job grade
    primary_key:
      - grade_id
    columns:
