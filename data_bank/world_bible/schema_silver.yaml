        type: STRING
        nullable: false
        description: Pay commission framework
        accepted_values:
          - DPE-3rd-PRC
          - Union-Wage-Settlement
      - name: scale_source
        type: STRING
        nullable: false
        description: Statutory OM citation
      - name: promotion_mode
        type: STRING
        nullable: false
        description: Primary promotion mechanism
        accepted_values:
          - time_bound
          - merit
          - selection
      - name: typical_residency_years
        type: INT64
        nullable: false
        description: Standard residency period required before DPC review
      - name: dpc_evaluation_type
        type: STRING
        nullable: false
