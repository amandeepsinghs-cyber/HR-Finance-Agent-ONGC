      - name: level_order
        type: INT64
        nullable: false
        description: Numeric hierarchy rank (1 for E0, 10 for E9)
      - name: ta_da_travel_class
        type: STRING
        nullable: false
        description: Authorized travel class under TA/DA rules
        accepted_values:
          - Economy_Air
          - Business_Air
          - AC_First_Class
          - AC_2_Tier
      - name: daily_lodging_limit_cat_a_inr
        type: NUMERIC
        nullable: false
        description: Daily hotel entitlement limit for Class-A cities in INR
    source_system: HR Policies / DPE Guidelines
