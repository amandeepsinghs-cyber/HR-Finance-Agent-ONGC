reconstruction_requirements:
  JRTP:
    rulebook: JRTP
    target_title: Job Rotation & Transfer Policy (JRTP)
    mapped_questions:
    - E2
    - P1
    - P2
    - P3
    - P11
    - P12
    - P18
    - D2
    - D2_FU1
    - D2_FU3
    - D5
    - H10
    - H10_FU1
    - H10_FU2
    - H10_FU3
    - T2_FU2
    required_clauses:
    - clause_number: '1.0'
      title: Short Title, Commencement and Scope
      requirement: Applicable to all regular executives across work centres, plants, basins and corporate offices.
    - clause_number: '2.0'
      title: Definitions & Classification of Work Centres
      requirement: Defines Station, Work Centre, Geographic Cluster, Hard Station (Category C), and Offshore Duty.
    - clause_number: '3.0'
      title: Station Tenure Norms
      requirement: Minimum station tenure of 3 years; normal tenure 3 to 5 years before eligibility for transfer.
    - clause_number: '4.0'
      title: Cumulative Stay Cap
      requirement: Maximum cumulative stay of 10 years at a single city/station over entire career.
    - clause_number: '5.0'
      title: Geographic Clusters
      requirement: Specifies connected stations treated as single clusters (Delhi-NCR [Delhi/Noida/Gurgaon], Mumbai Urban
        [Mumbai/Navi Mumbai/Panvel], Gujarat [Ahmedabad/Chandkheda/Gandhinagar], Assam [Nazira/Sivasagar/Jorhat]).
    - clause_number: '6.0'
      title: Mandatory North-East / Hard Station Tenure
      requirement: Mandatory completion of at least one 3-year tenure in North-East / hard station / offshore prior to merit
        review promotion from E4 to E5.
    - clause_number: '7.0'
      title: Pre-Retirement Tenure Exemption
      requirement: Executives within 2 years of superannuation (age 58+) shall be exempt from outstation transfers.
    - clause_number: '8.0'
      title: Medical & Compassionate Grounds
      requirement: Procedures for medical exemption requests through Medical Board and Special Review Board.
    - clause_number: '9.0'
      title: Annual Transfer Calendar & Notification Procedure
      requirement: 'Annual general transfer schedule: initiated November, finalized March/April, notified on intranet portal.'
    - clause_number: '10.0'
      title: Replacement & Cadre Balancing Norms
      requirement: Mandates 1-for-1 discipline and experience matching for outgoing executives.
    - clause_number: '11.0'
      title: Confidentiality of Pre-Decisional Records
      requirement: Strict confidentiality of draft transfer lists and committee deliberations prior to final issue.
    - clause_number: '12.0'
      title: Competent Transfer Authorities
      requirement: 'Specifies approving authorities: Key Executive / Director (HR) / CMD by grade.'
    - clause_number: '13.0'
      title: Transfer Grievance Redressal Mechanism
      requirement: Right of representation within 15 days of order through designated grievance committee.
    real_excerpts:
    - doc_id: J-03
      clause_reference: Delhi HC LPA judgment, Para 2
      verbatim_quote: transferred from Rajahmundry to Chennai on the ground that the Respondent had completed his tenure of
        five years
    - doc_id: P1-16
      clause_reference: ONGC TA Regulations 2016, Annexure I
      verbatim_quote: Brihan Mumbai, Chennai, Kolkata, New Delhi (including Faridabad, Ghaziabad, Noida & Gurgaon), Bangalore,
        Hyderabad
  BDP summary:
    rulebook: BDP summary
    target_title: Book of Delegated Powers (BDP 2015 Summary)
    mapped_questions:
    - P16
    - P19
    - D4
    - M4
    required_clauses:
    - clause_number: '1.0'
      title: Principles of Financial Delegation
      requirement: General powers, financial limits structure, Level 1 through Level 5 authorities.
    - clause_number: '2.0'
      title: Asset Managers & Key Executives Powers
      requirement: Procurement sanctioning powers capped at ₹10 Crore; operational expenditure at ₹25 Crore.
    - clause_number: '3.0'
      title: Whole-Time Directors Financial Limits
      requirement: Sanctioning powers up to ₹50 Crore for capital contracts and operational works.
    - clause_number: '4.0'
      title: Executive Committee (EC) Financial Limits
      requirement: Sanctioning powers from ₹50 Crore to ₹100 Crore.
    - clause_number: '5.0'
      title: Chairman & Managing Director (CMD) Powers
      requirement: Financial approval powers up to ₹100 Crore and emergency operational powers.
    - clause_number: '6.0'
      title: Board of Directors Reserved Matters
      requirement: Matters exceeding ₹100 Crore, major drilling tenders, field farm-outs and capex approvals reserved for
        Board.
    - clause_number: '7.0'
      title: Technical and Expenditure Sanction Interlocks
      requirement: Mandatory concurrence of Associate Finance before exercise of delegated financial powers.
    - clause_number: '8.0'
      title: Commercial Confidentiality of Operational Schedules
      requirement: Detailed limits classified as internal controlled document.
    real_excerpts:
    - doc_id: P1-04
      clause_reference: Integrated Materials Management Manual (IMMM 2019), Clause 6.7.2
      verbatim_quote: The financial powers for according administrative approval / expenditure sanction / technical sanction
        shall be exercised as per powers delegated under the relevant 'Item No.' of BDP.
    - doc_id: J-18
      clause_reference: Gauhati HC judgment (Prasant Kumar Baruah v. UoI & ONGC)
      verbatim_quote: Book of Delegated Powers, 2015
  Leave Rules:
    rulebook: Leave Rules
    target_title: ONGC Leave Rules, 1995
    mapped_questions:
    - P4
    - P5
    required_clauses:
    - clause_number: '1.0'
      title: Short Title and Commencement
      requirement: Effective from 1995, governing all regular employees.
    - clause_number: '2.0'
      title: Categories of Leave
      requirement: Earned Leave (EL), Half Pay Leave (HPL), Commuted Leave, Extraordinary Leave (EOL), Study Leave.
    - clause_number: '3.0'
      title: Earned Leave Accrual & Accumulation
      requirement: Accrual of 30 days EL per calendar year (15 days on Jan 1 and Jul 1); maximum accumulation ceiling of 300
        days.
    - clause_number: '4.0'
      title: Encashment of Earned Leave
      requirement: Encashment upon superannuation / retirement subject to max ceiling of 300 days EL.
    - clause_number: '5.0'
      title: Half Pay Leave (HPL) Accrual & Encashment
      requirement: Accrual of 20 days HPL per completed year; encashment rules on retirement.
    - clause_number: '6.0'
      title: Study Leave Eligibility & Approval
      requirement: Minimum 5 years continuous service; study leave granted by Competent Authority.
    - clause_number: '7.0'
      title: Study Leave Service Bond
      requirement: Execution of mandatory service bond to serve ONGC for at least 3 years following study leave completion.
    - clause_number: '8.0'
      title: Extraordinary Leave (EOL) & Rule 14(5)
      requirement: Absence beyond admissible EOL deemed as resignation under Rule 14(5).
    - clause_number: '9.0'
      title: Forfeiture on Disciplinary Dismissal
      requirement: Dismissed employees forfeit leave encashment entitlement.
    real_excerpts:
    - doc_id: J-01
      clause_reference: Gauhati HC judgment, quoting ONGC Leave Rules 1995 Rule 14(5)
      verbatim_quote: shall be deemed to have resigned
    - doc_id: J-07
      clause_reference: Gauhati HC judgment, Sarat Chandra Buragohain v. ONGC
      verbatim_quote: leave encashment is not a bounty and is a part of terminal benefit
    - doc_id: J-08
      clause_reference: Court judgment, Dr Vikas S. Mahalkar v. ONGC
      verbatim_quote: Extraordinary Leave (EOL) without pay
  R&P/Promotion:
    rulebook: R&P/Promotion
    target_title: Modified Recruitment & Promotion Regulations 1980 & Service Rules 1995
    mapped_questions:
    - E4
    - P10
    - D3
    - H5_FU3
    required_clauses:
    - clause_number: '1.0'
      title: Executive Cadre Structure
      requirement: Grades E0 through E9, standard disciplines (Drilling, Production, Reservoir, Geology, Geophysics, F&A,
        HR, MM).
    - clause_number: '2.0'
      title: Time-Bound Promotion Channel (E1→E4)
      requirement: Residency requirement of 3 years at E1 for E2; 3 years at E2 for E3; 3 years at E3 for E4.
    - clause_number: '3.0'
      title: APAR Benchmark for Time-Bound Promotion
      requirement: Minimum PAR/APAR score threshold (e.g. Good / Very Good) across 3 years qualifying residency.
    - clause_number: '4.0'
      title: Merit Promotion Channel (E4→E5, E5→E6)
      requirement: Selection on merit through DPC interview/assessment, zone of consideration, and seniority weighting.
    - clause_number: '5.0'
      title: Mandatory Hard-Station Prerequisite for Promotion
      requirement: Pre-condition of at least one 3-year tenure in North-East or offshore/hard station for consideration to
        E5 Chief Engineer.
    - clause_number: '6.0'
      title: Departmental Promotion Committee (DPC) Constitution
      requirement: Committee constitution, proceedings, benchmarking standards.
    - clause_number: '7.0'
      title: Vigilance Clearance as Pre-Condition
      requirement: Clearance from Vigilance department mandatory prior to DPC empanelment and promotion order release.
    - clause_number: '8.0'
      title: Confidentiality of DPC Proceedings & Sealed Cover
      requirement: DPC deliberations are strictly confidential; sealed cover procedure for officers facing inquiry.
    real_excerpts:
    - doc_id: J-15
      clause_reference: Supreme Court / Delhi HC judgment, Dwarika Prasad v. ONGC
      verbatim_quote: Promotion from one post to another higher post shall be made on the basis of selection on merit or seniority-cum-fitness
