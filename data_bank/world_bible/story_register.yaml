    = 964–1,378). Annual retirements reconcile with public separation benchmarks (~1,350–1,420 total company separations).
  test_sql_hint: SELECT COUNT(*) = 47 FROM silver_employee_master WHERE grade IN ('E7','E8','E9') AND dob >= '1966-04-01'
