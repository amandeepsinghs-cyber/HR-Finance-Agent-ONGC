      value: 1142
      unit: count
      computation_definition: COUNT(emp_id) FROM employee_master WHERE grade IN ('E7','E8','E9') AND status = 'active'
    e7_plus_retiring_fy27_to_fy29:
      value: 47
      unit: count
      computation_definition: COUNT(emp_id) FROM employee_master WHERE grade IN ('E7','E8','E9') AND dob BETWEEN '1966-04-01'
        AND '1969-03-31' -- retiring between 2026-04-01 and 2029-03-31
    e7_plus_retiring_fy27:
      value: 18
      unit: count
      computation_definition: E7+ retiring in FY27
    e7_plus_retiring_fy28:
      value: 16
      unit: count
      computation_definition: E7+ retiring in FY28
    e7_plus_retiring_fy29:
      value: 13
      unit: count
      computation_definition: E7+ retiring in FY29
    critical_roles_with_no_ready_successor:
      value: 11
      unit: count
      computation_definition: COUNT(DISTINCT role_id) FROM succession_plan WHERE incumbent_retiring_fy <= 'FY29' AND ready_now_count
        = 0
  who: 'Nominative roster of the 47 retiring senior officers, highlighting the 11 critical vacant positions: Asset Manager
    Cauvery, Chief Drilling Services Jorhat, Head Geophysics KDMIPE, Head Process Safety Hazira, Head Subsea Systems Eastern
    Offshore, Chief Reservoir Engineer Mumbai, among others.'
  why: 'Table H1 (employee_master: dob, grade) and H10 (succession_plan: readiness_rating). Legacy recruitment pauses during
    the late 1990s created a hollowed-out pipeline of E5/E6 officers with requisite technical vintage.'
  compare: Retirement rate in E7–E9 over next 3 years is 4.1% annually, but in critical operational disciplines (DRL, HSE),
    the turnover of Key Leadership Personnel exceeds 18%.
  so_what: Urgent input for the Departmental Promotion Committee (DPC) and PESB selection schedules. Requires targeted fast-tracking
    of high-potential E5/E6 officers under the Leadership Development Program (LDP).
