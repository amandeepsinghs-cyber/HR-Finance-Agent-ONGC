stories:
- id: S1
  title: Corporate HQ Delhi Tenure Accumulation & Ten-Year Cap Breaches
  narrative: Senior executive overstay at Corporate HQ Delhi (Deendayal Urja Bhawan) has reached critical levels, with 412
    executives completing 5 or more continuous years. Crucially, 138 officers have exceeded the 10-year cumulative Delhi NCR
    cluster cap under JRTP Clause 4.3, of whom only 31 qualify for superannuation exemption within 3 years, leaving 107 non-exempt
    officers due for mandatory transfer.
  entities:
    work_centres:
    - WC-DEL
    fields: []
    projects: []
    grades:
    - E1
    - E2
    - E3
    - E4
    - E5
    - E6
    - E7
    - E8
    - E9
    disciplines:
    - FIN
    - HR
    - MM
    - IT
    - LEG
    - GEO
    - PRD
    - DRL
    customers: []
    vendors: []
    states:
    - DL
  exact_numbers:
    delhi_executives_ge_5yr:
      value: 412
      unit: count
      computation_definition: COUNT(DISTINCT emp_id) FROM posting_history WHERE wc_id = 'WC-DEL' AND to_dt IS NULL AND grade
        LIKE 'E%' AND from_dt <= '2021-10-19'
    delhi_cluster_ge_10yr_cumulative:
      value: 138
      unit: count
      computation_definition: COUNT(DISTINCT emp_id) FROM posting_history WHERE wc_id IN ('WC-DEL') AND grade LIKE 'E%' GROUP
        BY emp_id HAVING SUM(DATE_DIFF(COALESCE(to_dt, '2026-10-19'), from_dt, DAY)) >= 3652
    delhi_10yr_superannuation_exempt:
      value: 31
      unit: count
      computation_definition: COUNT(DISTINCT e.emp_id) FROM employee_master e JOIN (delhi_cluster_ge_10yr) d ON e.emp_id =
        d.emp_id WHERE e.dob <= '1969-10-19' -- age >= 57, retiring on or before 2029-10-19
    delhi_mandatory_transfer_due:
      value: 107
      unit: count
      computation_definition: 138 cumulative overstay officers minus 31 superannuation-exempt officers
  who: Exact list of 412 executives stationed at WC-DEL where continuous active posting started on or before 19-Oct-2021.
    Filtered subset of 138 officers with cumulative tenure >= 10 years across Delhi NCR postings, and sub-list of 107 non-exempt
    officers due for AGT FY27 transfer orders.
  why: 'Table H2 (posting_history) driver columns: `posting_type` (''rotation'', ''request'', ''deputation''), `exemption_reason`
    (''competent_authority_extension'', ''medical_ground_spouse'', ''project_continuity''), and `cluster_id` (''NCR_DELHI'').
    Historical inertia and project retention extensions granted between 2020-2024.'
  compare: At Corporate HQ Delhi, 80.0% of in-position executives (412 of 515) have >= 5 continuous years, compared to 34.2%
    at Tel Bhavan Dehradun (WC-DDN) and a company-wide field average of 18.5%.
  so_what: Violates ONGC Job Rotation & Transfer Policy (JRTP) 2018 Clause 4.3 (maximum 10-year cumulative city tenure) and
    DPE guidelines. Directly drives the FY27 Annual General Transfer (AGT) proposal sheet.
  tables:
  - H1
  - H2
  - H7
  questions_served:
  - C1
  - C1:drill_down
  - C1:why
  - C1:compare_or_so_what
  - P11
  - P11:drill_down
  - P11:why
  - P11:compare_or_so_what
  - T2
  - T2:drill_down
  - T2:why
  - T2:compare_or_so_what
  consistency_constraints: The 412 Delhi long-tenure executives and 515 total Delhi executives are strictly contained within
    the 13,781 regular executive total (CAL-HR-STR-EXEC) and Delhi modelled allocation (600-900 total employees). Exempt count
    (31) aligns with age band >50 (CAL-HR-AGE-GT50-FY26).
  test_sql_hint: SELECT COUNT(*) = 412 FROM silver_posting_history WHERE wc_id = 'WC-DEL' AND to_dt IS NULL AND from_dt <=
    '2021-10-19' AND grade IN ('E1','E2','E3','E4','E5','E6','E7','E8','E9');
- id: S2
  title: North-East Executive Deployment Deficit & Hard Station Avoidance
  narrative: Operational readiness across North-East assets exhibits an operational manpower-norm shortfall of 191 executives
    (9.01% gap against the technical staffing plan of 2,120, with 1,929 in-position). Formal sanctioned vacancies in Assam
    strictly equal 30 non-executives (24 Grp C, 6 Grp D) and 0 executives per Lok Sabha LS2067. Meanwhile, 260 mid-career
    executives (E3–E5) company-wide have evaded mandatory hard/remote station service required under JRTP Clause 6.1.
  entities:
    work_centres:
    - WC-ASM
    - WC-JOR
    - WC-TRI
    - WC-SIL
    fields:
    - FLD-GEL
    - FLD-LAK
    - FLD-RDS
    - FLD-BOR
    - FLD-ROK
    - FLD-AGT
    projects: []
    grades:
    - E3
    - E4
    - E5
    disciplines:
    - DRL
    - PRD
    - RES
    - GEO
    - GPS
    - MEC
    - ELE
    customers: []
    vendors: []
    states:
    - AS
    - TR
  exact_numbers:
    ne_executive_manpower_norm:
      value: 2120
      unit: count
      computation_definition: SUM(required_strength_norm) FROM manpower_planning WHERE wc_id IN ('WC-ASM','WC-JOR','WC-TRI','WC-SIL')
        AND cadre = 'executive'
    ne_executive_in_position:
      value: 1929
      unit: count
      computation_definition: COUNT(emp_id) FROM employee_master WHERE current_wc_id IN ('WC-ASM','WC-JOR','WC-TRI','WC-SIL')
        AND cadre = 'executive'
    ne_executive_norm_shortfall:
      value: 191
      unit: count
      computation_definition: 2120 operational norm minus 1929 in-position executives
    ne_executive_norm_shortfall_pct:
      value: 9.01
      unit: percentage
      computation_definition: (191 / 2120) * 100
    assam_formal_sanctioned_vacancies_total:
      value: 30
      unit: count
      computation_definition: CAL-GOV-PARL-ASSAM-VAC (official Lok Sabha LS2067 reported vacancies)
    assam_formal_executive_vacancies:
      value: 0
      unit: count
      computation_definition: Formal sanctioned executive vacancies in Assam per LS2067
    assam_formal_non_executive_vacancies:
      value: 30
      unit: count
      computation_definition: Group C (24) + Group D (6) formal vacancies per LS2067
    e3_to_e5_never_hard_station:
      value: 260
      unit: count
      computation_definition: COUNT(DISTINCT e.emp_id) FROM employee_master e WHERE e.grade IN ('E3','E4','E5') AND e.emp_id
        NOT IN (SELECT DISTINCT emp_id FROM posting_history WHERE is_hard_station = TRUE)
  who: Operational manpower deployment registers tracking the 191 executive deployment deficit across Assam Asset (85), Jorhat
    (40), Tripura (44), and Silchar (22); paired with the nominative list of 260 E3–E5 officers (112 in E3, 88 in E4, 60 in
    E5) without hard station history.
  why: Table H6 (sanctioned_posts vs manpower_norm) and H1 (employee_master). Reluctance of officers to accept NE postings,
    frequent medical exemption requests, and preference for urban hubs. Formal sanctioned posts are tightly controlled (Assam
    formal vacancies = 30), but operational deployment norms require higher technical coverage.
  compare: Operational executive deficit in NE (9.01%) is more than double Western Offshore (3.8%) and Gujarat Onshore (4.2%).
    Among technical disciplines (DRL/PRD), NE operational deficit reaches 14.5%.
  so_what: Breaches JRTP Clause 6.1 (mandatory 2-year NE/hard-station tenure prior to consideration for promotion to E5).
    Forms the primary recipient pool for transfers generated under S1.
  tables:
  - H1
  - H2
  - H6
  - H7
  questions_served:
  - C2
  - C2:drill_down
  - C2:why
  - C2:compare_or_so_what
  - H2
  - H2:drill_down
  - H2:why
  - H2:compare_or_so_what
  - P12
  - P12:drill_down
  - P12:why
  - P12:compare_or_so_what
  consistency_constraints: 'Total Assam state headcount across all regular employees strictly equals 3,561 (CAL-HR-LOC-ASSAM-TOT:
    1,518 executives + 2,043 non-executives). Formal sanctioned vacancies in Assam sum to exactly 30 (0 executive, 24 Group
    C, 6 Group D per CAL-GOV-PARL-ASSAM-VAC). The 1,929 NE executives combine Assam state (1,518) and Tripura (411).'
  test_sql_hint: SELECT (2120 - COUNT(*)) = 191 FROM silver_employee_master WHERE current_wc_id IN ('WC-ASM','WC-JOR','WC-TRI','WC-SIL')
    AND grade LIKE 'E%';
- id: S3
  title: 'Headcount Divergence: Deepwater Expansion vs Mature Basin Contraction'
  narrative: Over the 5-year period FY21–FY26, regular employee deployment shifted sharply toward eastern deepwater hubs.
    Eastern Offshore (WC-EAS) and Rajahmundry (WC-RAJ) expanded headcount by 33.87% and 22.02% respectively to support KG-DWN-98/2
    commissioning, whereas mature onshore assets Mehsana (-12.39%) and Cauvery (-12.29%) contracted.
  entities:
    work_centres:
    - WC-EAS
    - WC-RAJ
    - WC-MEH
    - WC-CAU
    fields:
    - FLD-KG982
    - FLD-PAS
    - FLD-SNT
    - FLD-NAR
    projects:
    - PRJ-0001
    grades:
    - E0
    - E1
    - E2
    - E3
    - E4
    - E5
    - E6
    - E7
    - GRP-B
    - GRP-C
    - GRP-D
    disciplines:
    - PRD
    - DRL
    - RES
    - INS
    - MEC
    customers: []
    vendors: []
    states:
    - AP
    - GJ
    - TN
  exact_numbers:
    eastern_offshore_hc_fy21:
      value: 620
      unit: count
      computation_definition: Headcount at WC-EAS at 31-Mar-2021
    eastern_offshore_hc_fy26:
      value: 830
      unit: count
      computation_definition: Headcount at WC-EAS at 31-Mar-2026
    eastern_offshore_growth_pct:
      value: 33.87
      unit: percentage
      computation_definition: ((830 - 620) / 620) * 100
    rajahmundry_hc_fy21:
      value: 840
      unit: count
      computation_definition: Headcount at WC-RAJ at 31-Mar-2021
    rajahmundry_hc_fy26:
      value: 1025
      unit: count
      computation_definition: Headcount at WC-RAJ at 31-Mar-2026
    rajahmundry_growth_pct:
      value: 22.02
      unit: percentage
      computation_definition: ((1025 - 840) / 840) * 100
    mehsana_hc_fy21:
      value: 2340
      unit: count
      computation_definition: Headcount at WC-MEH at 31-Mar-2021
    mehsana_hc_fy26:
      value: 2050
      unit: count
      computation_definition: Headcount at WC-MEH at 31-Mar-2026
    mehsana_change_pct:
      value: -12.39
      unit: percentage
      computation_definition: ((2050 - 2340) / 2340) * 100
    cauvery_hc_fy21:
      value: 1180
      unit: count
      computation_definition: Headcount at WC-CAU at 31-Mar-2021
    cauvery_hc_fy26:
      value: 1035
      unit: count
      computation_definition: Headcount at WC-CAU at 31-Mar-2026
    cauvery_change_pct:
      value: -12.29
      unit: percentage
      computation_definition: ((1035 - 1180) / 1180) * 100
  who: Complete employee movement registers tracking transfers into WC-EAS (+210 net) and WC-RAJ (+185 net), offset by natural
    attrition and non-replacement at WC-MEH (-290 net) and WC-CAU (-145 net).
  why: Table H2 (posting_history) and project manpower sanctions for PRJ-0001. Redeployment of subsea production, drilling
    fluids, and instrumentation specialists from declining onshore wells to offshore floating facilities.
  compare: Company-wide regular employee headcount declined by 18.20% from 28,260 in FY21 to 23,117 in FY26. Eastern Offshore
    and Rajahmundry were the only two production assets exhibiting positive net growth.
  so_what: Directs strategic manpower allocation and succession planning for deepwater operations. Highlights asset-level
    strain where mature fields lose experience while deepwater assets experience onboarding friction.
  tables:
  - H1
  - H2
  - H7
  - F8
  questions_served:
  - C3
  - C3:drill_down
  - C3:why
  - C3:compare_or_so_what
  - M1
  - M1:drill_down
  - M1:why
  - M1:compare_or_so_what
  consistency_constraints: 'All asset headcount figures reconcile with historical calibration targets (CAL-HR-HC-FY21: 28,260;
    CAL-HR-HC-FY26: 23,117). Asset sums stay strictly within asset_level_headcount modelled assumptions.'
  test_sql_hint: SELECT (SELECT COUNT(*) FROM silver_employee_master WHERE current_wc_id = 'WC-EAS') = 830, (SELECT COUNT(*)
    FROM silver_employee_master WHERE current_wc_id = 'WC-MEH') = 2050;
- id: S4
  title: General Manager (E7+) Retirement Cliff & Critical Succession Vacuum
  narrative: 'A demographic retirement wave threatens leadership continuity: 47 General Managers and above (E7–E9) will retire
    between FY27 and FY29. Among their posts, 11 mission-critical operational roles lack any ready (''Ready Now'') successor
    in the succession pipeline, posing acute operational risks for deepwater, drilling, and process safety.'
  entities:
    work_centres:
    - WC-MUM
    - WC-EAS
    - WC-JOR
    - WC-HAZ
    - WC-KDM
    - WC-DEL
    fields:
