served_without_story:
- question_id: E4
  type: policy
  policy_doc: DOC-RP-RULES
  clause: Clause 8.1
  reason: Pure policy query regarding E2 to E3 promotion criteria. Answered deterministically from ONGC Modified R&P Rules
    2019 (3-year residency in E2, screening-based DPC, minimum 'Good' APAR benchmark).
- question_id: E5
  type: policy
  policy_doc: DOC-TA-RULES
  clause: Clause 8.3 & Offshore Allowance Circular 2021
  reason: Pure policy query regarding offshore TA/DA entitlements. Answered from ONGC TA/DA Rules Table 4 and Offshore Allowance
    circular (₹1,500/day offshore special duty allowance, complimentary boarding/lodging on platform).
- question_id: P1
  type: policy
  policy_doc: DOC-JRTP
  clause: Clause 4.1 & Clause 4.3
  reason: Pure policy query regarding minimum station tenure (3 years) and maximum cumulative stay (10 years) under JRTP 2018.
- question_id: P2
  type: policy
  policy_doc: DOC-JRTP
  clause: Clause 5.2
  reason: Pure policy query regarding contiguous urban cluster definitions (Delhi NCR cluster = Delhi, Noida, Gurgaon; Mumbai
    cluster = Mumbai, Panvel, Nhava, Uran).
- question_id: P3
  type: policy
  policy_doc: DOC-JRTP
  clause: Clause 7.2
  reason: Pure policy query regarding superannuation exemption. Officers within 2 years of superannuation (expanded to 3 years
    on medical/compassionate approval) are exempt from rotational transfer.
- question_id: P4
  type: policy
  policy_doc: DOC-LEAVE-RULES
  clause: Rule 14.1 & Rule 14.3
  reason: Pure policy query regarding earned leave accumulation (maximum 300 days) and encashment ceiling at retirement.
- question_id: P5
  type: policy
  policy_doc: DOC-STUDY-LEAVE
  clause: Clause 6.1 & Clause 6.4
  reason: Pure policy query regarding study leave eligibility (minimum 5 years continuous regular service, maximum 24 months,
    3-year mandatory return service bond).
- question_id: P6
  type: policy
  policy_doc: DOC-CDA-RULES
  clause: Rule 13.2
  reason: Pure policy query regarding gift acceptance from commercial entities under ONGC Conduct, Discipline and Appeal (CDA)
    Rules (strictly zero from commercial vendors; maximum ₹5,000 from personal friends/relatives on ceremonial occasions).
- question_id: P7
  type: policy
  policy_doc: DOC-TA-RULES
  clause: Clause 4.2, Table 2
  reason: Pure policy query regarding travel entitlements for E2 officer to Mumbai (Economy class air travel / 2nd AC train,
    lodging ceiling ₹4,500/day in A-class city).
- question_id: P8
  type: policy
  policy_doc: DOC-WHISTLE-BLOWER
  clause: Clause 5.1 & Clause 7.2
  reason: Pure policy query regarding confidential reporting channels and anti-victimisation protections under ONGC Whistle
    Blower Policy.
- question_id: P9
  type: policy
  policy_doc: DOC-POSH-POLICY
  clause: Clause 4.1 & Clause 6.2
  reason: Pure policy query regarding filing a Prevention of Sexual Harassment (POSH) complaint and station Internal Complaints
    Committee (ICC) composition.
- question_id: P10
  type: policy
  policy_doc: DOC-RP-RULES
  clause: Clause 9.2
  reason: Pure policy query regarding E3 to E4 promotion criteria (4 years residency, merit-cum-seniority evaluation, 'Very
    Good' APAR benchmark).
- question_id: D1
  type: refusal
  policy_doc: DOC-INFOSEC-POLICY / RTI Section 8(1)(j)
  clause: Personal Remuneration Privacy
  reason: Individual peer or supervisor salary records are confidential personal data protected under privacy law.
- question_id: D2
  type: refusal
  policy_doc: DOC-JRTP / HR Confidentiality Guidelines
  clause: Pre-decisional Transfer Drafts
  reason: Draft transfer proposals are unapproved internal working drafts inaccessible to general employees prior to formal
    notification.
- question_id: D3
  type: refusal
  policy_doc: DOC-RP-RULES
  clause: Confidential DPC Proceedings
  reason: Departmental Promotion Committee deliberations and candidate rankings are classified confidential until executive
    orders issue.
- question_id: D4
  type: refusal
  policy_doc: DOC-FIN-SECURITY
  clause: Commercial Field Economics
  reason: Field-level profitability, lifting cost, and forward capital budgets are restricted to E5+ leadership and Board
    members.
- question_id: D5
  type: refusal
  policy_doc: DOC-INFOSEC-POLICY
  clause: Bulk Personnel Profiling
  reason: Bulk extraction of employee station tenures and demographic rosters by non-HR personnel is prohibited to prevent
    administrative profiling.
- question_id: D6
  type: refusal
  policy_doc: DOC-VIGILANCE-MANUAL / CVC Guidelines
  clause: Vigilance Case Confidentiality
  reason: Live vigilance inquiries, disciplinary investigations, and agreed lists are classified secret under Central Vigilance
    Commission directives.
- question_id: P18
  type: refusal
  policy_doc: DOC-JRTP
  clause: Pre-Notification Transfer Security
  reason: Draft FY27 Annual General Transfer Order is a classified pre-decisional document inaccessible until formal promulgation.
- question_id: P19
  type: refusal
  policy_doc: DOC-BODP
  clause: Comprehensive Commercial Delegations
  reason: Full internal financial delegation registers containing commercial and tender ceilings are restricted to authorized
    finance and audit controllers.
- question_id: P20
  type: refusal
  policy_doc: DOC-BOARD-GOVERNANCE / SEBI (PIT) Reg 2015
  clause: Unpublished Price-Sensitive Information (UPSI)
  reason: Board agenda notes on marginal field divestments constitute unpublished price-sensitive information under SEBI Insider
    Trading regulations.
- question_id: M3
  type: refusal
  policy_doc: DOC-INFOSEC-POLICY
  clause: Individual Performance Appraisal (APAR) Privacy
  reason: Individual APAR gradings and salary slips are private personnel data accessible solely to the employee and designated
    reporting authorities.
- question_id: M4
  type: refusal
  policy_doc: DOC-FIN-SECURITY
  clause: Commercially Sensitive P&L Access
  reason: Granular field-by-field profitability metrics are inaccessible to junior self-service users, requiring Level-1 management
    authorization.
