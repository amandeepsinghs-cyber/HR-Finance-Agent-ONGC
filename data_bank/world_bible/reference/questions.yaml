questions:
- id: C1
  group: CMD people and transfers
  personas:
  - CMD
  question: How many executives have been posted in the Delhi office for 5 years or more? Break down by grade and discipline.
  decision_it_drives: Transfer rotation
  type: data
  expected_output: table
  followups:
  - kind: drill_down
    question: Which specific disciplines in Delhi (e.g. F&A, HR, MM, Legal) have the highest concentration of E5–E7 officers
      past 5 years?
  - kind: why
    question: What are the approved administrative justifications or exemption tags recorded in SAP for those exceeding 5
      years in Delhi?
  - kind: compare_or_so_what
    question: How does the Delhi retention rate compare with corporate headquarters in Dehradun (Tel Bhavan) and Mumbai?
- id: C2
  group: CMD people and transfers
  personas:
  - CMD
  question: Who is overdue for transfer under the rotation policy, and which hard or remote stations (NE, offshore) are short
    of people to receive them?
  decision_it_drives: Annual transfer order
  type: data
  expected_output: table
  followups:
  - kind: drill_down
    question: What is the discipline-wise deficit in Assam Asset (Nazira/Sivasagar) and Tripura Asset (Agartala) versus sanctioned
      posts?
  - kind: why
    question: Why have previous annual transfer cycles left North-East work centres persistently below sanctioned executive
      strength?
  - kind: compare_or_so_what
    question: How many of the overdue executives have never completed a mandatory tenure in a Category-C or offshore location?
- id: C3
  group: CMD people and transfers
  personas:
  - CMD
  question: Which areas saw no headcount increase in the last 5 years, and which saw the most?
  decision_it_drives: Manpower rebalancing
  type: data
  expected_output: table
  followups:
  - kind: drill_down
    question: Break down the 5-year headcount trajectory of Rajahmundry, Eastern Offshore, Mehsana, and Cambay by executive
      vs non-executive.
  - kind: why
    question: What operational developments (e.g. KG-DWN-98/2 deepwater ramp-up vs mature field natural decline) drove this
      headcount shift?
  - kind: compare_or_so_what
    question: How does the asset-wise headcount growth compare with the 5-year oil and gas production growth rate across those
      same assets?
- id: C4
  group: CMD people and transfers
  personas:
  - CMD
  question: How many E7+ (GM and above) officers retire in the next 3 years, and which of those roles have no ready successor?
  decision_it_drives: Succession planning
  type: data
  expected_output: table
  followups:
  - kind: drill_down
    question: Which key operational roles in Offshore (Mumbai High, Neelam-Heera) and Drilling have retirement vacancies within
      12 months?
  - kind: why
    question: Why are certain critical E7+ positions identified as having zero 'Ready Now' successors in the latest succession
      board review?
  - kind: compare_or_so_what
    question: What percentage of eligible E6 Chief Engineers / Chief Geologists meet the DPC benchmark for accelerated promotion
      to GM?
- id: C5
  group: CMD people and transfers
  personas:
  - CMD
  question: Which disciplines (geoscience, drilling, reservoir, production) face the biggest retirement-driven skill gap by
    2030?
  decision_it_drives: Recruitment and campus hiring
  type: data
  expected_output: table
  followups:
  - kind: drill_down
    question: What is the projected cumulative superannuation count in Geology, Geophysics, and Reservoir Engineering by FY30?
  - kind: why
    question: Why has low executive trainee recruitment between FY20 and FY25 exacerbated the mid-career seniority vacuum?
  - kind: compare_or_so_what
    question: How does our projected technical specialist loss compare with planned deepwater and HP-HT exploration projects?
- id: C6
  group: CMD money and assets
  personas:
  - CMD
  question: Which fields or assets were the most profitable and which made losses in FY26?
  decision_it_drives: Portfolio focus
  type: data
  expected_output: table
  followups:
  - kind: drill_down
    question: What were the individual net margins and EBITDA of mature onshore fields in Assam and Cauvery in FY26?
  - kind: why
    question: What are the primary cost drivers (e.g. high water cut, power costs, workover frequency, aging surface facilities)
      behind the loss-making fields?
  - kind: compare_or_so_what
    question: How do the profit margins of Mumbai High and Bassein compare with onshore assets like Ankleshwar and Mehsana?
- id: C7
  group: CMD money and assets
  personas:
  - CMD
  question: Where have we invested the most capex in the last 5 years, and which fields are under-invested relative to their
    reserves?
  decision_it_drives: Capex reallocation
  type: data
  expected_output: table
  followups:
  - kind: drill_down
    question: What is the cumulative 5-year capex allocation across Western Offshore (MH, B&S) versus Eastern Offshore (KG
      Basin)?
  - kind: why
    question: Why did fields with substantial 2P oil/gas reserves receive less development drilling capex than planned in
      the BE/RE cycles?
  - kind: compare_or_so_what
    question: How does the reserve replacement ratio (RRR) and capital intensity ($/BOE added) compare between KG-98/2 and
      Mumbai High Redevelopment?
- id: C8
  group: CMD money and assets
  personas:
  - CMD
  question: Which loss-making mature fields are candidates for divestment, a Production Enhancement Contract, or a marginal-field
    offer?
  decision_it_drives: Monetise or exit
  type: data
  expected_output: list
  followups:
  - kind: drill_down
    question: Which specific fields in Assam and Cambay have sustained negative EBITDA for 3 consecutive fiscal years?
  - kind: why
    question: What technical operating constraints make in-house secondary/tertiary recovery uneconomic compared to third-party
      PEC operators?
  - kind: compare_or_so_what
    question: What would be the estimated capex and opex savings if the bottom 5 loss-making marginal fields are monetised
      or farmed out?
- id: C9
  group: CMD money and assets
  personas:
  - CMD
  question: Which major projects are behind schedule or over budget, and by how many crore?
  decision_it_drives: Project intervention
  type: data
  expected_output: table
  followups:
  - kind: drill_down
    question: What is the current schedule slippage and cost overrun on the KG-DWN-98/2 development and Western Offshore pipeline
      replacement projects?
  - kind: why
    question: What engineering, fabrication, or contractor delivery delays caused the milestone slippages across these projects?
  - kind: compare_or_so_what
    question: How does the anticipated final cost compare against the original Board-sanctioned budget and subsequent Revised
      Cost Estimates (RCE)?
- id: C10
  group: CMD money and assets
  personas:
  - CMD
  question: How are we tracking against our MoU targets with MoPNG/DPE for this year?
  decision_it_drives: Board and Ministry review
  type: data
  expected_output: table
  followups:
  - kind: drill_down
    question: Which specific MoU parameters (crude production, natural gas sales, capex expenditure, RRR) are currently rated
      below 'Excellent'?
  - kind: why
    question: Why did Q2 natural gas production and development well drilling targets fall behind the DPE MoU milestone schedule?
  - kind: compare_or_so_what
    question: What is the projected year-end composite score under current trends compared to the 'Excellent' rating achieved
      in FY25?
- id: C11
  group: CMD cross-silo HR × Finance
  personas:
  - CMD
  question: Which assets added headcount but lost production over 5 years?
  decision_it_drives: Productivity correction
  type: data
  expected_output: table
  followups:
  - kind: drill_down
    question: What is the specific 5-year headcount change and crude/gas output variance for Mehsana, Assam, and Rajahmundry
      assets?
  - kind: why
    question: Why did surface engineering and administrative staffing expand despite continuous reservoir pressure and production
      declines?
  - kind: compare_or_so_what
    question: How does the labor productivity (BOE per employee) in expanding assets compare with the ONGC corporate average?
- id: C12
  group: CMD cross-silo HR × Finance
  personas:
  - CMD
  question: What is the manpower cost per barrel of oil equivalent (BOE), by asset?
  decision_it_drives: Benchmarking and restructuring
  type: data
  expected_output: table
  followups:
  - kind: drill_down
    question: Break down the manpower cost per BOE for Mumbai High, Neelam-Heera, Ahmedabad, and Assam into executive vs non-executive
      payroll.
  - kind: why
    question: Why is manpower cost per BOE significantly higher at mature, low-volume onshore fields compared to offshore
      assets?
  - kind: compare_or_so_what
    question: How does ONGC's overall manpower cost per BOE compare with Indian peer upstream operators (e.g. Oil India Limited)?
- id: C13
  group: CMD cross-silo HR × Finance
  personas:
  - CMD
  question: If we move 200 executives from Delhi/Dehradun to field assets, what changes in cost and coverage?
  decision_it_drives: Transfer impact simulation
  type: what_if
  expected_output: table
  followups:
  - kind: drill_down
    question: Which field assets (e.g. Assam, Tripura, Karaikal) would gain the most production and maintenance engineering
      coverage?
  - kind: why
    question: What one-time transfer grant, composite transfer allowance (CTA), and baggage transportation costs would be
      incurred?
  - kind: compare_or_so_what
    question: How would the reduction in Delhi/Dehradun corporate overhead compare against improved field asset uptime and
      supervisor ratios?
- id: C14
  group: CMD cross-silo HR × Finance
  personas:
  - CMD
  question: 'Prepare a one-page board note on the top 5 loss-making fields: production, cost, staffing and a recommendation.'
