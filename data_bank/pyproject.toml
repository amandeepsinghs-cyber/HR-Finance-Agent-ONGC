[project]
name = "ongc-data-bank"
version = "0.1.0"
description = "Synthetic data bank generator and medallion pipeline for ONGC HR & Finance Agent"
readme = "DATA_GENERATION_CHECKLIST.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "duckdb>=1.5.6",
    "faker>=30.0.0",
    "google-cloud-bigquery>=3.25.0",
    "google-cloud-discoveryengine>=0.20.5",
    "google-cloud-documentai>=3.16.0",
    "google-cloud-storage>=2.18.0",
    "matplotlib>=3.11.2",
    "numpy>=1.26.0",
    "openpyxl>=3.1.0",
    "pandas>=2.2.0",
    "pdf2image>=1.17.0",
    "pillow>=10.4.0",
    "pyarrow>=17.0.0",
    "pypdf>=6.21.1",
    "pytest>=8.0.0",
    "python-docx>=1.1.0",
    "pyyaml>=6.0.0",
    "reportlab>=4.2.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
