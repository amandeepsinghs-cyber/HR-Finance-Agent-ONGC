metadata:
  version: '1.0'
  phase: '5.3'
  total_questions: 89
  phrasings_per_question: 3
  total_paraphrases: 267
  styles:
  - formal
  - casual
  - hinglish
paraphrases:
- id: C1
  original: How many executives have been posted in the Delhi office for 5 years or more? Break down by grade and discipline.
  formal: Kindly provide a comprehensive statement showing the executive cadre deployment in the New Delhi Corporate Office
    with continuous station tenure exceeding five years, categorized by grade and functional discipline.
  casual: How many officers have been sitting in Delhi office for 5 years or longer? Break it down by grade and discipline.
  hinglish: Delhi office mein 5 saal se zyada kitne executives posted hain? Grade aur discipline wise list dikhana zara.
- id: C2
  original: Who is overdue for transfer under the rotation policy, and which hard or remote stations (NE, offshore) are short
    of people to receive them?
  formal: Please present the nominal roll of executives due for rotational transfer under the Job Rotation and Transfer Policy,
    alongside current vacancy deficits across Category-C hard stations and offshore installations.
  casual: Who all are overdue for transfer right now, and which tough stations like North-East or offshore need people immediately?
  hinglish: Rotation policy ke hisaab se kaun kaun transfer ke liye overdue hai, aur Assam/Tripura ya offshore mein kahan
    vacancy sabse zyada hai?
- id: C3
  original: Which areas saw no headcount increase in the last 5 years, and which saw the most?
  formal: Kindly furnish a 5-year longitudinal analysis of executive and non-executive strength across work centres, identifying
    assets with stagnant staffing versus those exhibiting significant headcount growth.
  casual: Which of our assets haven't seen any staff addition over the last 5 years, and where did headcount increase the
    most?
  hinglish: Pichle 5 saal mein kaunse work centres mein headcount bilkul nahi badha, aur kahan sabse zyada log add hue?
- id: C4
  original: How many E7+ (GM and above) officers retire in the next 3 years, and which of those roles have no ready successor?
  formal: Provide a schedule of superannuations for senior management personnel in Grade E7 and above over the ensuing three-year
    horizon, highlighting critical functional positions devoid of designated successors.
  casual: How many GMs and EDs are retiring in the next 3 years, and which key roles don't have any successor lined up?
  hinglish: Agle 3 saal mein kitne E7 aur above officers retire ho rahe hain, aur kaunsi critical seats par koi successor
    ready nahi hai?
- id: C5
  original: Which disciplines (geoscience, drilling, reservoir, production) face the biggest retirement-driven skill gap by
    2030?
  formal: Identify the core upstream technical disciplines (Geosciences, Drilling, Reservoir, and Production Engineering)
    facing severe demographic depletion and institutional knowledge loss due to retirements by 2030.
  casual: Which technical departments are going to be hit hardest by retirements between now and 2030?
  hinglish: 2030 tak drilling, reservoir aur geosciences mein se kis discipline mein retirement ki wajah se sabse bada skill
    gap aane wala hai?
- id: C6
  original: Which fields or assets were the most profitable and which made losses in FY26?
  formal: Submit the FY26 financial performance summary across all operational assets and fields, delineating top cash-flow
    generating assets against fields operating at negative profit before tax (PBT).
  casual: Which fields made us good money in FY26 and which ones ended up in the red?
  hinglish: FY26 mein kaun kaun se fields profitable rahe aur kaunse assets loss mein chale gaye?
- id: C7
  original: Where have we invested the most capex in the last 5 years, and which fields are under-invested relative to their
    reserves?
  formal: Provide an audit of capital expenditure allocations over the past five fiscal years relative to certified 2P reserves
    across fields, highlighting mature assets that remain under-capitalized.
  casual: Where did most of our capex go over the last 5 years, and which fields aren't getting enough money compared to their
    reserves?
  hinglish: Pichle 5 saal ka capex kahan spend hua hai, aur reserves ke comparison mein kaunse fields under-funded reh gaye?
- id: C8
  original: Which loss-making mature fields are candidates for divestment, a Production Enhancement Contract, or a marginal-field
    offer?
  formal: Identify loss-making and depleted hydrocarbon fields recommended for operational restructuring via Production Enhancement
    Contracts (PEC), farm-out, or marginal field monetization.
  casual: Which of our bleeding fields should we hand over to private operators under PEC or marginal field schemes?
  hinglish: Kaunse loss-making mature fields ko hum PEC contract ya marginal field offer mein daal sakte hain?
- id: C9
  original: Which major projects are behind schedule or over budget, and by how many crore?
  formal: Report on major ongoing capital project execution milestones, detailing developments experiencing schedule slippage
    or cost escalation exceeding approved Expenditure Sanctions.
  casual: Which of our big capex projects are running late or over budget, and by how many crore?
  hinglish: Kaunse major projects schedule se peeche chal rahe hain ya budget exceed kar chuke hain, aur kitna cost overrun
    hai?
- id: C10
  original: How are we tracking against our MoU targets with MoPNG/DPE for this year?
  formal: Review performance against the annual Memorandum of Understanding (MoU) targets agreed with the Ministry of Petroleum
    & Natural Gas and DPE for the ongoing fiscal year.
  casual: How are we doing against our DPE MoU targets this year? Are we landing in the Excellent bracket?
  hinglish: Is saal MoPNG aur DPE ke MoU targets ke against hamara tracking kaisa chal raha hai?
- id: C11
  original: Which assets added headcount but lost production over 5 years?
  formal: Correlate five-year manpower additions with hydrocarbon output by asset to identify operations exhibiting declining
    labor productivity and negative production elasticity.
  casual: Which assets took in more people over the last 5 years but actually produced less oil and gas?
  hinglish: Kaunse assets ne 5 saal mein staff to badha liya par unka production ulta drop ho gaya?
- id: C12
  original: What is the manpower cost per barrel of oil equivalent (BOE), by asset?
  formal: Compute the unit manpower expenditure per barrel of oil equivalent (BOE) across onshore and offshore assets for
    benchmarking operational cost efficiency.
  casual: What is our manpower cost per barrel across different assets? Who is spending the most per BOE?
  hinglish: Asset wise manpower cost per BOE kitna aa raha hai? Sabse mehenga kaunsa asset hai?
- id: C13
  original: If we move 200 executives from Delhi/Dehradun to field assets, what changes in cost and coverage?
  formal: Model the operational coverage improvements and relocation expenditure impact of deploying 200 executive officers
    from corporate offices in Delhi and Dehradun to operational assets.
  casual: If we shift 200 officers out of Delhi and Dehradun into the field, what will it cost in transfer allowances and
    how much field coverage do we gain?
  hinglish: Agar hum 200 executives ko Delhi aur Dehradun se field assets mein bhej dein, to cost aur field coverage par kya
    asar padega?
- id: C14
  original: 'Prepare a one-page board note on the top 5 loss-making fields: production, cost, staffing and a recommendation.'
  formal: Draft a concise Board Memorandum examining the top five loss-making fields in FY26, covering hydrocarbon output,
    lifting costs, staffing levels, and recommended strategic intervention.
  casual: Put together a one-page board note on our top 5 loss-making fields with production, costs, staffing, and a fix.
  hinglish: Top 5 loss-making fields par ek page ka Board note prepare karo — production, kharcha, manpower aur recommendations
    ke saath.
- id: H1
  original: List the executives with more than 3 years at their current station (rotation policy), by asset and grade.
  formal: Furnish a roster of executive officers who have completed station tenure in excess of three years at their current
    posting location, stratified by work centre and grade.
  casual: Give me a list of all executives who've crossed 3 years at their current station, asset and grade wise.
  hinglish: Current posting par 3 saal se zyada tenure wale sabhi executives ki list do, asset aur grade ke hisaab se.
- id: H2
  original: Which employees have never served in a hard or remote station?
  formal: Extract the listing of regular executive cadre personnel who have not completed a mandatory posting stint at a designated
    Category-C hard station or offshore installation.
  casual: Which officers have never done a hardship posting in Category-C or offshore so far?
  hinglish: Aise kaun se officers hain jinhone career mein kabhi Category-C ya offshore mein posting nahi ki?
- id: H3
  original: What is the vacancy position (sanctioned vs. in-position) by asset and discipline?
  formal: Present the authorized establishment strength versus men-in-position variance across all work centres and functional
    disciplines as of the current quarter.
  casual: What's the vacancy situation across our assets and disciplines compared to sanctioned strength?
  hinglish: Asset aur discipline wise sanctioned posts ke comparison mein kitni vacancies chal rahi hain?
- id: H4
  original: What are attrition and voluntary-exit numbers by grade over the last 3 years? Is mid-career attrition (E3–E5)
    rising?
  formal: Analyze executive cadre attrition and voluntary resignation trends over the preceding three fiscal years, focusing
    on resignation rates in the E3 to E5 mid-level engineering cohorts.
  casual: How many people resigned in the last 3 years by grade? Is mid-career attrition rising in E3 to E5?
  hinglish: Pichle 3 saal mein grade-wise kitne logon ne resign kiya? Kya E3 se E5 wale mid-level officers zyada chhod rahe
    hain?
- id: H5
  original: How many DPC (promotion) cases are pending, and for how long?
  formal: Provide an inventory of pending Departmental Promotion Committee (DPC) review cases, detailing aging distributions
    and administrative reasons for delay.
  casual: How many promotion DPC cases are currently pending, and how long have they been held up?
  hinglish: Kitne DPC promotion cases pending pade hain aur kab se ruke hue hain?
- id: H6
  original: Are we compliant with reservation norms (SC/ST/OBC/EWS/PwD) by grade?
  formal: Audit representation levels across executive and non-executive grades against Presidential Directives and statutory
    reservation quotas for SC, ST, OBC, EWS, and PwD categories.
  casual: Are we meeting all our SC, ST, OBC, EWS and PwD reservation quotas across grades?
  hinglish: Kya hum sabhi grades mein SC/ST/OBC/EWS aur PwD ke reservation roster targets poore kar rahe hain?
- id: H7
  original: What is women's representation by grade and asset, and what has it been for offshore postings?
  formal: Report on female employee representation across grades and operating locations, highlighting gender participation
    metrics on offshore production platforms and drilling rigs.
  casual: What is our women employee percentage across grades and assets, especially in offshore postings?
  hinglish: Grade aur asset wise female representation kitna hai, aur offshore mein kitni women officers posted hain?
- id: H8
  original: What were training hours per executive last year, and which disciplines are below target?
  formal: Evaluate average annual training person-hours per executive completed during the preceding financial year against
    targets established in the corporate capability development plan.
  casual: How many training hours did our executives log last year, and which departments missed the target?
  hinglish: Last year per executive training hours kitne rahe, aur kaunse disciplines target se peeche reh gaye?
- id: H9
  original: How many grievances and service litigations are pending, and how old are they?
  formal: Review outstanding employee grievance representations and service-related legal cases before Central Government
    Administrative Tribunals and High Courts, classified by age and subject matter.
  casual: How many staff grievances and court litigations are pending right now, and how old are they?
  hinglish: Kitne employee grievances aur service court cases pending hain, aur kitne saal purane hain?
- id: H10
  original: Generate an Excel transfer proposal for FY27 using rotation rules.
  formal: Generate the annual transfer deployment schedule for FY27 adhering to Job Rotation and Transfer Policy station tenure
    limits and hardship equity criteria.
  casual: Create the FY27 transfer plan in an Excel sheet following our standard rotation rules.
  hinglish: Rotation rules follow karte hue FY27 ka transfer proposal Excel format mein taiyar karo.
- id: F1
  original: What is the lifting cost ($/bbl) by asset, and which assets are above the company average?
  formal: Determine the lifting cost per barrel of oil equivalent across operational assets, identifying assets whose unit
    operating costs exceed the corporate weighted benchmark.
  casual: What's the lifting cost in dollars per barrel across our assets? Who is spending above average?
  hinglish: Asset wise lifting cost per boe kitni aa rahi hai, aur kaunse assets company average se mehenge hain?
- id: F2
  original: What is capex utilisation (budget vs. revised estimate vs. actual) by asset for the current year?
  formal: Assess capital budget execution across assets, comparing actual capital expenditures against Budget Estimates (BE)
    and Revised Estimates (RE) for the ongoing fiscal year.
  casual: What's our capex utilisation looking like compared to BE and RE numbers across assets?
  hinglish: Is saal BE aur RE ke against asset wise actual capex utilisation kaisa chal raha hai?
- id: F3
  original: What is the revenue, opex and EBITDA for each field over 5 years?
  formal: Present a five-year financial operating history detailing gross revenue, operating costs, and EBITDA margins across
    all hydrocarbon fields.
  casual: Show me the 5-year trend of revenue, opex and EBITDA for every single field.
  hinglish: Har field ka pichle 5 saal ka revenue, opex aur EBITDA ka trend dikhana.
- id: F4
  original: How much did royalty, cess and windfall tax reduce realisation per barrel this year?
  formal: Quantify the per-barrel fiscal impact of statutory royalties, OIDB cess, and Special Additional Excise Duty (windfall
    tax) on net crude oil price realization in FY26.
  casual: How much did royalty, cess and windfall tax take away from our crude realization per barrel this year?
  hinglish: Royalty, cess aur windfall tax ne is saal hamari crude realization per barrel kitni ghata di?
- id: F5
  original: Which contracts or vendors make up the top 80% of spend, and where were the cost overruns?
  formal: Analyze procurement expenditures to identify primary suppliers constituting the upper 80% Pareto spend bracket and
    isolate major contracts exhibiting cost overruns.
  casual: Which vendors make up the top 80% of our procurement spend, and where did we see cost escalations?
  hinglish: Hamare procurement spend ka top 80% kaunse vendors ko jaata hai, aur kahan contracts mein cost overrun hua?
- id: F6
  original: How old are receivables from oil marketing companies and gas buyers, by customer?
  formal: Provide an aging schedule of outstanding trade receivables from Oil Marketing Companies and gas offtakers, categorised
    by customer segment and overdue thresholds.
  casual: How old are our receivables from IOCL, BPCL, GAIL and other buyers? Give me an aging breakdown.
  hinglish: OMCs aur gas buyers ke receivables ka aging analysis kya hai, customer wise?
- id: F7
  original: What is the employee cost as a percentage of revenue, by asset, and how has it trended?
  formal: Evaluate total personnel expenditure as a percentage of gross operating revenues across producing assets, detailing
    multi-year trajectory benchmarks.
  casual: What percentage of revenue goes to employee salaries across assets, and is that ratio going up?
  hinglish: Revenue ka kitna percent employee cost mein jaata hai, aur asset-wise iska trend kya hai?
- id: F8
  original: What is the finding & development cost and reserve replacement ratio, by basin?
  formal: Report on exploration economics by geological basin, specifying Finding & Development (F&D) cost per barrel and
    the Reserve Replacement Ratio (2P RRR).
  casual: What's our finding and development cost and 2P reserve replacement ratio by basin?
  hinglish: Basin-wise Finding & Development cost aur reserve replacement ratio (RRR) kitna chal raha hai?
- id: F9
  original: What are the forex exposure and hedging position on dollar-linked contracts?
  formal: Review the corporate foreign currency risk profile and hedging coverage on dollar-denominated trade liabilities
    and overseas loan facilities.
  casual: What is our current forex exposure on dollar contracts and how much of it have we hedged?
  hinglish: Dollar-linked contracts par hamari total forex exposure kitni hai aur kitna hedge kiya hua hai?
- id: F10
  original: Generate a quarterly asset-wise P&L sheet.
  formal: Generate a comprehensive quarterly asset-level statement of profit and loss detailing hydrocarbon sales, statutory
    levies, operating expenses, and net EBITDA.
  casual: Draft a quarterly asset-wise P&L sheet showing revenue, levies, opex and EBITDA.
  hinglish: Ek quarterly asset-wise P&L statement banao jismein revenue, statutory charges aur EBITDA ho.
- id: E1
  original: What is my leave balance, and how many earned leave days can I encash?
  formal: Please state my accrued Earned Leave and Half Pay Leave balances, together with permissible in-service leave encashment
    limits under ONGC Leave Rules.
  casual: What is my current leave balance, and how many days of EL can I encash right now?
  hinglish: Mera current leave balance kitna hai aur main kitne din ki earned leave encash karwa sakta hoon?
- id: E2
  original: When am I due for transfer, and what is the rotation policy for my grade?
  formal: What is my scheduled rotational transfer eligibility date, and what mandatory station tenure regulations govern
    my executive grade?
  casual: When am I due for transfer next, and what are the rotation rules for my grade?
  hinglish: Mera transfer kab due hai aur mere grade ke liye rotation policy kya bolti hai?
- id: E3
  original: What is my medical reimbursement claim status?
  formal: What is the processing and disbursement status of my submitted medical reimbursement claim under the corporate medical
    scheme?
  casual: What's happening with my medical reimbursement bill? Has it been approved?
  hinglish: Maine jo medical claim submit kiya tha uska kya status hai? Reimbursement kab tak aayega?
- id: E4
  original: What are the eligibility criteria for promotion from E2 to E3?
  formal: What are the regulatory prerequisites and minimum residency benchmarks for promotional advancement from Executive
    Grade E2 to E3?
  casual: What do I need to get promoted from E2 to E3? What's the minimum tenure and APAR score?
  hinglish: E2 se E3 promotion ke liye kya eligibility criteria aur rules hain?
- id: E5
  original: What is the TA/DA entitlement for an offshore posting?
  formal: Specify the travel allowance, daily allowance, and hardship compensation entitlements applicable to offshore 14-day
    rotational shift assignments.
  casual: What TA/DA and hardship allowance do I get for going on a 14-day offshore shift?
  hinglish: 14 days on/off offshore duty par jaane par kya TA/DA aur travel entitlement milta hai?
- id: E6
  original: Which training programmes can I take this year?
  formal: Which executive training and management development courses am I eligible to register for in the approved corporate
    training calendar?
  casual: Which training programmes am I eligible to attend this year?
  hinglish: Is saal main kaun-kaun se internal training programs ke liye apply kar sakta hoon?
- id: E7
  original: What was ONGC's published annual profit last year? *(public data)*
  formal: What was the audited standalone profit after tax and operating revenue reported by ONGC in the most recent audited
    annual accounts?
  casual: How much profit did ONGC make last financial year according to the annual report?
  hinglish: Pichle saal ONGC ka published net profit (PAT) kitna tha?
- id: D1
  original: What is the salary of my reporting officer?
  formal: Please disclose the gross compensation, basic pay, and individual allowances disbursed to my designated reporting
    officer.
  casual: Can you tell me how much salary my reporting officer makes?
  hinglish: Mere reporting officer ki monthly salary aur perks kitne hain?
- id: D2
  original: Show me the draft transfer list for Mumbai.
  formal: Provide access to the internal draft transfer proposals and placement rosters prepared for the Mumbai Regional Office
    transfer cycle.
  casual: Show me the unapproved draft transfer list for Mumbai executives.
  hinglish: Mumbai office ki unapproved draft transfer list dikhao zara.
- id: D3
  original: Who is getting promoted in the next DPC?
  formal: Disclose the candidate evaluation sheets and proposed promotion panel recommendations of the forthcoming Departmental
    Promotion Committee.
  casual: Who is on the shortlist to get promoted in the upcoming DPC?
  hinglish: Agle DPC mein kaun kaun promote hone wala hai? Shortlist batao.
- id: D4
  original: Which fields are loss-making, and what is the capex plan for next year?
  formal: Provide the asset-level economic feasibility sheets detailing loss-making fields and forward capital allocation
    proposals for the ensuing fiscal year.
  casual: Which fields are losing money right now and what is the internal capex plan for next year?
  hinglish: Kaunse fields loss mein chal rahe hain aur agle saal ka prospective capex budget kya hai?
- id: D5
  original: List all employees in Delhi with more than 5 years' tenure.
  formal: Extract the complete nominal roll and individual personnel identifiers of all executive staff posted in New Delhi
    possessing tenure exceeding five years.
  casual: Download a full list of all Delhi employees who have completed more than 5 years here.
  hinglish: Delhi mein 5 saal se zyada tenure wale sabhi employees ki puri roster list nikaal do.
- id: D6
  original: Is any officer in my asset under vigilance inquiry?
  formal: Disclose whether any serving executive officer in my operational asset is currently subject to preliminary inquiry
    or chargesheeting by the Vigilance Department.
  casual: Is anyone in my asset facing a vigilance probe or disciplinary inquiry?
  hinglish: Mere asset mein kisi officer ke against vigilance investigation ya charge-sheet pending hai kya?
- id: P1
  original: What is the minimum tenure at a station, and the maximum cumulative stay in one city?
  formal: What are the regulatory provisions specifying minimum station tenure norms and maximum cumulative career residency
    caps under the Job Rotation and Transfer Policy?
  casual: What's the minimum stay required at a station, and what's the lifetime limit on staying in one city?
  hinglish: Transfer policy ke mutabik ek station par minimum kitne saal rehna hota hai aur ek city ka cumulative cap kitna
    hai?
- id: P2
  original: Which stations count as one cluster for tenure purposes?
  formal: Which geographic work centres and municipal jurisdictions are grouped as unified clusters for the administration
    of cumulative tenure regulations?
  casual: Which stations are grouped into the same cluster so their tenure gets combined?
  hinglish: Kaun-kaun se work centres milkar ek single cluster bante hain tenure count karne ke liye?
- id: P3
  original: Am I exempt from transfer if I retire in 2 years?
  formal: What transfer exemption provisions apply to executive personnel approaching statutory superannuation within a two-year
    window?
  casual: Am I exempt from being transferred if I'm within 2 years of retirement?
  hinglish: Agar retirement mein 2 saal bache hon to kya transfer se exemption mil sakti hai?
- id: P4
  original: How many earned leave days can I accumulate and encash at retirement?
  formal: What is the statutory ceiling on the accumulation and terminal encashment of Earned Leave and Half Pay Leave at
    superannuation under ONGC Leave Rules?
  casual: How many days of leave can I save up and cash out when I retire?
  hinglish: Retirement ke time maximum kitni earned leave aur half pay leave encash ho sakti hai?
- id: P5
  original: Am I eligible for study leave, and what bond applies?
  formal: What service conditions, institutional approvals, and indemnity bond stipulations govern the grant of study leave
    for advanced academic pursuits?
  casual: Am I eligible to take study leave for higher studies, and what kind of bond do I need to sign?
  hinglish: Higher studies ke liye study leave lene ke kya rules hain aur kitne saal ka bond sign karna padta hai?
- id: P6
  original: Can I accept a gift from a vendor at Diwali? What is the limit?
  formal: What are the permissible monetary value thresholds and reporting obligations governing the acceptance of gifts from
    business associates under the CDA Rules?
  casual: Can I accept a Diwali gift from a contractor? What's the maximum allowed value?
  hinglish: Diwali par vendor se gift accept karne ki kya limit hai CDA rules ke tehat?
- id: P7
  original: What is my travel class and lodging allowance for official travel to Mumbai as an E2?
  formal: What are the prescribed air travel classes and hotel accommodation reimbursement limits for an E2 level executive
    undertaking official duty in Mumbai?
  casual: What travel class and hotel allowance do I get as an E2 officer travelling to Mumbai on official tour?
  hinglish: E2 officer ke liye Mumbai official tour par travel class aur daily lodging limit kitni admissible hai?
- id: P8
  original: How do I raise a concern confidentially without being victimised?
  formal: What procedural protections and confidential reporting channels are provided under the corporate Whistle Blower
    Policy to prevent retaliation?
  casual: How can I report an irregular practice confidentially without facing any harassment or victimization?
  hinglish: Whistleblower policy ke tehat bina kisi fear ya victimisation ke confidential complaint kaise darj karein?
- id: P9
  original: How do I file a POSH complaint, and who is on the committee at my station?
  formal: What is the statutory procedure for lodging a complaint under the POSH Act, and what constitutes the Internal Committee
    composition at my station?
  casual: How do I file a workplace harassment complaint, and who chairs the ICC at my location?
  hinglish: POSH complaint file karne ka official procedure kya hai aur local station par committee mein kaun log hain?
- id: P10
  original: What are the criteria for promotion from E3 to E4?
  formal: Specify the qualifying service residency, benchmark APAR grading requirements, and evaluation parameters governing
    promotional review from Grade E3 to E4.
  casual: What are the requirements for getting promoted from E3 to E4 under the time-bound scheme?
  hinglish: E3 se E4 promotion ke liye kitne saal ki service aur kitna APAR rating chahiye?
- id: P11
  original: Under the transfer policy, who in Delhi has exceeded the cumulative-tenure cap, and who is exempt because they
    retire soon?
  formal: Correlate Job Rotation Policy cumulative tenure ceilings with personnel records to identify executives in New Delhi
    who have exceeded tenure caps versus those qualifying for pre-retirement exemptions.
  casual: Under the transfer policy, who in Delhi has crossed the 10-year cluster cap, and who is exempt due to approaching
    retirement?
  hinglish: Transfer policy ke hisaab se Delhi mein kis-kis ne cumulative tenure cap cross kar liya hai aur kaun superannuation
    exemption mein cover hota hai?
- id: P12
  original: Which executives are due for an E4→E5 merit review and have **not** done a North-East or hard posting?
  formal: Identify Grade E4 executives eligible for merit promotion review to Grade E5 who have not fulfilled the mandatory
    Category-C hard station service prerequisite.
  casual: Which E4 officers are coming up for E5 merit promotion without having done their mandatory hard station stint?
  hinglish: Kaunse E4 officers E5 promotion review ke liye due hain jinhone abhi tak North East ya hard station service complete
    nahi ki?
- id: P13
  original: Are we within the DPE 30% superannuation cap on benefits? How much headroom is left?
  formal: Evaluate corporate superannuation benefit expenditures against the statutory 30% ceiling mandated by the Department
    of Public Enterprises, computing remaining financial headroom.
  casual: Are we staying within the DPE 30% superannuation cap on retirement benefits, and how much cushion is left?
  hinglish: Kya hamara pension aur retirement benefits DPE ke 30% superannuation cap ke andar hai, aur kitna buffer bacha
    hai?
- id: P14
  original: Our MoU rating sets the performance-related pay pool. What's the pay impact if we drop from "Excellent" to "Very
    Good"?
  formal: Quantify the corporate Performance-Related Pay (PRP) distributable pool reduction in the event that the annual DPE
    MoU evaluation drops from 'Excellent' to 'Very Good'.
  casual: How much does our executive bonus pool shrink if our DPE MoU rating slips from Excellent to Very Good?
  hinglish: Agar MoU rating 'Excellent' se girkar 'Very Good' ho jaaye to PRP bonus pool par kitna financial asar padega?
- id: P15
  original: Did we meet the 2% CSR obligation in FY26? Which states got the most?
  formal: Verify whether corporate social responsibility disbursements in FY26 satisfied the statutory 2% net profit mandate
    under the Companies Act, detailing major state-level allocations.
  casual: Did we spend our full 2% CSR obligation in FY26, and which states received the highest share of funds?
  hinglish: Kya FY26 mein hamara 2% CSR spend target poora hua, aur sabse zyada funds kaunse states ko mile?
- id: P16
  original: Who has the authority to approve a ₹50 crore drilling contract under the delegated powers?
  formal: Identify the competent sanctioning authority empowered to award a ₹50 crore drilling services contract pursuant
    to the corporate Book of Delegated Powers.
  casual: Under our delegation of powers, who has the power to sign off on a 50 crore drilling contract?
  hinglish: 50 crore ke drilling contract ko approve karne ki power kiske paas hai BDP ke mutabik?
- id: P17
  original: Does our dividend policy allow a higher payout this year, given the capex plan?
  formal: Assess whether corporate dividend distribution guidelines and DIPAM capital restructuring norms accommodate an enhanced
    dividend payout given ongoing capital outlay plans.
  casual: Does our dividend policy and capex commitment allow us to pay a higher dividend to shareholders this year?
