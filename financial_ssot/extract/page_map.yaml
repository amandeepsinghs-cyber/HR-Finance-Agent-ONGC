# P1.3 page map: statement title regex -> verified physical PDF page (pdftotext \f count + 1)
# of the FIRST title line of each primary statement, per own-year AR (SPEC-01 §4.3).
# The parser asserts that the regex hits on exactly this page (no guessing at run time).
# Verified 23-Oct-2026 against knowledge/public_sources/grounding_data/text/*.txt.
# "{scope}" is replaced by Standalone / Consolidated.
statement_regex:
  balance_sheet: '^{scope} Balance Sheet as at March 31, 20\d\d\b'
  pnl: '^{scope} Statement of Profit and Loss for the year ended March 31, 20\d\d\b'
  cash_flow: '^{scope} Statement of Cash Flows for the year ended March 31, 20\d\d\b'
