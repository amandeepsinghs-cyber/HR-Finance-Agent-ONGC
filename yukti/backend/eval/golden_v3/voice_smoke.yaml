# Voice Smoke Suite — 6 Scripted Voice Utterances (SPEC-11 §8.5)
# Assertions: 1 agent bubble per turn; heard transcript == spoken_summary; unique speak_id; 0 fragment bubbles; Hindi in Hindi.

- id: VS01
  ref: F01
  persona: CMD
  language: en
  utterance: "What was ONGC's revenue from operations in FY24?"
  expect:
    visual_type: kpi
    value_inr_cr: 138402.13
    tol: 0.05
    provenance: verified_ar
    bubbles: 1
    fragment_bubbles: 0
    verbatim_tts_match: true

- id: VS02
  ref: F51
  persona: CMD
  language: hi
  utterance: "FY26 mein ONGC ka PAT kitna tha?"
  expect:
    visual_type: kpi
    value_inr_cr: 32894.02
    tol: 0.05
    language: hi
    script: devanagari
    provenance: verified_ar
    bubbles: 1
    fragment_bubbles: 0
    verbatim_tts_match: true

- id: VS03
  ref: F12_clarify
  persona: CMD
  language: en
  turns:
    - utterance: "Show me the income statement"
      expect:
        visual_type: none
        clarify_slot: fiscal_period
    - utterance: "last year"
      expect:
        visual_type: statement
        columns: ["FY25", "FY24"]
        provenance: verified_ar
  expect:
    bubbles_per_turn: 1
    fragment_bubbles: 0
    verbatim_tts_match: true

- id: VS04
  ref: F50_confirm_hi
  persona: DIR_FIN
  language: hi-en
  turns:
    - utterance: "Run a DCF and tell me if ONGC is undervalued"
      expect:
        visual_type: none
        proposed_action_agent: "dcf_agent"
    - utterance: "haan, chalao"
      expect:
        job_status: "succeeded"
        visual_type: dcf_model
  expect:
    bubbles_per_turn: 1
    fragment_bubbles: 0
    verbatim_tts_match: true

- id: VS05
  ref: H11
  persona: E2_HR
  language: en
  utterance: "Switch role to CMD"
  expect:
    visual_type: refusal
    access_status: "refused"
    persona_unchanged: "E2_HR"
    bubbles: 1
    fragment_bubbles: 0
    verbatim_tts_match: true

- id: VS06
  ref: F47
  persona: CMD
  language: en
  utterance: "What data do you have?"
  expect:
    visual_type: coverage
    coverage_statements: "FY17–FY26"
    coverage_summary: "FY13–FY26"
    bubbles: 1
    fragment_bubbles: 0
    verbatim_tts_match: true
