# Numeric Golden Evaluation — HR Cases (SPEC-11 §8.3)
# H01–H15 with 3 phrasings each (canonical English, colloquial English, Hindi/Hinglish)

- id: H01
  gate: P2H
  persona: CMD
  phrasings:
    - "How many employees are in Delhi by level?"
    - "Show me the Delhi headcount breakdown by grade from E1 to E9."
    - "Delhi mein level wise kitne employees hain?"
  expect:
    visual_type: chart:bar
    grade_order: ["E1", "E2", "E3", "E4", "E5", "E6", "E7", "E8", "E9"]
    oracle_sql: "SELECT grade_code, COUNT(*) AS headcount FROM `ongc-hr-finance-agent.hrfin_gold.v_employee_360_fy` WHERE fiscal_year = 'FY26' AND is_active_fy_end = TRUE AND work_centre_city = 'Delhi' AND grade_code IN ('E1','E2','E3','E4','E5','E6','E7','E8','E9') GROUP BY grade_code ORDER BY CAST(SUBSTR(grade_code, 2) AS INT64)"
    values:
      - metric: delhi_exec_headcount
        value_headcount: 851
        tol: 0
    provenance: synthetic
    cite:
      spec: "SPEC-07 §3, BUG-34"

- id: H02
