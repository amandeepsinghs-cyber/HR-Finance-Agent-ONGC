  persona: CMD
  phrasings:
    - "How many have been in Delhi for more than 5 years?"
    - "How many executives have continuous stay in Delhi exceeding five years?"
    - "Delhi mein 5 saal se zyada rukne wale kitne executives hain?"
  expect:
    visual_type: kpi
    oracle_sql: "SELECT COUNT(*) AS overstay_execs FROM `ongc-hr-finance-agent.hrfin_gold.v_employee_360_fy` WHERE fiscal_year = 'FY26' AND is_active_fy_end = TRUE AND work_centre_city = 'Delhi' AND cadre_category = 'Executive' AND current_station_tenure_days > 1826"
    values:
      - metric: delhi_overstay_5y_exec
        value_headcount: 419
        tol: 0
      - metric: delhi_overstay_5y_all_cadres
        value_headcount: 645
        tol: 0
    provenance: synthetic
    cite:
      spec: "SPEC-07 §3"

