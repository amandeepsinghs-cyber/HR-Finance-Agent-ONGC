        column: asset_wc_id
        kind: entity:wc
        label: asset
      basin:
        column: basin
        kind: categorical
        label: basin
      state:
        column: state
        kind: categorical
        label: state
      segment:
        column: segment
        kind: categorical
        label: segment
      operatorship:
        column: operatorship
        kind: categorical
        label: operatorship
      maturity:
        column: maturity
        kind: categorical
        label: maturity
      hydrocarbon:
        column: hydrocarbon
        kind: categorical
        label: hydrocarbon
      prod_basis:
        column: prod_basis
        kind: categorical
        label: production basis
    dimension_fallbacks:
      wc: asset
    metrics:
      field_revenue_cr:
        expr: ROUND(SUM(revenue_from_operations) / 10.0, 2)
        aggregation: sum
        unit: inr_cr
        label: "RAS cost-object revenue from operations (\u20B9 cr) \u2014 Modelled (use revenue_cr for standard field revenue)"
        data_class: fin_internal
      opex_per_boe_inr:
        expr: ROUND(SUM(opex_operating_excl_corporate) * 1000000.0 / NULLIF(SUM(prod_boe), 0), 2)
        aggregation: ratio
        unit: inr_per_boe
        label: "Operating expenditure per BOE (\u20B9/BOE) \u2014 Modelled"
        data_class: fin_internal
      opex_per_boe_usd:
        expr: ROUND((SUM(opex_operating_excl_corporate) * 1000000.0 / NULLIF(SUM(prod_boe), 0)) / NULLIF(AVG(inr_usd_fx_rate), 0), 2)
        aggregation: ratio
        unit: usd_per_boe
        label: "Operating expenditure per BOE ($/BOE) \u2014 Modelled"
        data_class: fin_internal
      lifting_cost_per_boe_usd:
        expr: ROUND((SUM(opex_lifting) * 1000000.0 / NULLIF(SUM(prod_boe), 0)) / NULLIF(AVG(inr_usd_fx_rate), 0), 2)
        aggregation: ratio
        unit: usd_per_boe
        label: "RAS cost-object lifting cost per BOE ($/BOE) \u2014 Modelled (use lifting_cost_usd_per_boe for standard lifting cost)"
        data_class: fin_internal
      employee_cost_per_boe:
        expr: ROUND(SUM(staff_expenditure) * 1000000.0 / NULLIF(SUM(prod_boe), 0), 2)
        aggregation: ratio
        unit: inr_per_boe
        label: "Employee cost per BOE (\u20B9/BOE) \u2014 Modelled (total Real)"
        data_class: fin_internal
      field_ebitda_cr:
        expr: ROUND(SUM(ebitda) / 10.0, 2)
        aggregation: sum
        unit: inr_cr
        label: "RAS cost-object field EBITDA (\u20B9 cr) \u2014 Modelled (use ebitda_cr for standard field EBITDA)"
        data_class: fin_internal
      field_ebitda_margin_pct:
        expr: ROUND(100.0 * SUM(ebitda) / NULLIF(SUM(revenue_from_operations), 0), 2)
        aggregation: ratio
        unit: pct
        label: "RAS cost-object field EBITDA margin (%) \u2014 Modelled (use ebitda_margin_pct for standard field margin)"
        data_class: fin_internal
      field_pbt_cr:
        expr: ROUND(SUM(pbt_contrib) / 10.0, 2)
        aggregation: sum
        unit: inr_cr
        label: "RAS cost-object field PBT contribution (\u20B9 cr) \u2014 Modelled (use pbt_cr for standard field PBT)"
        data_class: fin_internal
      levies_pct_revenue:
        expr: ROUND(100.0 * SUM(levies_total) / NULLIF(SUM(revenue_from_operations), 0), 2)
        aggregation: ratio
        unit: pct
        label: "Statutory levies as % of revenue \u2014 Modelled (total Real)"
        data_class: fin_internal
      revenue_per_employee_field_cr:
        expr: ROUND((SUM(revenue_from_operations) / 10.0) / NULLIF(AVG(headcount_direct) + AVG(headcount_allocated_fte), 0), 2)
        aggregation: ratio
        unit: inr_cr
        label: "Revenue per employee by field (\u20B9 cr) \u2014 Modelled"
        data_class: fin_internal
      boe_per_employee:
        expr: ROUND(SUM(prod_boe) / NULLIF(AVG(headcount_direct) + AVG(headcount_allocated_fte), 0), 2)
        aggregation: ratio
        unit: boe
        label: "Production BOE per employee \u2014 Modelled"
        data_class: fin_internal
      breakeven_crude_usd_bbl:
        expr: ROUND(((SUM(rev_crude) - SUM(pbt_contrib)) * 1000000.0 / NULLIF(SUM(oil_sales_mt), 0)) / (7.33 * NULLIF(AVG(inr_usd_fx_rate), 0)), 2)
        aggregation: ratio
        unit: usd_per_boe
        label: "Breakeven crude price ($/bbl) \u2014 Modelled"
        data_class: fin_internal
      capex_intensity_usd_boe:
        expr: ROUND((SUM(capex_total) * 1000000.0 / NULLIF(SUM(prod_boe), 0)) / NULLIF(AVG(inr_usd_fx_rate), 0), 2)
        aggregation: ratio
        unit: usd_per_boe
        label: "Capex intensity ($/BOE) \u2014 Modelled"
        data_class: fin_internal
      offshore_vs_onshore_revenue_cr:
        expr: ROUND(SUM(CASE WHEN segment IN ('Offshore', 'Onshore') THEN revenue_from_operations ELSE 0 END) / 10.0, 2)
        aggregation: sum
        unit: inr_cr
        label: "Offshore vs Onshore segment revenue (\u20B9 cr) \u2014 Real"
        data_class: general_fin
      offshore_vs_onshore_result_cr:
        expr: ROUND(SUM(CASE WHEN segment IN ('Offshore', 'Onshore') THEN segment_result_contrib ELSE 0 END) / 10.0, 2)
        aggregation: sum
        unit: inr_cr
        label: "Offshore vs Onshore segment profit (\u20B9 cr) \u2014 Real"
        data_class: general_fin
      company_bridge:
        expr: ROUND(SUM(pbt_contrib) / 10.0, 2)
        aggregation: sum
        unit: inr_cr
        label: "Company bridge reconciled PBT total (\u20B9 cr) \u2014 Real vs Modelled"
        data_class: general_fin
templates:
  headcount_change:
    domain: hr
    label: Headcount change by work centre
    description: Headcount at 31-Mar before the start FY vs 31-Mar at the end FY,
      per work centre (growth / no increase over N years).
    period: range
    default_from: FY22
    default_to: FY26
  capex_vs_reserves:
    domain: finance
    label: Capex invested vs 2P reserves (under-investment)
    description: Actual capex over a FY range by asset vs FY26 2P reserves; flags
      assets whose capex per MMTOE is below half the average (C7 logic).
    period: range
    default_from: FY22
    default_to: FY26
    certified_id: C7
  pnl_statement:
    domain: finance
    label: "ONGC Schedule III Statement of Profit & Loss"
    description: "Complete Ind-AS Schedule III Annual Report Statement of Profit & Loss (Revenue from Operations, Crude/Gas/VAP, Other Income, Royalty, OIDB Cess, SAED Windfall Tax, Net Revenue, Operating Expenses, Exploration Write-Offs, DD&A, Finance Costs, Exceptional Items, PBT, Tax Expense, Standalone PAT & Consolidated PAT) for a single FY (with YoY comparison) or across a 10-year range (FY17–FY26)."
    period: fiscal_year
    default_from: FY17
    default_to: FY26
  balance_sheet:
    domain: finance
    label: "ONGC Schedule III Balance Sheet"
    description: "Complete Ind-AS Schedule III Annual Report Balance Sheet (Oil & Gas Producing Properties, Other PPE & ROU Lease Assets, CWIP, Exploratory Wells-in-Progress, Subsidiary/JV Investments in HPCL/OVL/MRPL/OPaL, Site Restoration Escrow Fund, Inventories, Trade Receivables, Cash & Bank, Total Assets, Equity Share Capital, Other Equity Reserves, Net Worth, Long-Term & Short-Term Debt, Ind-AS 116 Lease Liabilities, ARO Decommissioning Provision, Deferred Tax Liabilities & Current Liabilities) for a single FY or across FY17–FY26."
    period: fiscal_year
    default_from: FY17
    default_to: FY26
  cash_flow_statement:
    domain: finance
    label: "ONGC Ind-AS 7 Statement of Cash Flows"
    description: "Complete Ind-AS 7 Annual Report Statement of Cash Flows (PBT, Non-Cash DD&A/Exploration Adjustments, Working Capital Changes, Taxes Paid, Net Operating Cash Flow OCF, Capex Outflows, Subsidiary Acquisitions, Dividends/Interest Received, Investing Cash Flow, Net Borrowings, Lease Payments, Interest & Dividends Paid, Financing Cash Flow, Opening/Closing Cash & Free Cash Flow FCF) for a single FY or across FY17–FY26."
    period: fiscal_year
    default_from: FY17
    default_to: FY26
  financial_ratios:
    domain: finance
    label: ONGC Financial Ratios & Credit Scorecard
    description: "Complete 18-line Corporate Financial Ratios Scorecard (EBITDA Margin,\
      \ EBIT Margin, PBT Margin, Net PAT Margin, Standalone & Consolidated ROCE, ROE,\
      \ ROA, Debt-to-Equity, Net Debt-to-EBITDA, Interest Coverage, Current Ratio,\
      \ Receivable Days DSO, EPS, Book Value Per Share, Dividend Per Share, Crude\
      \ Realisation & Lifting Cost) for a single FY or across FY17\u2013FY26."
    period: fiscal_year
    default_from: FY17
    default_to: FY26
  wacc_pct:
    domain: finance
    label: "ONGC Weighted Average Cost of Capital (WACC %)"
    description: "Historical Weighted Average Cost of Capital (WACC %) series (FY17–FY26 or 5-year FY22–FY26), including Cost of Equity (Ke) and Post-Tax Cost of Debt (Kd*(1-t)), modelled from RBI/FBIL G-Sec, Damodaran ERP, and NSE equity beta."
    period: range
    default_from: FY22
    default_to: FY26
  wacc_components:
    domain: finance
    label: "ONGC WACC Build-up and Component Breakdown"
    description: "Stacked components of WACC across years: Risk-free rate (Rf), Equity Risk Premium (Beta * ERP), and Cost of Debt, with weighted contributions to total WACC."
    period: range
    default_from: FY22
    default_to: FY26
  wacc_build_up:
    domain: finance
    label: "ONGC WACC Single-Year Parameter Build-Up"
    description: "Single-year WACC parameter table and KPI: all 16 inputs and parameters (Rf, beta, ERP, CRP, Kd pretax, tax rate, equity/debt weights, Ke, Kd post-tax, WACC) with lineage sources."
    period: fiscal_year
    default_from: FY26
    default_to: FY26
  wacc_change_attribution:
    domain: finance
    label: "ONGC WACC Change Attribution (Shapley)"
    description: "Exact 5-factor Shapley attribution (Rf, ERP, Beta, Kd after tax, Capital weights) explaining YoY changes in WACC, rendered as a waterfall bridge."
    period: fiscal_year
    default_from: FY22
    default_to: FY23
  pay_scale_min_inr:
    domain: policy
    label: Executive Grade Pay Scale (Starting & Maximum Basic Pay)
    description: "Official DPE / ONGC executive grade pay scale bands (pay_scale_min_inr\
      \ and pay_scale_max_inr) from hrfin_silver.dim_grade (E0\u2013E9)."
    period: fixed
    default_from: FY26
    default_to: FY26
