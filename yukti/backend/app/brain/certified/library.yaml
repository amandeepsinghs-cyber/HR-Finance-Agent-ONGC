  group: self
  data_class: self
  canonical_question: Show my APAR ratings and performance scores.
  intent_keywords:
  - my
  - apar
  - rating
  - score
  - appraisal
  parameterized_sql: "SELECT apar_id, emp_id, fiscal_year, wc_id, grade_id, discipline_id,\n  numerical_score, final_rating,\
    \ benchmark_score, is_dpc_eligible\nFROM apar_ratings\nWHERE emp_id = @self_emp_id\nORDER BY fiscal_year DESC\nLIMIT 5;"
  params:
    self_emp_id:
      type: STRING
      default: EMP-102451
      description: Caller's own employee ID bound from server-side Principal.emp_id
  visual_kind: table
- id: my_entitlements
  group: self
  data_class: self
  canonical_question: What are my house building, car advance, and grade entitlements?
  intent_keywords:
  - my
  - entitlement
  - advance
  - hba
  - car
  parameterized_sql: "SELECT e.emp_id, e.name, e.current_grade_id AS grade_id, g.designation,\n  g.pay_scale_min_inr, g.pay_scale_max_inr,\
    \ g.typical_residency_years\nFROM employee_master e\nJOIN dim_grade g ON e.current_grade_id = g.grade_id\nWHERE e.emp_id\
    \ = @self_emp_id;"
  params:
    self_emp_id:
      type: STRING
      default: EMP-102451
      description: Caller's own employee ID bound from server-side Principal.emp_id
  visual_kind: table

