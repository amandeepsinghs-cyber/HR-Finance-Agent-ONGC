    \ travel_claims\n  WHERE grade_id = 'E2' AND LOWER(to_city) = 'mumbai'\n  GROUP BY grade_id\n)\nSELECT\n    g.grade_id,\n\
    \    g.designation,\n    g.ta_da_travel_class,\n    g.daily_lodging_limit_cat_a_inr,\n    m.mumbai_city_category,\n  \
    \  m.e2_mumbai_claims,\n    m.avg_lodging_per_night_inr,\n    m.claim_class_entitlement\nFROM dim_grade g\nLEFT JOIN mum\
    \ m USING (grade_id)\nWHERE g.grade_id = 'E2';"
