  intent_description: 'FY27 year-to-date (Apr-Sep 2026) capex utilisation is 95.3% of phased BE: ₹18,020 cr spent against
    ₹18,915 cr across 31 spending centres.'
  parameterized_sql: "-- Answer Key SQL: M2\n-- Question: \"What is the capex utilisation by asset this year?\" (aggregate)\n\
    -- Type: data\n-- Semantic audit 2026-10-20: Old SQL answered a different question (project cost overruns) and fanned\
    \ out over project_progress milestones (360 duplicated rows).\n-- Semantic audit 2026-10-20: Now: FY27 year-to-date (Apr-Sep\
    \ 2026) capex utilisation (actual vs BE and RE) by asset work centre from capex_budget.\n\nSELECT\n    wc.wc_id,\n   \
    \ wc.short_name AS asset,\n    wc.type AS wc_type,\n    COUNT(DISTINCT cb.month) AS months_covered,\n    ROUND(SUM(cb.budget_estimate_be_inr_cr),\
    \ 2) AS ytd_be_inr_cr,\n    ROUND(SUM(cb.revised_estimate_re_inr_cr), 2) AS ytd_re_inr_cr,\n    ROUND(SUM(cb.actual_spend_inr_cr),\
    \ 2) AS ytd_actual_inr_cr,\n    ROUND(SUM(cb.actual_spend_inr_cr) * 100.0 / NULLIF(SUM(cb.budget_estimate_be_inr_cr),\
    \ 0), 1) AS utilisation_vs_be_pct,\n    ROUND(SUM(cb.actual_spend_inr_cr) * 100.0 / NULLIF(SUM(cb.revised_estimate_re_inr_cr),\
    \ 0), 1) AS utilisation_vs_re_pct\nFROM capex_budget cb\nJOIN dim_work_centre wc ON wc.wc_id = cb.asset_wc_id\nWHERE cb.fiscal_year\
    \ = 'FY27'\nGROUP BY wc.wc_id, wc.short_name, wc.type\nORDER BY ytd_actual_inr_cr DESC;"
  params: {}
