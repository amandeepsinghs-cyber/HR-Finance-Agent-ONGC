  - pay
  - components
  - ytd
  - ctc
  parameterized_sql: "SELECT emp_id, fiscal_year,\n  SUM(basic_pay_inr) AS basic_pay_inr,\n  SUM(da_inr) AS da_inr,\n  SUM(hra_inr)\
    \ AS hra_inr,\n  SUM(cafeteria_allowances_inr) AS cafeteria_allowances_inr,\n  SUM(prp_inr) AS prp_inr,\n  SUM(gross_salary_inr)\
    \ AS gross_salary_inr,\n  SUM(net_salary_inr) AS net_salary_inr\nFROM payroll_monthly\nWHERE emp_id = @self_emp_id\nGROUP\
    \ BY emp_id, fiscal_year\nORDER BY fiscal_year DESC;"
