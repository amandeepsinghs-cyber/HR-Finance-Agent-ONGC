- id: T2
  group: Follow-up chains
  canonical_question: '"Who in Delhi has 5+ years?" → "Which of them breach the transfer policy?" → "Match them to vacancies
    at hard stations." → "Export as an Excel transfer proposal."'
  intent_keywords:
