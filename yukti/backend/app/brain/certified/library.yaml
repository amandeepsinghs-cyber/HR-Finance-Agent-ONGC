- id: C9
  group: CMD money and assets
  canonical_question: Which major projects are behind schedule or over budget, and by how many crore?
  intent_keywords:
  - major
  - projects
  - behind
  - schedule
  - budget
  - crore
  intent_description: 9 major projects are behind schedule and 60 are over budget, by ₹14,454 cr in total; the largest is
    KG-DWN-98/2 Cluster-II Deepwater Develop
  parameterized_sql: "-- Answer Key SQL: C9\n-- Question: Which major projects are behind schedule or over budget, and by\
    \ how many crore?\n-- Type: data\n-- Semantic audit 2026-10-20: project_progress has 6 milestone rows per project carrying\
    \ the same project-level\n-- cost and slippage, so the old SQL returned every project 6 times (360 rows) - any total over\
    \ it is 6x.\n-- Now one row per project (values are constant across milestones, verified), with overrun in crore and %,\n\
    -- slippage in months, a behind-schedule flag and the count of milestones on the delayed critical path.\n\nWITH p AS (\n\
    \    SELECT\n        pp.prj_id,\n        ANY_VALUE(pp.sanctioned_cost_inr_cr) AS sanctioned_cost_inr_cr,\n        ANY_VALUE(pp.revised_cost_inr_cr)\
    \ AS revised_cost_inr_cr,\n        ANY_VALUE(pp.schedule_slippage_months) AS schedule_slippage_months,\n        COUNTIF(LOWER(pp.milestone_status)\
    \ = 'delayed_critical_path') AS delayed_milestones\n    FROM project_progress pp\n    GROUP BY pp.prj_id\n)\nSELECT\n\
    \    p.prj_id,\n    d.name AS project_name,\n    d.status,\n    p.sanctioned_cost_inr_cr,\n    p.revised_cost_inr_cr,\n\
    \    ROUND(p.revised_cost_inr_cr - p.sanctioned_cost_inr_cr, 2) AS cost_overrun_cr,\n    ROUND((p.revised_cost_inr_cr\
    \ - p.sanctioned_cost_inr_cr) * 100.0 / NULLIF(p.sanctioned_cost_inr_cr, 0), 1) AS cost_overrun_pct,\n    p.schedule_slippage_months,\n\
    \    p.schedule_slippage_months > 0 AS behind_schedule,\n    p.delayed_milestones\nFROM p\nJOIN dim_project d ON d.prj_id\
    \ = p.prj_id\nWHERE p.revised_cost_inr_cr > p.sanctioned_cost_inr_cr OR p.schedule_slippage_months > 0\nORDER BY cost_overrun_cr\
    \ DESC;"
  params: {}
  visual_kind: table
  provenance:
    source_file: data_bank/answer_key/sql/C9.sql
    sha256: baa93a4cddf91256588422e05f598f0b6f6228f84aae81324fe3b05148796741
    gold_objects: hrfin_silver, hrfin_gold
- id: C10
  group: CMD money and assets
  canonical_question: How are we tracking against our MoU targets with MoPNG/DPE for this year?
  intent_keywords:
  - mou
  - tracking
  - against
  - targets
  - mopng
  - dpe
  intent_description: 'FY27 is tracking Very Good at best: on the H1 run-rate the projected composite score is 3.88 (to date
    4.00), with 0 of 9 parameters on cours'
  parameterized_sql: "-- Answer Key SQL: C10\n-- Question: How are we tracking against our MoU targets with MoPNG/DPE for\
    \ this year?\n-- Type: data\n-- Semantic audit 2026-10-20: (1) FY_MAPPING - \"this year\" is FY27 (current FY, 2026-04..2026-09\
    \ elapsed); the\n-- old SQL reported FY26. FY27 actual_achievement is the full-year projection on the H1 run-rate (e.g.\
    \ crude\n-- 19.051 MMT = 2 x H1 9.525 MMT in production_monthly), so it is labelled as projected. (2) PCT_DENOM - LTIFR\
    \ is\n-- lower-is-better, so actual/target gave 140% \"achievement\"; it is now inverted (target/actual) for that\n--\
    \ parameter. Added the recorded rating, Very Good threshold, gap to Excellent and FY26 final rating.\n\nSELECT\n    m.parameter_name,\n\
    \    m.unit_of_measure,\n    m.weightage,\n    m.excellent_target,\n    m.very_good_target,\n    m.actual_achievement\
    \ AS fy27_projected_achievement,\n    ROUND(CASE WHEN m.parameter_id = 'MOU-HSE-SAFETY' THEN m.excellent_target * 100.0\
    \ / NULLIF(m.actual_achievement, 0)\n               ELSE m.actual_achievement * 100.0 / NULLIF(m.excellent_target, 0)\
    \ END, 1) AS pct_of_excellent,\n    ROUND(CASE WHEN m.parameter_id = 'MOU-HSE-SAFETY' THEN m.excellent_target - m.actual_achievement\n\
    \               ELSE m.actual_achievement - m.excellent_target END, 3) AS gap_to_excellent,\n    m.achieved_rating AS\
    \ fy27_projected_rating,\n    p.achieved_rating AS fy26_final_rating,\n    m.composite_score AS fy27_composite_to_date,\n\
    \    m.projected_composite_score AS fy27_projected_composite\nFROM mou_targets m\nLEFT JOIN mou_targets p ON p.parameter_id\
    \ = m.parameter_id AND p.fiscal_year = @fiscal_year\nWHERE m.fiscal_year = 'FY27'\nORDER BY m.weightage DESC, pct_of_excellent\
    \ ASC;"
  params:
    fiscal_year:
      type: STRING
      default: FY26
      description: Fiscal year in FYxx format
      allowed_values:
      - FY21
      - FY22
      - FY23
      - FY24
      - FY25
      - FY26
      - FY27
  visual_kind: table
  provenance:
    source_file: data_bank/answer_key/sql/C10.sql
    sha256: 1448d671484025d94f5d05e1d976ef2eaa0d8fd9ed33d84bce68c81796300106
    gold_objects: hrfin_silver, hrfin_gold
- id: C11
  group: CMD cross-silo HR × Finance
  canonical_question: Which assets added headcount but lost production over 5 years?
  intent_keywords:
  - headcount
  - assets
  - added
  - but
  - lost
  - production
  intent_description: 'No asset both added headcount and lost production over the five years: between 31-Mar-2021 and 31-Mar-2026
    every asset whose production fell'
  parameterized_sql: "-- Answer Key SQL: C11\n-- Question: Which assets added headcount but lost production over 5 years?\n\
    -- Type: data\n-- Semantic audit 2026-10-20: headcount is a stock -> compare period-end snapshots\n-- (31-Mar-2021 = month\
    \ 2021-03 vs 31-Mar-2026 = month 2026-03), never SUM across months.\n-- Production is a flow -> full-FY sums (both FY21\
    \ and FY26 have 12 months), expressed in BOE\n-- (total_production_boe) with oil (MMT) and gas (BCM) shown separately,\
    \ never added together.\n-- Criterion: headcount Mar-26 > Mar-21 AND FY26 BOE < FY21 BOE (flag column).\n\nWITH hc AS\
    \ (\n    SELECT\n        wc_id,\n        SUM(CASE WHEN month = '2021-03' THEN headcount END) AS hc_mar21,\n        SUM(CASE\
    \ WHEN month = '2026-03' THEN headcount END) AS hc_mar26\n    FROM headcount_snapshot\n    WHERE month IN ('2021-03',\
    \ '2026-03')\n    GROUP BY wc_id\n),\nprod AS (\n    SELECT\n        asset_wc_id AS wc_id,\n        SUM(CASE WHEN fiscal_year\
    \ = 'FY21' THEN total_production_boe END) / 1e6 AS mmboe_fy21,\n        SUM(CASE WHEN fiscal_year = @fiscal_year THEN\
    \ total_production_boe END) / 1e6 AS mmboe_fy26,\n        SUM(CASE WHEN fiscal_year = 'FY21' THEN oil_production_mt END)\
    \ / 1e6 AS oil_mmt_fy21,\n        SUM(CASE WHEN fiscal_year = @fiscal_year THEN oil_production_mt END) / 1e6 AS oil_mmt_fy26,\n\
    \        SUM(CASE WHEN fiscal_year = 'FY21' THEN gas_production_mmscm END) / 1e3 AS gas_bcm_fy21,\n        SUM(CASE WHEN\
    \ fiscal_year = @fiscal_year THEN gas_production_mmscm END) / 1e3 AS gas_bcm_fy26\n    FROM production_monthly\n    WHERE\
    \ fiscal_year IN ('FY21', 'FY26')\n    GROUP BY asset_wc_id\n)\nSELECT\n    wc.wc_id,\n    wc.short_name,\n    h.hc_mar21,\n\
    \    h.hc_mar26,\n    h.hc_mar26 - h.hc_mar21 AS hc_change,\n    ROUND((h.hc_mar26 - h.hc_mar21) * 100.0 / NULLIF(h.hc_mar21,\
    \ 0), 2) AS hc_growth_pct,\n    ROUND(p.mmboe_fy21, 2) AS mmboe_fy21,\n    ROUND(p.mmboe_fy26, 2) AS mmboe_fy26,\n   \
    \ ROUND((p.mmboe_fy26 - p.mmboe_fy21) * 100.0 / NULLIF(p.mmboe_fy21, 0), 2) AS boe_growth_pct,\n    ROUND(p.oil_mmt_fy21,\
    \ 3) AS oil_mmt_fy21,\n    ROUND(p.oil_mmt_fy26, 3) AS oil_mmt_fy26,\n    ROUND(p.gas_bcm_fy21, 3) AS gas_bcm_fy21,\n\
    \    ROUND(p.gas_bcm_fy26, 3) AS gas_bcm_fy26,\n    (h.hc_mar26 > h.hc_mar21 AND p.mmboe_fy26 < p.mmboe_fy21) AS added_hc_and_lost_production\n\
    FROM hc h\nJOIN prod p ON h.wc_id = p.wc_id\nJOIN dim_work_centre wc ON h.wc_id = wc.wc_id\n-- All producing assets are\
    \ returned with the criterion flag so that an empty qualifying set\n-- is still an explicit, checkable answer.\nORDER\
    \ BY added_hc_and_lost_production DESC, boe_growth_pct ASC;"
  params:
    fiscal_year:
      type: STRING
      default: FY26
      description: Fiscal year in FYxx format
      allowed_values:
      - FY21
      - FY22
      - FY23
      - FY24
      - FY25
      - FY26
      - FY27
  visual_kind: table
  provenance:
    source_file: data_bank/answer_key/sql/C11.sql
    sha256: 62e79176ad02cdb8fcc91b492e1c5cb6f02320e502eeb8e8a7856b7ed8e259d8
    gold_objects: hrfin_silver, hrfin_gold
- id: C12
  group: CMD cross-silo HR × Finance
  canonical_question: What is the manpower cost per barrel of oil equivalent (BOE), by asset?
  intent_keywords:
  - manpower
  - cost
  - barrel
  - oil
  - equivalent
  - boe
  intent_description: FY26 manpower cost per BOE ranges from $1.32 (₹117) at Ankleshwar Asset to $30.90 (₹2,729) at Jorhat
    Asset, against a producing-asset averag
  parameterized_sql: "-- Answer Key SQL: C12\n-- Question: What is the manpower cost per barrel of oil equivalent (BOE), by\
    \ asset?\n-- Type: data\n-- Semantic audit 2026-10-20: old SQL computed manpower cost as a % of revenue (not per BOE),\
    \ at field grain\n-- labelled with the asset name (59 rows incl. plant/corporate P&L lines, the same asset repeated).\
    \ Now: FY26,\n-- field P&L lines aggregated to producing asset - allocated manpower cost x 1e7 / total BOE (ratio of sums,\n\
    -- MET-FIN-009 pattern) in INR and in USD at the FY26 average INR/USD from dim_price_fx, with headcount and\n-- BOE per\
    \ employee; plus a company line over all producing assets.\n\nWITH a AS (\n    SELECT pnl.asset_wc_id,\n           SUM(pnl.allocated_manpower_cost_inr_cr)\
    \ AS manpower_cr,\n           SUM(pnl.total_production_boe) AS boe,\n           SUM(pnl.regular_employee_headcount) AS\
    \ regular_headcount\n    FROM field_pnl_annual pnl\n    WHERE pnl.fiscal_year = @fiscal_year AND LOWER(pnl.line_type)\
    \ = 'field'\n    GROUP BY pnl.asset_wc_id\n),\nfx AS (SELECT AVG(inr_usd_fx_rate) AS fx FROM dim_price_fx WHERE fiscal_year\
    \ = @fiscal_year),\nu AS (\n    SELECT wc.short_name AS asset, wc.onshore_offshore, 0 AS ord, a.manpower_cr, a.boe, a.regular_headcount\n\
    \    FROM a JOIN dim_work_centre wc ON wc.wc_id = a.asset_wc_id\n    UNION ALL\n    SELECT 'All producing assets', 'all',\
    \ 1, SUM(manpower_cr), SUM(boe), SUM(regular_headcount) FROM a\n)\nSELECT\n    u.asset,\n    u.onshore_offshore,\n   \
    \ ROUND(u.manpower_cr, 1) AS manpower_cost_inr_cr,\n    ROUND(u.boe / 1e6, 2) AS mmboe_fy26,\n    ROUND(u.manpower_cr\
    \ * 1e7 / NULLIF(u.boe, 0), 0) AS manpower_cost_inr_per_boe,\n    ROUND(u.manpower_cr * 1e7 / NULLIF(u.boe, 0) / fx.fx,\
    \ 2) AS manpower_cost_usd_per_boe,\n    u.regular_headcount,\n    ROUND(u.boe / NULLIF(u.regular_headcount, 0), 0) AS\
    \ boe_per_employee\nFROM u CROSS JOIN fx\nORDER BY u.ord, manpower_cost_usd_per_boe DESC;"
  params:
    fiscal_year:
      type: STRING
      default: FY26
      description: Fiscal year in FYxx format
      allowed_values:
      - FY21
      - FY22
      - FY23
      - FY24
      - FY25
      - FY26
      - FY27
  visual_kind: table
  provenance:
    source_file: data_bank/answer_key/sql/C12.sql
    sha256: 88676aa92d8c14a48b1a6ae25b800554a601fe46a7ab771acdde85ffb6fb23fa
    gold_objects: hrfin_gold.v_lifting_cost
- id: C13
  group: CMD cross-silo HR × Finance
  canonical_question: If we move 200 executives from Delhi/Dehradun to field assets, what changes in cost and coverage?
  intent_keywords:
  - delhi
  - move
  - '200'
  - executives
  - dehradun
  - field
  intent_description: Moving 200 E3–E5 executives from Delhi and Dehradun to field assets would cost about ₹6.40 cr one-time
    (₹3.20 lakh per officer in transfer g
  parameterized_sql: "-- Answer Key SQL: C13\n-- Question: If we move 200 executives from Delhi/Dehradun to field assets,\
    \ what changes in cost and coverage?\n-- Type: what_if\n-- Semantic audit 2026-10-20: old SQL hard-coded the cost (6.50\
    \ AS estimated_cta_outlay_cr, i.e. an assumed\n-- Rs 3.25 lakh per officer), summed sanctioned/in-position strength over\
    \ ALL grades for four hand-picked\n-- assets, and never allocated the 200 officers. Now a parameterised scenario:\n--\
    \   * movers: 200 E3-E5 executives (scenario parameter from the question) from WC-DEL + WC-DDN; the source\n--     pool\
    \ size and how many of them are already overdue for rotation (>= 60 months, outside the 3-year\n--     pre-retirement\
    \ protection) are shown;\n--   * one-time cost: average actual total transfer cost (transfer grant + CTA + baggage) of\
    \ E3-E5\n--     rotation / hard-station postings in FY24-FY26 from posting_history, x officers allocated;\n--   * recurring\
    \ cost: Special Hard Station Allowance = 10% of basic pay (JRTP Clause 6.3) for officers\n--     placed in Category-C\
    \ assets, using the FY26 average annual basic pay of the Delhi/Dehradun E3-E5 pool;\n--   * coverage: the 200 are allocated\
    \ to field assets (dim_work_centre.type = 'asset') pro-rata to their FY26\n--     executive vacancy (sanctioned_posts,\
    \ E-grades), capped at each asset's vacancy.\n-- Salaries move with the officers, so there is no payroll saving; HQ strength\
    \ falls by the number moved.\n-- Semantic audit 2026-10-20 (alignment with C1/H10/X10): overdue pool also excludes executives\
    \ whose current\n-- posting carries a valid exemption_tag ('None' = no tag; exemption_valid_until >= 2026-10-19 or NULL).\n\
    \nWITH params AS (SELECT 200 AS officers),\npool AS (\n    SELECT\n        COUNT(DISTINCT e.emp_id) AS source_pool_e3_e5,\n\
    \        COUNT(DISTINCT IF(v.continuous_stay_months >= @min_stay_months AND DATE_DIFF(v.retirement_date, DATE '2026-10-19',\
    \ DAY) > 3 * 365.25 AND ex.emp_id IS NULL, e.emp_id, NULL)) AS source_pool_overdue\n    FROM employee_master e\n    LEFT\
    \ JOIN `ongc-hr-finance-agent.hrfin_gold.v_continuous_stay` v ON v.emp_id = e.emp_id AND v.is_current_stay\n    LEFT JOIN\
    \ (SELECT DISTINCT emp_id FROM posting_history WHERE is_current_posting = TRUE AND NULLIF(exemption_tag, 'None') IS NOT\
    \ NULL\n               AND (exemption_valid_until >= DATE '2026-10-19' OR exemption_valid_until IS NULL)) ex ON ex.emp_id\
    \ = e.emp_id\n    WHERE LOWER(e.employment_status) = 'active' AND e.current_wc_id IN ( @wc_id, 'WC-DDN') AND e.current_grade_id\
    \ IN ('E3', 'E4', 'E5')\n),\nbasic AS (\n    SELECT SUM(p.basic_pay_inr) / COUNT(DISTINCT p.emp_id) AS avg_annual_basic_inr\n\
    \    FROM payroll_monthly p\n    JOIN employee_master e ON e.emp_id = p.emp_id\n    WHERE p.fiscal_year = @fiscal_year\
    \ AND p.grade_id IN ('E3', 'E4', 'E5') AND p.wc_id IN ('WC-DEL', 'WC-DDN')\n),\ntcost AS (\n    SELECT AVG(total_transfer_cost_inr)\
    \ AS avg_transfer_cost_inr\n    FROM posting_history\n    WHERE fiscal_year IN ('FY24', 'FY25', 'FY26') AND grade_id IN\
    \ ('E3', 'E4', 'E5')\n      AND LOWER(posting_type) IN ('rotation', 'hard_station') AND total_transfer_cost_inr > 0\n\
    ),\nvac AS (\n    SELECT w.wc_id, w.short_name, w.hard_station_cat,\n           SUM(sp.sanctioned_strength) AS exec_sanctioned,\
    \ SUM(sp.in_position_strength) AS exec_in_position, SUM(sp.vacancy_count) AS exec_vacancy\n    FROM sanctioned_posts sp\n\
    \    JOIN dim_work_centre w ON w.wc_id = sp.wc_id\n    WHERE sp.fiscal_year = @fiscal_year AND sp.grade_id LIKE 'E%' AND\
    \ LOWER(w.type) = 'asset'\n    GROUP BY 1, 2, 3\n    HAVING SUM(sp.vacancy_count) > 0\n),\nalloc AS (\n    SELECT v.*,\
    \ LEAST(v.exec_vacancy, CAST(ROUND(p.officers * v.exec_vacancy / SUM(v.exec_vacancy) OVER ()) AS INT64)) AS allocated_officers\n\
    \    FROM vac v CROSS JOIN params p\n),\nrows_ AS (\n    SELECT 'receiving_asset' AS section, 0 AS ord, a.short_name AS\
    \ entity, a.hard_station_cat,\n           a.exec_sanctioned, a.exec_in_position, a.exec_vacancy, a.allocated_officers,\n\
    \           a.allocated_officers * t.avg_transfer_cost_inr / 1e7 AS one_time_cost_cr,\n           IF(a.hard_station_cat\
    \ = 'C', a.allocated_officers * b.avg_annual_basic_inr * 0.10 / 1e7, 0) AS annual_allowance_cr\n    FROM alloc a CROSS\
    \ JOIN tcost t CROSS JOIN basic b\n)\nSELECT\n    r.section, r.entity, r.hard_station_cat, r.exec_sanctioned, r.exec_in_position,\
    \ r.exec_vacancy, r.allocated_officers,\n    r.exec_vacancy - r.allocated_officers AS vacancy_after_move,\n    ROUND(r.exec_in_position\
    \ * 100.0 / NULLIF(r.exec_sanctioned, 0), 1) AS fill_pct_before,\n    ROUND((r.exec_in_position + r.allocated_officers)\
    \ * 100.0 / NULLIF(r.exec_sanctioned, 0), 1) AS fill_pct_after,\n    ROUND(r.one_time_cost_cr, 2) AS one_time_transfer_cost_cr,\n\
    \    ROUND(r.annual_allowance_cr, 2) AS annual_hard_station_allowance_cr,\n    CAST(NULL AS INT64) AS source_pool_e3_e5,\
    \ CAST(NULL AS INT64) AS source_pool_overdue,\n    CAST(NULL AS FLOAT64) AS avg_transfer_cost_lakh\nFROM rows_ r\nUNION\
    \ ALL\nSELECT\n    'scenario_total', 'All receiving field assets', NULL,\n    SUM(r.exec_sanctioned), SUM(r.exec_in_position),\
    \ SUM(r.exec_vacancy), SUM(r.allocated_officers),\n    SUM(r.exec_vacancy) - SUM(r.allocated_officers),\n    ROUND(SUM(r.exec_in_position)\
    \ * 100.0 / NULLIF(SUM(r.exec_sanctioned), 0), 1),\n    ROUND((SUM(r.exec_in_position) + SUM(r.allocated_officers)) *\
    \ 100.0 / NULLIF(SUM(r.exec_sanctioned), 0), 1),\n    ROUND(SUM(r.one_time_cost_cr), 2), ROUND(SUM(r.annual_allowance_cr),\
    \ 2),\n    ANY_VALUE(pool.source_pool_e3_e5), ANY_VALUE(pool.source_pool_overdue),\n    ROUND(ANY_VALUE(t.avg_transfer_cost_inr)\
    \ / 1e5, 2)\nFROM rows_ r CROSS JOIN pool CROSS JOIN tcost t\nORDER BY section, allocated_officers DESC;"
  params:
