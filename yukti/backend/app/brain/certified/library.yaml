    self_emp_id:
      type: STRING
      default: EMP-102451
      description: Caller's own employee ID bound from server-side Principal.emp_id
  visual_kind: table
- id: my_pay_components_fy
  group: self
  data_class: self
  canonical_question: Show my YTD and fiscal-year pay components breakdown.
  intent_keywords:
