  parameterized_sql: "-- Answer Key SQL: T1\n-- Question: \"Which fields lost money in FY26?\" → \"Why is Field X losing?\"\
    \ → \"How many people work there, and what do they cost?\" → \"Draft a board note with options.\"\n-- Type: chain\n--\
    \ Semantic audit 2026-10-20: Result unchanged (only Champang lost money at PBT level in FY26; no field had negative EBITDA).\
    \ Added line_type='field' filter (LOWER), dropped dead '2026' code, added context columns (maturity, lifting cost, root\
    \ cause, fields evaluated).\n\nSELECT\n    pnl.field_id,\n    f.name AS field_name,\n    f.onshore_offshore,\n    f.maturity,\n\
    \    pnl.asset_wc_id,\n    pnl.fiscal_year,\n    pnl.gross_revenue_inr_cr,\n    pnl.total_opex_inr_cr,\n    pnl.ebitda_inr_cr,\n\
    \    pnl.dda_depreciation_inr_cr,\n    pnl.pbt_inr_cr,\n    pnl.lifting_cost_per_boe_usd,\n    pnl.root_cause_loss_code,\n\
    \    pnl.is_loss_making_3yr_consecutive,\n    (SELECT COUNT(*) FROM field_pnl_annual x WHERE x.fiscal_year = @fiscal_year\
    \ AND LOWER(x.line_type) = 'field') AS fields_evaluated\nFROM field_pnl_annual pnl\nJOIN dim_field f ON pnl.field_id =\
    \ f.field_id\nWHERE pnl.fiscal_year = @fiscal_year\n  AND LOWER(pnl.line_type) = 'field'\n  AND (pnl.pbt_inr_cr < 0 OR\
    \ pnl.ebitda_inr_cr < 0)\nORDER BY pnl.pbt_inr_cr ASC;"
