- id: W2
  group: What-if
  canonical_question: If we freeze hiring for 2 years, what will headcount be by discipline in 2028, given retirements?
  intent_keywords:
  - retirement
  - headcount
  - discipline
  - freeze
  - hiring
  - years
  intent_description: With a 2-year hiring freeze, headcount falls from 22,798 to about 21,479 by Oct-2028 (-5.8%), as 1,319
    employees reach superannuation.
  parameterized_sql: "-- Answer Key SQL: W2\n-- Question: If we freeze hiring for 2 years, what will headcount be by discipline\
    \ in 2028, given retirements?\n-- Type: what_if\n-- Semantic audit 2026-10-20: Old SQL restricted 'headcount' to executives\
    \ only (13,453 of 22,798), silently dropping 9,345 non-executives from discipline headcounts.\n-- Semantic audit 2026-10-20:\
    \ Now: whole active workforce by discipline (executives shown separately), retirements 20-Oct-2026..19-Oct-2028, projected\
    \ headcount under a 2-year hiring freeze (retirement-only attrition).\n\nSELECT\n    d.discipline_id,\n    d.name AS discipline_name,\n\
    \    COUNT(DISTINCT e.emp_id) AS current_headcount,\n    COUNT(DISTINCT IF(e.current_grade_id LIKE 'E%', e.emp_id, NULL))\
    \ AS current_executives,\n    COUNT(DISTINCT IF(e.retirement_date BETWEEN DATE '2026-10-20' AND DATE '2028-10-19', e.emp_id,\
    \ NULL)) AS retirements_by_oct2028,\n    COUNT(DISTINCT e.emp_id) - COUNT(DISTINCT IF(e.retirement_date BETWEEN DATE '2026-10-20'\
    \ AND DATE '2028-10-19', e.emp_id, NULL)) AS projected_headcount_oct2028,\n    ROUND(-COUNT(DISTINCT IF(e.retirement_date\
    \ BETWEEN DATE '2026-10-20' AND DATE '2028-10-19', e.emp_id, NULL)) * 100.0 / NULLIF(COUNT(DISTINCT e.emp_id), 0), 1)\
    \ AS change_pct\nFROM employee_master e\nJOIN dim_discipline d ON e.discipline_id = d.discipline_id\nWHERE LOWER(e.employment_status)\
    \ = 'active'\nGROUP BY d.discipline_id, d.name\nORDER BY current_headcount DESC;"
  params: {}
  visual_kind: table
  provenance:
    source_file: data_bank/answer_key/sql/W2.sql
    sha256: 89f9904a3d7232cd44a20a59a2c6feca1f512abab81b8fae2a37df987e9c81ca
    gold_objects: hrfin_silver.employee_master, dim_discipline, dim_grade
- id: W3
  group: What-if
  canonical_question: If we move 200 executives from Delhi/Dehradun to field assets, what happens to transfer-grant cost and
    asset coverage?
  intent_keywords:
  - delhi
  - move
  - '200'
  - executives
  - dehradun
  - field
  intent_description: Moving 200 executives to field assets costs about ₹6.40 cr in one-time transfer grants (₹3,20,000 per
    officer, FY26 average) and lifts execu
  parameterized_sql: "-- Answer Key SQL: W3\n-- Question: If we move 200 executives from Delhi/Dehradun to field assets, what\
    \ happens to transfer-grant cost and asset coverage?\n-- Type: what_if\n-- Semantic audit 2026-10-20: Old SQL hard-coded\
    \ 200 officers and Rs 6.50 cr, summed vacancies across all cadres (incl. non-executive) for 4 hand-picked work centres\
    \ (Assam actually has 0 executive vacancies).\n-- Semantic audit 2026-10-20: Now: 200 movers allocated pro-rata to FY26\
    \ executive vacancies across the 14 operating assets; coverage before/after; cost at the FY26 average cost per transfer\
    \ from posting_history; movable Delhi+Dehradun pool for feasibility.\n\nWITH vac AS (\n    SELECT w.wc_id, w.short_name,\
    \ w.hard_station_cat,\n           SUM(s.sanctioned_strength) AS sanc, SUM(s.in_position_strength) AS inpos, SUM(s.vacancy_count)\
    \ AS vacancies\n    FROM dim_work_centre w\n    JOIN sanctioned_posts s ON s.wc_id = w.wc_id\n    WHERE s.fiscal_year\
    \ = @fiscal_year AND LOWER(s.grade_band) != 'non_executive' AND LOWER(w.type) = 'asset'\n    GROUP BY w.wc_id, w.short_name,\
    \ w.hard_station_cat\n),\ncost AS (\n    SELECT AVG(total_transfer_cost_inr) AS avg_cost\n    FROM posting_history\n \
    \   WHERE fiscal_year = @fiscal_year AND LOWER(posting_type) IN ('rotation', 'hard_station')\n),\npool AS (\n    SELECT\
    \ COUNT(DISTINCT v.emp_id) AS movable_pool\n    FROM `ongc-hr-finance-agent.hrfin_gold.v_continuous_stay` v\n    WHERE\
    \ v.is_current_stay AND v.wc_id IN ( @wc_id, 'WC-DDN') AND v.grade_id LIKE 'E%'\n      AND v.continuous_stay_months >=\
    \ @min_stay_months\n      AND DATE_DIFF(v.retirement_date, DATE '2026-10-19', DAY) > 3 * 365.25\n),\na1 AS (\n    SELECT\
    \ *, 200.0 * vacancies / SUM(vacancies) OVER () AS raw_alloc FROM vac\n),\na2 AS (\n    SELECT *, CAST(FLOOR(raw_alloc)\
    \ AS INT64) AS base_alloc, raw_alloc - FLOOR(raw_alloc) AS frac FROM a1\n),\na3 AS (\n    SELECT *,\n           base_alloc\
    \ + IF(ROW_NUMBER() OVER (ORDER BY frac DESC, vacancies DESC) <= 200 - SUM(base_alloc) OVER (), 1, 0) AS allocated\n \
    \   FROM a2\n)\nSELECT\n    a3.short_name AS field_asset,\n    a3.hard_station_cat,\n    a3.sanc AS exec_sanctioned,\n\
    \    a3.inpos AS exec_in_position,\n    a3.vacancies AS exec_vacancies,\n    ROUND(a3.inpos * 100.0 / a3.sanc, 1) AS coverage_pct_now,\n\
    \    LEAST(a3.allocated, a3.vacancies) AS officers_allocated,\n    ROUND((a3.inpos + LEAST(a3.allocated, a3.vacancies))\
    \ * 100.0 / a3.sanc, 1) AS coverage_pct_after,\n    a3.vacancies - LEAST(a3.allocated, a3.vacancies) AS vacancies_after,\n\
    \    ROUND(LEAST(a3.allocated, a3.vacancies) * cost.avg_cost / 1e7, 2) AS transfer_cost_inr_cr,\n    ROUND(cost.avg_cost,\
    \ 0) AS avg_cost_per_transfer_inr,\n    pool.movable_pool AS delhi_ddn_movable_pool\nFROM a3\nCROSS JOIN cost\nCROSS JOIN\
    \ pool\nORDER BY exec_vacancies DESC, field_asset;"
  params:
    fiscal_year:
      type: STRING
