- id: C14
  group: CMD cross-silo HR × Finance
  canonical_question: 'Prepare a one-page board note on the top 5 loss-making fields: production, cost, staffing and a recommendation.'
  intent_keywords:
  - loss-making
  - one-page
  - board
  - note
  - top
  - fields
  intent_description: Only 1 of the five weakest FY26 fields actually lost money (Champang, ₹-4.93 cr PBT); the other 4 are
    profitable but thin, so the board issu
  parameterized_sql: "-- Answer Key SQL: C14\n-- Question: Prepare a one-page board note on the top 5 loss-making fields:\
    \ production, cost, staffing and a recommendation.\n-- Type: document\n-- Semantic audit 2026-10-20: old SQL returned\
    \ only revenue/opex/EBITDA/PBT for the five lowest-PBT fields - no\n-- production, staffing or recommendation inputs -\
    \ and the legacy board-note text called all five \"top\n-- operating losses\" although only one (Champang) is PBT-negative\
    \ in FY26. Now the five lowest-PBT FY26 fields\n-- (field lines only) with production (MMboe), revenue, opex, manpower\
    \ cost, EBITDA, PBT, regular and contract\n-- headcount, lifting cost (USD/BOE, from field_pnl_annual), monetisation flags,\
    \ root cause and the recorded\n-- 5-year PEC/farm-out payoff, plus a loss flag so the note can state how many are actually\
    \ loss-making.\n\nSELECT\n    f.name AS field_name,\n    wc.short_name AS asset,\n    f.maturity,\n    ROUND(pnl.total_production_boe\
    \ / 1e6, 2) AS mmboe_fy26,\n    pnl.gross_revenue_inr_cr,\n    pnl.total_opex_inr_cr,\n    pnl.allocated_manpower_cost_inr_cr,\n\
    \    pnl.ebitda_inr_cr,\n    pnl.pbt_inr_cr,\n    pnl.pbt_inr_cr < 0 AS is_loss_making,\n    pnl.regular_employee_headcount,\n\
    \    pnl.contractor_headcount,\n    pnl.lifting_cost_per_boe_usd,\n    pnl.manpower_cost_per_boe_usd,\n    pnl.pec_monetisation_potential_flag,\n\
    \    pnl.is_divestment_candidate,\n    pnl.root_cause_loss_code,\n    pnl.projected_pec_farmout_payoff_5yr_inr_cr\nFROM\
    \ field_pnl_annual pnl\nJOIN dim_field f ON pnl.field_id = f.field_id\nJOIN dim_work_centre wc ON pnl.asset_wc_id = wc.wc_id\n\
    WHERE pnl.fiscal_year = @fiscal_year\n  AND LOWER(pnl.line_type) = 'field'\nORDER BY pnl.pbt_inr_cr ASC\nLIMIT 5;"
  params:
    fiscal_year:
      type: STRING
      default: FY26
      description: Fiscal year in FYxx format
      allowed_values:
      - FY21
      - FY22
      - FY23
      - FY24
      - FY25
      - FY26
      - FY27
