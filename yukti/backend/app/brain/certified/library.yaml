  intent_description: 419 executives currently posted at Delhi HQ have 5 or more years of continuous stay; the longest is
    8.4 years. 17 are within 3 years of supe
  parameterized_sql: "-- Answer Key SQL: T2\n-- Question: \"Who in Delhi has 5+ years?\" → \"Which of them breach the transfer\
    \ policy?\" → \"Match them to vacancies at hard stations.\" → \"Export as an Excel transfer proposal.\"\n-- Type: chain\n\
    -- Semantic audit 2026-10-20: Old SQL truncated the list at LIMIT 100 (419 qualify); its COALESCE(exemption_tag,'Impending_Retirement')\
    \ was intended to impute exemptions (silver stores the literal string 'None', so it showed 'None').\n-- Semantic audit\
    \ 2026-10-20: Now: all executives currently in Delhi HQ with >= 5 years continuous stay (v_continuous_stay, consistent\
    \ with C1), exemption tag with 'None' mapped to NULL, and 3-year pre-retirement flag.\n\nSELECT\n    v.emp_id,\n    v.grade_id,\n\
    \    v.discipline_id,\n    d.name AS discipline_name,\n    v.continuous_from_date,\n    ROUND(v.continuous_stay_months\
    \ / 12.0, 1) AS delhi_years,\n    v.retirement_date,\n    DATE_DIFF(v.retirement_date, DATE '2026-10-19', DAY) <= 3 *\
    \ 365.25 AS within_3yr_of_superannuation,\n    NULLIF(p.exemption_tag, 'None') AS exemption_tag\nFROM `ongc-hr-finance-agent.hrfin_gold.v_continuous_stay`\
    \ v\nJOIN dim_discipline d ON d.discipline_id = v.discipline_id\nLEFT JOIN posting_history p ON p.emp_id = v.emp_id AND\
    \ p.is_current_posting AND p.wc_id = @wc_id\nWHERE v.is_current_stay AND v.wc_id = 'WC-DEL' AND v.grade_id LIKE 'E%' AND\
    \ v.continuous_stay_months >= @min_stay_months\nORDER BY delhi_years DESC, v.emp_id;"
