    gold_objects: hrfin_silver, hrfin_gold
- id: C3
  group: CMD people and transfers
  canonical_question: Which areas saw no headcount increase in the last 5 years, and which saw the most?
  intent_keywords:
  - headcount
  - areas
  - saw
  - increase
  - years
  - most
  intent_description: 44 of 46 work centres saw no headcount increase between 31-Mar-2021 and 31-Mar-2026; only Delhi HQ (+191,
    +25.2%) and Eastern Offshore (+51,
  parameterized_sql: "-- Answer Key SQL: C3\n-- Question: Which areas saw no headcount increase in the last 5 years, and which\
    \ saw the most?\n-- Type: data\n-- Semantic audit 2026-10-20: (1) headcount_snapshot is a monthly stock - the old SQL\
    \ SUMmed 12 FY26 months\n-- against the single FY21 (March) snapshot, inflating growth ~10x (e.g. Eastern Offshore 960\
    \ -> 12,312,\n-- +1,182%); (2) it hard-coded four work centres, so it could not say which areas saw no increase. Now:\
    \ every\n-- work centre, period-end snapshots 31-Mar-2021 (month '2021-03') vs 31-Mar-2026 (month '2026-03'), with a\n\
    -- flag for \"no increase\" (change <= 0). Ordered by absolute change, largest first.\n\nWITH hc AS (\n    SELECT\n  \
    \      wc_id,\n        SUM(CASE WHEN month = '2021-03' THEN headcount END) AS hc_mar21,\n        SUM(CASE WHEN month =\
    \ '2026-03' THEN headcount END) AS hc_mar26\n    FROM headcount_snapshot\n    WHERE month IN ('2021-03', '2026-03')\n\
    \    GROUP BY wc_id\n)\nSELECT\n    wc.wc_id,\n    wc.short_name,\n    wc.type AS wc_type,\n    wc.sector,\n    COALESCE(h.hc_mar21,\
    \ 0) AS hc_mar21,\n    COALESCE(h.hc_mar26, 0) AS hc_mar26,\n    COALESCE(h.hc_mar26, 0) - COALESCE(h.hc_mar21, 0) AS\
    \ hc_change,\n    ROUND((COALESCE(h.hc_mar26, 0) - h.hc_mar21) * 100.0 / NULLIF(h.hc_mar21, 0), 1) AS growth_pct,\n  \
    \  (COALESCE(h.hc_mar26, 0) - COALESCE(h.hc_mar21, 0)) <= 0 AS no_increase\nFROM hc h\nJOIN dim_work_centre wc ON h.wc_id\
    \ = wc.wc_id\nORDER BY hc_change DESC, growth_pct DESC;"
  params: {}
  visual_kind: table
  provenance:
    source_file: data_bank/answer_key/sql/C3.sql
    sha256: dc0c17230910f2d4d9571be72521eee4556acf59b849b09c229f41b773579dde
    gold_objects: hrfin_silver, hrfin_gold
- id: C4
  group: CMD people and transfers
  canonical_question: How many E7+ (GM and above) officers retire in the next 3 years, and which of those roles have no ready
    successor?
  intent_keywords:
  - above
  - officers
  - retire
  - years
  - those
  - roles
  intent_description: '106 of 1,129 active E7+ officers (GM and above, including board level) retire in the next three years
    (19-Oct-2026 to 18-Oct-2029): E7 78, E'
  parameterized_sql: "-- Answer Key SQL: C4\n-- Question: How many E7+ (GM and above) officers retire in the next 3 years,\
    \ and which of those roles have no ready successor?\n-- Type: data\n-- Semantic audit 2026-10-20: (1) the retirement window\
    \ was a DOB band 1966-04-01..1969-03-31 (= retirements\n-- Apr-2026..Mar-2029, partly in the past) instead of the next\
    \ 3 years from 2026-10-19; it found 39 retirees.\n-- Now retirement_date BETWEEN 2026-10-19 AND 2029-10-18 on active staff;\
    \ (2) E7+ now includes board-level\n-- incumbents (DIR, CMD) as \"GM and above\"; (3) the old output only had grade x\
    \ readiness counts and never named\n-- a role. Two sections:\n--   'grade_summary'           : per grade - active E7+,\
    \ retiring in 3 years, of which in a succession-plan\n--                               position, of which without any\
    \ 'Ready_Now' successor, and not in any plan;\n--   'role_no_ready_successor' : the succession-plan positions whose active\
    \ incumbent retires within 3 years\n--                               and where neither successor_1 nor successor_2 is\
    \ 'Ready_Now'.\n\nWITH e AS (\n    SELECT emp_id, current_grade_id, current_wc_id, retirement_date\n    FROM employee_master\n\
    \    WHERE LOWER(employment_status) = 'active'\n      AND current_grade_id IN ('E7', 'E8', 'E9', 'DIR', 'CMD')\n),\nj\
    \ AS (\n    SELECT e.*, sp.position_id, sp.role_title, sp.wc_id AS position_wc_id, sp.criticality_tier,\n           sp.successor_1_readiness,\
    \ sp.successor_2_readiness, sp.readiness_gap_reason,\n           (sp.position_id IS NOT NULL\n            AND COALESCE(LOWER(sp.successor_1_readiness),\
    \ '') != 'ready_now'\n            AND COALESCE(LOWER(sp.successor_2_readiness), '') != 'ready_now') AS no_ready_successor,\n\
    \           e.retirement_date BETWEEN DATE '2026-10-19' AND DATE '2029-10-18' AS retires_3yr\n    FROM e\n    LEFT JOIN\
    \ succession_plan sp ON sp.incumbent_emp_id = e.emp_id\n)\nSELECT\n    'grade_summary' AS section,\n    current_grade_id\
    \ AS grade_id,\n    CAST(NULL AS STRING) AS role_title,\n    CAST(NULL AS STRING) AS work_centre,\n    CAST(NULL AS STRING)\
    \ AS criticality_tier,\n    CAST(NULL AS DATE) AS retirement_date,\n    CAST(NULL AS STRING) AS successor_1_readiness,\n\
    \    CAST(NULL AS STRING) AS readiness_gap_reason,\n    COUNT(DISTINCT emp_id) AS active_officers,\n    COUNT(DISTINCT\
    \ IF(retires_3yr, emp_id, NULL)) AS retiring_next_3yr,\n    COUNT(DISTINCT IF(retires_3yr AND position_id IS NOT NULL,\
    \ emp_id, NULL)) AS retiring_in_plan_position,\n    COUNT(DISTINCT IF(retires_3yr AND no_ready_successor, emp_id, NULL))\
    \ AS retiring_no_ready_successor,\n    COUNT(DISTINCT IF(retires_3yr AND position_id IS NULL, emp_id, NULL)) AS retiring_not_in_succession_plan\n\
    FROM j\nGROUP BY current_grade_id\nUNION ALL\nSELECT\n    'role_no_ready_successor',\n    j.current_grade_id,\n    j.role_title,\n\
    \    w.short_name,\n    j.criticality_tier,\n    j.retirement_date,\n    j.successor_1_readiness,\n    j.readiness_gap_reason,\n\
    \    1, 1, 1, 1, 0\nFROM j\nJOIN dim_work_centre w ON w.wc_id = j.position_wc_id\nWHERE j.retires_3yr AND j.no_ready_successor\n\
    ORDER BY section, grade_id, retirement_date;"
  params: {}
  visual_kind: table
  provenance:
    source_file: data_bank/answer_key/sql/C4.sql
    sha256: 696331f516fe29f4647a9da808607b4a4819101d50039fea56697fcf1347de7b
    gold_objects: hrfin_silver, hrfin_gold
- id: C5
  group: CMD people and transfers
  canonical_question: Which disciplines (geoscience, drilling, reservoir, production) face the biggest retirement-driven skill
    gap by 2030?
  intent_keywords:
  - retirement
  - discipline
  - disciplines
  - geoscience
  - drilling
  - reservoir
  intent_description: Production faces the largest retirement gap by FY30 in absolute terms (823 of 2,926 executives, 28.1%),
    but Drilling is hit hardest proporti
  parameterized_sql: "-- Answer Key SQL: C5\n-- Question: Which disciplines (geoscience, drilling, reservoir, production)\
    \ face the biggest retirement-driven skill gap by 2030?\n-- Type: data\n-- Semantic audit 2026-10-20: counts were correct\
    \ (retiring by 31-Mar-2030 = end of FY30) but the status filter\n-- \"employment_status = 'Active' OR separation_date\
    \ IS NULL\" is replaced by LOWER(employment_status) = 'active'\n-- and the retirement test now uses retirement_date (same\
    \ result, explicit). Added Geophysics (Wells) to the\n-- geoscience set and an E0-E2 junior pipeline column so the \"\
    gap\" can be read against replacement depth.\n\nSELECT\n    d.discipline_id,\n    d.name AS discipline_name,\n    COUNT(DISTINCT\
    \ e.emp_id) AS active_executives,\n    COUNT(DISTINCT CASE WHEN e.retirement_date <= DATE '2030-03-31' THEN e.emp_id END)\
    \ AS retiring_by_fy30,\n    ROUND(COUNT(DISTINCT CASE WHEN e.retirement_date <= DATE '2030-03-31' THEN e.emp_id END) *\
    \ 100.0 / NULLIF(COUNT(DISTINCT e.emp_id), 0), 1) AS retirement_pct,\n    COUNT(DISTINCT CASE WHEN e.retirement_date <=\
    \ DATE '2030-03-31' AND e.current_grade_id IN ('E5', 'E6', 'E7', 'E8', 'E9') THEN e.emp_id END) AS retiring_by_fy30_e5_plus,\n\
    \    COUNT(DISTINCT CASE WHEN e.current_grade_id IN ('E0', 'E1', 'E2') THEN e.emp_id END) AS e0_e2_pipeline\nFROM employee_master\
    \ e\nJOIN dim_discipline d ON e.discipline_id = d.discipline_id\nWHERE e.current_grade_id LIKE 'E%'\n  AND d.discipline_id\
    \ IN ('DISC-DRL', 'DISC-GEO', 'DISC-GPS', 'DISC-GPW', 'DISC-RES', 'DISC-PRD')\n  AND LOWER(e.employment_status) = 'active'\n\
    GROUP BY d.discipline_id, d.name\nORDER BY retiring_by_fy30 DESC;"
  params: {}
  visual_kind: table
  provenance:
    source_file: data_bank/answer_key/sql/C5.sql
    sha256: 732058dbb9883b95a1541e23308a4ddd817c1ba5d8565ef2647d9da37ebd51a0
    gold_objects: hrfin_silver, hrfin_gold
- id: C6
  group: CMD money and assets
  canonical_question: Which fields or assets were the most profitable and which made losses in FY26?
  intent_keywords:
  - fields
  - assets
  - were
  - most
  - profitable
  - made
  intent_description: In FY26 the most profitable fields were Mumbai High South (₹7,132 cr PBT), Mumbai High North (₹6,972
    cr PBT) and Gandhar (₹5,703 cr PBT), an
  parameterized_sql: "-- Answer Key SQL: C6\n-- Question: Which fields or assets were the most profitable and which made losses\
    \ in FY26?\n-- Type: data\n-- Semantic audit 2026-10-20: result unchanged in substance (the inner join to dim_field already\
    \ excluded the\n-- non-field P&L lines). Hygiene: explicit LOWER(line_type) = 'field', dropped the never-matching '2026'\n\
    -- fiscal-year alternate, added PBT margin and a loss flag so \"which made losses\" is explicit (FY26: 53 fields).\n\n\
    SELECT\n    f.name AS field_name,\n    wc.short_name AS asset,\n    f.onshore_offshore,\n    f.maturity,\n    pnl.gross_revenue_inr_cr,\n\
    \    pnl.total_opex_inr_cr,\n    pnl.ebitda_inr_cr,\n    pnl.pbt_inr_cr,\n    ROUND(pnl.pbt_inr_cr * 100.0 / NULLIF(pnl.gross_revenue_inr_cr,\
    \ 0), 1) AS pbt_margin_pct,\n    pnl.pbt_inr_cr < 0 AS is_loss_making\nFROM field_pnl_annual pnl\nJOIN dim_field f ON\
    \ pnl.field_id = f.field_id\nJOIN dim_work_centre wc ON pnl.asset_wc_id = wc.wc_id\nWHERE pnl.fiscal_year = @fiscal_year\n\
    \  AND LOWER(pnl.line_type) = 'field'\nORDER BY pnl.pbt_inr_cr DESC;"
  params:
    fiscal_year:
      type: STRING
      default: FY26
      description: Fiscal year in FYxx format
      allowed_values:
      - FY21
      - FY22
      - FY23
      - FY24
      - FY25
      - FY26
      - FY27
  visual_kind: table
  provenance:
    source_file: data_bank/answer_key/sql/C6.sql
    sha256: 741a87b790a8646adfc16bfff26f580af815ac377870a1a7f26a8bf837a64a0b
    gold_objects: hrfin_gold.v_field_pnl, hrfin_silver.field_pnl_annual
- id: C7
  group: CMD money and assets
  canonical_question: Where have we invested the most capex in the last 5 years, and which fields are under-invested relative
    to their reserves?
  intent_keywords:
  - capex
  - where
  - invested
  - most
  - years
  - fields
  intent_description: Over FY22–FY26 the most capex went to Eastern Offshore (₹48,955 cr, 32.1%), Mumbai High (₹26,473 cr,
    17.3%) and Dahej Plant (₹19,430 cr, 12.
  parameterized_sql: "-- Answer Key SQL: C7\n-- Question: Where have we invested the most capex in the last 5 years, and which\
    \ fields are under-invested relative to their reserves?\n-- Type: data\n-- Semantic audit 2026-10-20: WRONG_QUESTION -\
    \ the old SQL was a copy of C9 (project cost overruns, 360\n-- milestone-duplicated rows) and contained no capex history\
    \ or reserves. Now: actual capex FY22-FY26 (last 5\n-- full FYs; capex_budget, all 12 months each) by asset, its share\
    \ of the 5-year total, FY26 2P reserves\n-- (reserves_annual, a balance -> FY26 only, footnote rows with NULL fiscal_year\
    \ excluded), capex per MMTOE of\n-- 2P reserves, and an under-invested flag = capex intensity below half the average of\
    \ reserve-holding assets.\n-- GAP: capex is recorded by asset/project, not by field, so under-investment is assessed at\
    \ asset level; the\n-- asset's largest 2P field is shown for reference.\n\nWITH capex AS (\n    SELECT asset_wc_id, SUM(actual_spend_inr_cr)\
    \ AS capex_5yr_cr\n    FROM capex_budget\n    WHERE fiscal_year IN ('FY22', 'FY23', 'FY24', 'FY25', 'FY26')\n    GROUP\
    \ BY asset_wc_id\n),\nres AS (\n    SELECT asset_wc_id, SUM(reserves_2p_total_mmtoe) AS reserves_2p_mmtoe,\n         \
    \  ARRAY_AGG(field_id ORDER BY reserves_2p_total_mmtoe DESC LIMIT 1)[OFFSET(0)] AS top_field_id\n    FROM reserves_annual\n\
    \    WHERE fiscal_year = @fiscal_year\n    GROUP BY asset_wc_id\n),\nj AS (\n    SELECT c.asset_wc_id, c.capex_5yr_cr,\
    \ r.reserves_2p_mmtoe, r.top_field_id\n    FROM capex c LEFT JOIN res r ON r.asset_wc_id = c.asset_wc_id\n),\navg_int\
    \ AS (\n    SELECT SUM(capex_5yr_cr) / NULLIF(SUM(reserves_2p_mmtoe), 0) AS cr_per_mmtoe_avg\n    FROM j WHERE reserves_2p_mmtoe\
    \ > 0\n)\nSELECT\n    w.short_name AS asset,\n    w.type AS wc_type,\n    ROUND(j.capex_5yr_cr, 0) AS capex_fy22_fy26_cr,\n\
    \    ROUND(j.capex_5yr_cr * 100.0 / SUM(j.capex_5yr_cr) OVER (), 1) AS pct_of_5yr_capex,\n    ROUND(j.reserves_2p_mmtoe,\
    \ 1) AS reserves_2p_mmtoe_fy26,\n    ROUND(j.reserves_2p_mmtoe * 100.0 / SUM(j.reserves_2p_mmtoe) OVER (), 1) AS pct_of_2p_reserves,\n\
    \    ROUND(j.capex_5yr_cr / NULLIF(j.reserves_2p_mmtoe, 0), 1) AS capex_cr_per_mmtoe_2p,\n    ROUND(a.cr_per_mmtoe_avg,\
    \ 1) AS avg_capex_cr_per_mmtoe_2p,\n    (j.reserves_2p_mmtoe > 0 AND j.capex_5yr_cr / j.reserves_2p_mmtoe < 0.5 * a.cr_per_mmtoe_avg)\
    \ AS under_invested,\n    f.name AS largest_2p_field\nFROM j\nCROSS JOIN avg_int a\nJOIN dim_work_centre w ON w.wc_id\
    \ = j.asset_wc_id\nLEFT JOIN dim_field f ON f.field_id = j.top_field_id\nORDER BY j.capex_5yr_cr DESC;"
  params:
