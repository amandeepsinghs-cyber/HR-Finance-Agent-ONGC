- id: F4
  group: Director (Finance)
  canonical_question: How much did royalty, cess and windfall tax reduce realisation per barrel this year?
  intent_keywords:
  - royalty
  - cess
  - windfall
  - tax
  - reduce
  - realisation
  intent_description: In FY27 to date (6 months), royalty, OIDB cess and windfall tax cut ONGC's crude realisation by $22.18/bbl
    (₹1,967/bbl), from $67.73 to $45.
  parameterized_sql: "-- Answer Key SQL: F4\n-- Question: How much did royalty, cess and windfall tax reduce realisation per\
    \ barrel this year?\n-- Type: data\n-- Semantic audit 2026-10-20: was SUM(statutory_levies) for FY26 LEFT JOINed to 12\
    \ monthly price rows (12x fan-out:\n-- Semantic audit 2026-10-20: Rs 3,11,988 cr vs actual 25,999 cr) and in crore, not\
    \ per barrel. Now per-barrel levies\n-- Semantic audit 2026-10-20: from price_fx_monthly: 'this year' = FY27 YTD (Apr-Sep\
    \ 2026, 6 months) with FY26 and FY25\n-- Semantic audit 2026-10-20: (SAED year) for context; monthly per-bbl rates averaged\
    \ within each FY.\n\nSELECT\n    fiscal_year,\n    COUNT(*) AS months_covered,\n    ROUND(AVG(brent_usd_bbl), 2) AS brent_usd_bbl,\n\
    \    ROUND(AVG(ongc_crude_net_realisation_usd_bbl), 2) AS gross_realisation_usd_bbl,\n    ROUND(AVG(royalty_per_barrel_usd),\
    \ 2) AS royalty_usd_bbl,\n    ROUND(AVG(cess_per_barrel_usd), 2) AS oidb_cess_usd_bbl,\n    ROUND(AVG(windfall_tax_saed_usd_bbl),\
    \ 2) AS saed_windfall_usd_bbl,\n    ROUND(AVG(royalty_per_barrel_usd + cess_per_barrel_usd + windfall_tax_saed_usd_bbl),\
    \ 2) AS total_levies_usd_bbl,\n    ROUND(AVG(ongc_crude_net_realisation_usd_bbl - royalty_per_barrel_usd - cess_per_barrel_usd\
    \ - windfall_tax_saed_usd_bbl), 2) AS post_levy_realisation_usd_bbl,\n    ROUND(AVG(royalty_per_barrel_usd + cess_per_barrel_usd\
    \ + windfall_tax_saed_usd_bbl) * 100\n          / AVG(ongc_crude_net_realisation_usd_bbl), 1) AS levies_pct_of_realisation,\n\
    \    ROUND(AVG((royalty_per_barrel_usd + cess_per_barrel_usd + windfall_tax_saed_usd_bbl) * inr_usd_fx_rate), 0) AS total_levies_inr_bbl\n\
    FROM price_fx_monthly\nWHERE fiscal_year IN ('FY25', @fiscal_year, 'FY27')\nGROUP BY fiscal_year\nORDER BY fiscal_year\
    \ DESC;"
  params:
    fiscal_year:
      type: STRING
      default: FY26
      description: Fiscal year in FYxx format
      allowed_values:
      - FY21
      - FY22
      - FY23
      - FY24
