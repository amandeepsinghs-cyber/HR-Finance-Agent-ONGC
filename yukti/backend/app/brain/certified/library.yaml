- id: X1
  group: Additional themes
  canonical_question: How many contract workers vs. regular employees per asset, and at what cost per BOE?
  intent_keywords:
  - contract
  - workers
  - regular
  - employees
  - asset
  - cost
  intent_description: 'At 31-Mar-2026 the 15 producing assets had 20,046 contract workers against 16,327 regular employees
    (1.23 contractors per employee), led by '
  parameterized_sql: "-- Answer Key SQL: X1\n-- Question: How many contract workers vs. regular employees per asset, and at\
    \ what cost per BOE?\n-- Type: data\n-- Semantic audit 2026-10-20: Per producing asset: contract workers vs regular employees\
    \ at 31-Mar-2026 (single month, not SUM of 12\n-- monthly snapshots), FY26 contractor cost and regular manpower cost per\
    \ BOE computed from cost / FY26 BOE (USD at FY26 avg FX).\n-- Old SQL summed 12 monthly stocks (Ahmedabad 16,579 contractors\
    \ vs 1,345 real), summed 12 headcount snapshots, used the\n-- unreliable contractor_cost_per_boe_usd column (0 for producing\
    \ Assam) and listed 46 non-producing work centres.\nWITH fx AS (\n    SELECT AVG(inr_usd_fx_rate) AS fx FROM price_fx_monthly\
    \ WHERE fiscal_year = @fiscal_year\n),\nprod AS (\n    SELECT asset_wc_id AS wc_id, SUM(total_production_boe) AS boe_fy26\n\
    \    FROM production_monthly WHERE fiscal_year = @fiscal_year GROUP BY asset_wc_id\n),\ncw_mar AS (\n    SELECT wc_id,\
    \ SUM(contractor_headcount) AS contract_workers_mar26\n    FROM contract_workforce WHERE month = '2026-03' GROUP BY wc_id\n\
    ),\ncw_cost AS (\n    SELECT wc_id, SUM(monthly_cost_inr) / 1e7 AS contractor_cost_fy26_cr\n    FROM contract_workforce\
    \ WHERE fiscal_year = @fiscal_year GROUP BY wc_id\n),\nreg AS (\n    SELECT wc_id, SUM(headcount) AS regular_employees_mar26\n\
    \    FROM headcount_snapshot WHERE month = '2026-03' GROUP BY wc_id\n),\nmp AS (\n    SELECT asset_wc_id AS wc_id, SUM(allocated_manpower_cost_inr_cr)\
    \ AS regular_manpower_cost_fy26_cr\n    FROM field_pnl_annual WHERE fiscal_year = @fiscal_year AND LOWER(line_type) =\
    \ 'field' GROUP BY asset_wc_id\n)\nSELECT\n    w.short_name,\n    w.onshore_offshore,\n    cw_mar.contract_workers_mar26,\n\
    \    reg.regular_employees_mar26,\n    ROUND(SAFE_DIVIDE(cw_mar.contract_workers_mar26, reg.regular_employees_mar26),\
    \ 2) AS contract_to_regular_ratio,\n    ROUND(cw_cost.contractor_cost_fy26_cr, 1) AS contractor_cost_fy26_cr,\n    ROUND(mp.regular_manpower_cost_fy26_cr,\
    \ 1) AS regular_manpower_cost_fy26_cr,\n    ROUND(prod.boe_fy26 / 1e6, 2) AS mmboe_fy26,\n    ROUND(cw_cost.contractor_cost_fy26_cr\
    \ * 1e7 / fx.fx / prod.boe_fy26, 3) AS contractor_cost_per_boe_usd,\n    ROUND(mp.regular_manpower_cost_fy26_cr * 1e7\
    \ / fx.fx / prod.boe_fy26, 2) AS regular_cost_per_boe_usd\nFROM prod\nCROSS JOIN fx\nJOIN dim_work_centre w ON w.wc_id\
    \ = prod.wc_id\nLEFT JOIN cw_mar ON cw_mar.wc_id = prod.wc_id\nLEFT JOIN cw_cost ON cw_cost.wc_id = prod.wc_id\nLEFT JOIN\
    \ reg ON reg.wc_id = prod.wc_id\nLEFT JOIN mp ON mp.wc_id = prod.wc_id\nORDER BY cw_mar.contract_workers_mar26 DESC;"
  params:
    fiscal_year:
      type: STRING
      default: FY26
      description: Fiscal year in FYxx format
      allowed_values:
      - FY21
      - FY22
      - FY23
      - FY24
      - FY25
      - FY26
      - FY27
  visual_kind: table
  provenance:
    source_file: data_bank/answer_key/sql/X1.sql
    sha256: 74405dbaccc0d04c3cc8aca022d6c276e9766fc5e63484e628e01a856e8de2e3
    gold_objects: hrfin_silver, hrfin_gold
- id: X2
  group: Additional themes
  canonical_question: Which assets rely most on contract labour for core operations?
  intent_keywords:
  - assets
  - rely
  - most
  - contract
  - labour
  - core
  intent_description: 'The gas-processing plants rely most on contract labour for core operations: Hazira Plant, Uran Plant
    and Dahej Plant each run 1.58 contract '
  parameterized_sql: "-- Answer Key SQL: X2\n-- Question: Which assets rely most on contract labour for core operations?\n\
    -- Type: data\n-- Semantic audit 2026-10-20: Core-activity work centres ranked by contract dependency at the latest month\
    \ (Sep-2026): contractor\n-- headcount / regular headcount. Old SQL summed 66 monthly stocks (FY22-FY27, e.g. Bassein\
    \ 182,761 'contractors')\n-- and sorted alphabetically instead of by reliance.\nWITH cw AS (\n    SELECT wc_id, SUM(contractor_headcount)\
    \ AS contract_workers, LOGICAL_OR(is_core_activity) AS is_core\n    FROM contract_workforce WHERE month = '2026-09' GROUP\
    \ BY wc_id\n),\nhs AS (\n    SELECT wc_id, SUM(headcount) AS regular_employees\n    FROM headcount_snapshot WHERE month\
    \ = '2026-09' GROUP BY wc_id\n)\nSELECT\n    w.short_name,\n    w.type AS wc_type,\n    w.onshore_offshore,\n    cw.contract_workers\
    \ AS contract_workers_sep26,\n    hs.regular_employees AS regular_employees_sep26,\n    ROUND(cw.contract_workers / hs.regular_employees,\
    \ 2) AS contract_to_regular_ratio,\n    ROUND(cw.contract_workers * 100 / (cw.contract_workers + hs.regular_employees),\
    \ 1) AS contract_share_of_workforce_pct\nFROM cw JOIN hs USING (wc_id) JOIN dim_work_centre w USING (wc_id)\nWHERE cw.is_core\n\
    ORDER BY contract_to_regular_ratio DESC, contract_workers_sep26 DESC;"
  params: {}
  visual_kind: table
  provenance:
    source_file: data_bank/answer_key/sql/X2.sql
    sha256: f27ec941a176b6493f7c0bfc54a6855dcd8c26972f291fa0b4ba5004ed4a9980
    gold_objects: hrfin_silver, hrfin_gold
- id: X3
  group: Additional themes
  canonical_question: Do assets with higher offshore overtime show a higher lost-time injury rate?
  intent_keywords:
  - overtime
  - rti
  - assets
  - higher
  - offshore
  - lost-time
  intent_description: 'Yes: work centres on 54 h/month overtime (all offshore) had an LTIFR of 0.282 in FY26 against 0.090
    for those on 36 h - about 3.1x.'
  parameterized_sql: "-- Answer Key SQL: X3\n-- Question: Do assets with higher offshore overtime show a higher lost-time\
    \ injury rate?\n-- Type: data\n-- Semantic audit 2026-10-20: Answers the yes/no directly: pooled LTIFR (LTIs x 1e6 / man-hours)\
    \ for the high-overtime (54 h/month,\n-- offshore) vs standard (36 h) bands, FY26 and FY22-FY26 (5 full years, equal coverage).\
    \ Old SQL listed 46 work centres\n-- with an average of monthly LTIFRs and never compared the bands.\nSELECT\n    CASE\
    \ WHEN h.monthly_overtime_hours_per_worker >= 50 THEN 'High overtime (54 h/month, offshore)' ELSE 'Standard overtime (36\
    \ h/month)' END AS overtime_band,\n    MAX(h.monthly_overtime_hours_per_worker) AS overtime_hours_per_worker_month,\n\
    \    COUNT(DISTINCT h.wc_id) AS work_centres,\n    COUNTIF(h.fiscal_year = @fiscal_year AND h.lost_time_injury_flag) AS\
    \ ltis_fy26,\n    ROUND(SUM(IF(h.fiscal_year = @fiscal_year, h.total_manhours_worked, 0)) / 1e6, 2) AS million_manhours_fy26,\n\
    \    ROUND(COUNTIF(h.fiscal_year = @fiscal_year AND h.lost_time_injury_flag) * 1e6 / SUM(IF(h.fiscal_year = @fiscal_year,\
    \ h.total_manhours_worked, 0)), 3) AS ltifr_fy26,\n    COUNTIF(h.lost_time_injury_flag) AS ltis_fy22_fy26,\n    ROUND(SUM(h.total_manhours_worked)\
    \ / 1e6, 2) AS million_manhours_fy22_fy26,\n    ROUND(COUNTIF(h.lost_time_injury_flag) * 1e6 / SUM(h.total_manhours_worked),\
    \ 3) AS ltifr_fy22_fy26,\n    COUNTIF(h.lost_time_injury_flag AND h.fatigue_factor_flag) AS fatigue_linked_ltis_fy22_fy26\n\
    FROM hse_incidents h\nWHERE h.fiscal_year IN ('FY22', 'FY23', 'FY24', 'FY25', 'FY26')\nGROUP BY overtime_band\nORDER BY\
    \ overtime_hours_per_worker_month DESC;"
  params:
    fiscal_year:
      type: STRING
      default: FY26
      description: Fiscal year in FYxx format
      allowed_values:
      - FY21
      - FY22
      - FY23
      - FY24
      - FY25
      - FY26
      - FY27
  visual_kind: table
  provenance:
    source_file: data_bank/answer_key/sql/X3.sql
    sha256: 919976cb2cec3cc14b6b9d2ab5e1898d66e29fd9e5db3a982b0930cb952454dd
    gold_objects: hrfin_silver, hrfin_gold
- id: X4
  group: Additional themes
  canonical_question: What is our pension and post-retirement medical liability, and its 5-year trend?
  intent_keywords:
  - retirement
  - pension
  - post-retirement
  - medical
  - liability
  - its
  intent_description: Pension (PRBS) and post-retirement medical (PRMB) obligations stood at ₹25,316 cr at FY26 - ₹18,250
    cr pension and ₹7,066 cr medical - a cha
  parameterized_sql: "-- Answer Key SQL: X4\n-- Question: What is our pension and post-retirement medical liability, and its\
    \ 5-year trend?\n-- Type: data\n-- Semantic audit 2026-10-20: Adds the 5-year trend the question asks for (old SQL returned\
    \ FY26 only, and mixed in PF and gratuity).\n-- One row per FY (FY22-FY26; FY21 not in benefit_liabilities) with PRBS\
    \ pension and PRMB medical obligations,\n-- plan assets and net unfunded. Balances are taken per FY, never summed across\
    \ years.\nSELECT\n    fiscal_year,\n    SUM(IF(LOWER(scheme_type) = 'prbs pension', actuarial_liability_inr_cr, 0)) AS\
    \ prbs_pension_liability_cr,\n    SUM(IF(LOWER(scheme_type) = 'post-retirement medical', actuarial_liability_inr_cr, 0))\
    \ AS prmb_medical_liability_cr,\n    SUM(actuarial_liability_inr_cr) AS combined_liability_cr,\n    SUM(plan_assets_inr_cr)\
    \ AS combined_plan_assets_cr,\n    SUM(net_liability_inr_cr) AS combined_net_unfunded_cr,\n    ROUND(SUM(plan_assets_inr_cr)\
    \ * 100 / SUM(actuarial_liability_inr_cr), 1) AS combined_funded_pct\nFROM benefit_liabilities\nWHERE LOWER(scheme_type)\
    \ IN ('prbs pension', 'post-retirement medical')\nGROUP BY fiscal_year\nORDER BY fiscal_year;"
  params: {}
