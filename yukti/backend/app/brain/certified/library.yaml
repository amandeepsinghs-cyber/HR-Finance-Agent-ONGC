- id: P11
  group: Policy + live data
  canonical_question: Under the transfer policy, who in Delhi has exceeded the cumulative-tenure cap, and who is exempt because
    they retire soon?
  intent_keywords:
  - delhi
  - tenure
  - transfer
  - policy
  - has
  - exceeded
  intent_description: 'No executive in Delhi has exceeded the JRTP 10-year cumulative-tenure cap: the longest cumulative Delhi
    stay among the 692 executives there '
  parameterized_sql: "-- Answer Key SQL: P11\n-- Question: Under the transfer policy, who in Delhi has exceeded the cumulative-tenure\
    \ cap, and who is exempt because they retire soon?\n-- Type: policy_plus_data\n-- Semantic audit 2026-10-20: JRTP Clause\
    \ 1.2 applies only to regular executives E0-E9. Old SQL counted every staff member\n-- Semantic audit 2026-10-20: currently\
    \ in CL-DEL (200 Group C/D non-executives + the CMD) and labelled them \"executives\".\n-- Semantic audit 2026-10-20:\
    \ Now split by staff population via dim_grade.cadre; only the 'executive' row is in JRTP scope.\n-- Semantic audit 2026-10-20:\
    \ Exemption = retirement within 3 years of 2026-10-19 (Clause 7.1 practice; 2-year strict rule also shown).\nWITH delhi\
    \ AS (\n    SELECT v.emp_id, v.cumulative_cluster_years, v.has_breached_cluster_10yr_cap, v.retirement_date, g.cadre\n\
    \    FROM `ongc-hr-finance-agent.hrfin_gold.v_cluster_cumulative_tenure` v\n    JOIN dim_grade g ON g.grade_id = v.current_grade_id\n\
    \    WHERE v.cluster_id = 'CL-DEL' AND v.is_currently_in_cluster\n)\nSELECT\n    CASE LOWER(cadre) WHEN 'executive' THEN\
    \ 'Executives E0-E9 (JRTP scope)'\n                      WHEN 'non_executive' THEN 'Non-executives Group B/C/D (outside\
    \ JRTP)'\n                      ELSE 'Board - CMD/Directors (outside JRTP)' END AS staff_population,\n    LOWER(cadre)\
    \ = 'executive' AS in_jrtp_scope,\n    COUNT(DISTINCT emp_id) AS currently_in_delhi_cluster,\n    ROUND(MAX(cumulative_cluster_years),\
    \ 2) AS max_cumulative_years,\n    COUNT(DISTINCT IF(cumulative_cluster_years >= 8, emp_id, NULL)) AS approaching_cap_8yr_plus,\n\
    \    COUNT(DISTINCT IF(has_breached_cluster_10yr_cap, emp_id, NULL)) AS breached_10yr_cap,\n    COUNT(DISTINCT IF(has_breached_cluster_10yr_cap\
    \ AND DATE_DIFF(retirement_date, DATE '2026-10-19', DAY) <= 3 * 365.25, emp_id, NULL)) AS breached_exempt_retiring_3yr,\n\
    \    COUNT(DISTINCT IF(has_breached_cluster_10yr_cap AND DATE_DIFF(retirement_date, DATE '2026-10-19', DAY) > 3 * 365.25,\
    \ emp_id, NULL)) AS breached_due_transfer,\n    COUNT(DISTINCT IF(DATE_DIFF(retirement_date, DATE '2026-10-19', DAY) <=\
    \ 2 * 365.25, emp_id, NULL)) AS retiring_within_2yr,\n    COUNT(DISTINCT IF(DATE_DIFF(retirement_date, DATE '2026-10-19',\
    \ DAY) <= 3 * 365.25, emp_id, NULL)) AS retiring_within_3yr\nFROM delhi\nGROUP BY 1, 2\nORDER BY in_jrtp_scope DESC, staff_population;"
  params: {}
  visual_kind: table
  provenance:
    source_file: data_bank/answer_key/sql/P11.sql
    sha256: 85f610153e20422e932facc8d18d9579ea851ba431f3457877a3f9a30bdafb34
    gold_objects: hrfin_gold.v_cluster_cumulative_tenure, hrfin_docs.silver_chunks
- id: P12
  group: Policy + live data
  canonical_question: Which executives are due for an E4→E5 merit review and have **not** done a North-East or hard posting?
  intent_keywords:
  - executives
  - due
  - merit
  - review
  - not
  - done
  intent_description: 4 executives due for E4→E5 review have not completed the mandatory continuous 3-year hard/North-East
    tenure; 1 of them (Ajay Ahmed) has neve
  parameterized_sql: "-- Answer Key SQL: P12\n-- Question: Which executives are due for an E4→E5 merit review and have **not**\
    \ done a North-East or hard posting?\n-- Type: policy_plus_data\n-- Semantic audit 2026-10-20: Old SQL counted every E4->E5\
    \ DPC case since FY01 (mostly completed = already promoted) per\n-- Semantic audit 2026-10-20: discipline. \"Due\" now\
    \ = open (status 'delayed', not yet held) E4->E5 cases of Active executives\n-- Semantic audit 2026-10-20: still in grade\
    \ E4. Hard/NE = dim_work_centre.hard_station_cat 'C' (Assam, Jorhat, Tripura,\n-- Semantic audit 2026-10-20: Bokaro, Rajasthan,\
    \ Mumbai High/Bassein/Neelam offshore, Eastern Offshore). JRTP Clause 6.1\n-- Semantic audit 2026-10-20: requires one\
    \ continuous 3-year Cat-C tenure: contiguous Cat-C postings are merged (gaps-and-islands).\n-- Semantic audit 2026-10-20:\
    \ Lists every due executive who has NOT completed a continuous 3-year hard/NE tenure.\nWITH due AS (\n    SELECT d.emp_id,\
    \ d.fiscal_year AS dpc_fiscal_year, d.due_date, d.pending_reason\n    FROM dpc_cases d\n    JOIN employee_master e ON\
    \ e.emp_id = d.emp_id\n    WHERE d.from_grade_id = 'E4' AND d.to_grade_id = 'E5'\n      AND LOWER(d.status) = 'delayed'\
    \ AND d.held_date IS NULL\n      AND LOWER(e.employment_status) = 'active' AND e.current_grade_id = 'E4'\n),\nc_post AS\
    \ (\n    SELECT p.emp_id, p.from_date, COALESCE(p.to_date, DATE '2026-10-19') AS to_date\n    FROM posting_history p\n\
    \    JOIN dim_work_centre w ON w.wc_id = p.wc_id\n    WHERE UPPER(w.hard_station_cat) = 'C' AND p.emp_id IN (SELECT emp_id\
    \ FROM due)\n),\nflagged AS (\n    SELECT *, IF(from_date > DATE_ADD(MAX(to_date) OVER (PARTITION BY emp_id ORDER BY from_date\
    \ ROWS BETWEEN UNBOUNDED PRECEDING AND 1 PRECEDING), INTERVAL 1 DAY), 1, 0) AS new_run\n    FROM c_post\n),\nruns AS (\n\
    \    SELECT emp_id, SUM(new_run) OVER (PARTITION BY emp_id ORDER BY from_date) AS run_id, from_date, to_date FROM flagged\n\
    ),\nhs AS (\n    SELECT emp_id, MAX(run_days) AS longest_run_days, SUM(run_days) AS total_c_days\n    FROM (SELECT emp_id,\
    \ run_id, DATE_DIFF(MAX(to_date), MIN(from_date), DAY) AS run_days FROM runs GROUP BY 1, 2)\n    GROUP BY 1\n)\nSELECT\n\
    \    e.emp_id,\n    e.name,\n    dd.name AS discipline,\n    w.short_name AS current_work_centre,\n    due.dpc_fiscal_year,\n\
    \    due.pending_reason,\n    hs.emp_id IS NULL AS never_hard_or_ne_posted,\n    ROUND(COALESCE(hs.total_c_days, 0) /\
    \ 365.25, 2) AS hard_ne_service_years,\n    ROUND(COALESCE(hs.longest_run_days, 0) / 365.25, 2) AS longest_continuous_hard_ne_years,\n\
    \    COALESCE(hs.longest_run_days, 0) AS longest_continuous_hard_ne_days\nFROM due\nJOIN employee_master e ON e.emp_id\
    \ = due.emp_id\nLEFT JOIN dim_discipline dd ON dd.discipline_id = e.discipline_id\nLEFT JOIN dim_work_centre w ON w.wc_id\
    \ = e.current_wc_id\nLEFT JOIN hs ON hs.emp_id = due.emp_id\nWHERE COALESCE(hs.longest_run_days, 0) < 1095\nORDER BY never_hard_or_ne_posted\
    \ DESC, longest_continuous_hard_ne_days, e.emp_id;"
  params: {}
  visual_kind: table
  provenance:
    source_file: data_bank/answer_key/sql/P12.sql
    sha256: 20aa186b046b239ff42b825542e46d0e304a7efa2f06149474713c79ce9e60b7
    gold_objects: hrfin_silver, hrfin_gold
- id: P13
  group: Policy + live data
  canonical_question: Are we within the DPE 30% superannuation cap on benefits? How much headroom is left?
  intent_keywords:
  - superannuation
  - within
  - dpe
  - cap
  - benefits
  - headroom
  intent_description: 'Yes: FY26 employer superannuation contributions were 27.6% of Basic + DA against the DPE 30% cap, leaving
    2.4 percentage points, or ₹119 cr '
  parameterized_sql: "-- Answer Key SQL: P13\n-- Question: Are we within the DPE 30% superannuation cap on benefits? How much\
    \ headroom is left?\n-- Type: policy_plus_data\n-- Semantic audit 2026-10-20: Old SQL listed benefit_liabilities.annual_payout_inr_cr\
    \ (benefits PAID to retirees) and a flag;\n-- Semantic audit 2026-10-20: the DPE cap (PRBS Clause 3.1) is on EMPLOYER\
    \ CONTRIBUTIONS as % of (Basic Pay + DA). Now computed\n-- Semantic audit 2026-10-20: from payroll_monthly: employer CPF\
    \ + PRBS + PRMB; gratuity is not in payroll, so its accrual rate is\n-- Semantic audit 2026-10-20: imputed as superannuation_benefit_pct\
    \ minus the three payroll rates (stated as an assumption).\n-- Semantic audit 2026-10-20: FY25 and FY26 full years plus\
    \ FY27 YTD (Apr-Sep, 6 months; rates comparable, crore amounts are not).\nWITH p AS (\n    SELECT fiscal_year,\n     \
    \   COUNT(DISTINCT month) AS months_covered,\n        SUM(basic_pay_inr + da_inr) / 1e7 AS basic_da_cr,\n        SUM(employer_cpf_inr)\
    \ / 1e7 AS cpf_cr,\n        SUM(employer_prbs_inr) / 1e7 AS prbs_cr,\n        SUM(employer_prmb_inr) / 1e7 AS prmb_cr,\n\
    \        SUM(superannuation_benefit_pct / 100 * (basic_pay_inr + da_inr)) / 1e7 AS total_super_cr\n    FROM payroll_monthly\n\
    \    WHERE fiscal_year IN ('FY25', @fiscal_year, 'FY27')\n    GROUP BY fiscal_year\n)\nSELECT\n    fiscal_year,\n    months_covered,\n\
    \    ROUND(basic_da_cr, 1) AS basic_plus_da_cr,\n    ROUND(100 * cpf_cr / basic_da_cr, 2) AS cpf_pct,\n    ROUND(100 *\
    \ prbs_cr / basic_da_cr, 2) AS prbs_pct,\n    ROUND(100 * prmb_cr / basic_da_cr, 2) AS prmb_pct,\n    ROUND(100 * (total_super_cr\
    \ - cpf_cr - prbs_cr - prmb_cr) / basic_da_cr, 2) AS gratuity_pct_imputed,\n    ROUND(100 * total_super_cr / basic_da_cr,\
    \ 2) AS total_employer_super_pct,\n    30.0 AS dpe_cap_pct,\n    ROUND(30.0 - 100 * total_super_cr / basic_da_cr, 2) AS\
    \ headroom_pct_points,\n    ROUND(total_super_cr, 1) AS employer_super_contribution_cr,\n    ROUND(0.30 * basic_da_cr,\
    \ 1) AS cap_amount_cr,\n    ROUND(0.30 * basic_da_cr - total_super_cr, 1) AS headroom_cr,\n    100 * total_super_cr /\
    \ basic_da_cr <= 30.0 AS within_cap\nFROM p\nORDER BY fiscal_year;"
  params:
    fiscal_year:
      type: STRING
      default: FY26
      description: Fiscal year in FYxx format
      allowed_values:
      - FY21
      - FY22
      - FY23
      - FY24
      - FY25
      - FY26
      - FY27
  visual_kind: table
  provenance:
    source_file: data_bank/answer_key/sql/P13.sql
    sha256: d406859c15e10a0efd44f6cdb330978de76c34c904693e2013fa9170309ee0c3
    gold_objects: hrfin_silver, hrfin_gold
- id: P14
  group: Policy + live data
  canonical_question: Our MoU rating sets the performance-related pay pool. What's the pay impact if we drop from "Excellent"
    to "Very Good"?
  intent_keywords:
  - mou
  - rating
  - sets
  - performance-related
  - pay
  - pool
  intent_description: Dropping from Excellent to Very Good would cut the executive PRP pool by 12.5%, about ₹39.5 cr, from
    ₹316.2 cr to ₹276.7 cr on FY26 payroll.
  parameterized_sql: "-- Answer Key SQL: P14\n-- Question: Our MoU rating sets the performance-related pay pool. What's the\
    \ pay impact if we drop from \"Excellent\" to \"Very Good\"?\n-- Type: policy_plus_data\n-- Semantic audit 2026-10-20:\
    \ Old SQL listed MoU parameter targets only (no PRP, no rating scenario). Now applies the DPE 3rd PRC\n-- Semantic audit\
    \ 2026-10-20: PRP formula (G-01 Part 13: MoU component = 50% of PRP; eligibility Excellent 100% / Very Good 75% /\n--\
    \ Semantic audit 2026-10-20: Good 50% / Fair 25%) to the FY26 executive (E1-E9) PRP outgo in payroll_monthly, holding\
    \ team (30%)\n-- Semantic audit 2026-10-20: and individual (20%) components constant. Assumption: FY26 executive PRP outgo\
    \ = the Excellent-basis pool.\n-- Semantic audit 2026-10-20: FY26 MoU composite score and FY27 projected composite are\
    \ attached for context.\nWITH prp AS (\n    SELECT SUM(p.prp_inr) / 1e7 AS exec_prp_cr\n    FROM payroll_monthly p\n \
    \   JOIN dim_grade g ON g.grade_id = p.grade_id\n    WHERE p.fiscal_year = @fiscal_year AND LOWER(g.cadre) = 'executive'\n\
    ),\nmou AS (\n    SELECT MAX(IF(fiscal_year = @fiscal_year, composite_score, NULL)) AS fy26_composite,\n           MAX(IF(fiscal_year\
    \ = 'FY27', projected_composite_score, NULL)) AS fy27_projected_composite\n    FROM mou_targets\n)\nSELECT\n    s.mou_rating,\n\
    \    s.mou_eligibility_pct,\n    0.5 * s.mou_eligibility_pct + 50 AS pool_factor_pct,\n    ROUND(prp.exec_prp_cr * (0.5\
    \ * s.mou_eligibility_pct + 50) / 100, 1) AS exec_prp_pool_cr,\n    ROUND(prp.exec_prp_cr * (0.5 * s.mou_eligibility_pct\
    \ + 50) / 100 - prp.exec_prp_cr, 1) AS change_vs_excellent_cr,\n    ROUND(0.5 * s.mou_eligibility_pct + 50 - 100, 1) AS\
    \ change_vs_excellent_pct,\n    mou.fy26_composite AS fy26_mou_composite_score,\n    mou.fy27_projected_composite AS fy27_projected_composite_score\n\
    FROM prp, mou, UNNEST([\n    STRUCT('Excellent' AS mou_rating, 100 AS mou_eligibility_pct),\n    STRUCT('Very Good', 75),\n\
    \    STRUCT('Good', 50),\n    STRUCT('Fair', 25)\n]) s\nORDER BY s.mou_eligibility_pct DESC;"
  params:
    fiscal_year:
      type: STRING
      default: FY26
      description: Fiscal year in FYxx format
      allowed_values:
      - FY21
      - FY22
      - FY23
      - FY24
      - FY25
      - FY26
      - FY27
  visual_kind: table
  provenance:
    source_file: data_bank/answer_key/sql/P14.sql
    sha256: 30521f13b14b1b316f65b5e1c9ace8ccb32517cec942edaf14f82e13c9e88237
    gold_objects: hrfin_silver, hrfin_gold
- id: P15
  group: Policy + live data
  canonical_question: Did we meet the 2% CSR obligation in FY26? Which states got the most?
  intent_keywords:
  - csr
  - meet
  - obligation
  - fy26
  - states
  - got
  intent_description: 'Yes: FY26 CSR spend of ₹949 cr was 109.9% of the Section 135 obligation of ₹863.5 cr (2% of average
    FY23–FY25 net profit of ₹43,176 cr).'
  parameterized_sql: "-- Answer Key SQL: P15\n-- Question: Did we meet the 2% CSR obligation in FY26? Which states got the\
    \ most?\n-- Type: policy_plus_data\n-- Semantic audit 2026-10-20: Old SQL ranked states only and never tested the 2% obligation.\
    \ Section 135 obligation for FY26 =\n-- Semantic audit 2026-10-20: 2% of average net profit (PBT proxy, corporate_financials.pbt_inr_cr)\
    \ of the three preceding FYs\n-- Semantic audit 2026-10-20: (FY23, FY24, FY25). Each state row carries FY26 total spend,\
    \ obligation and % of obligation.\n-- Semantic audit 2026-10-20: Removed the never-matching '2026' fiscal_year alternate.\n\
    WITH obligation AS (\n    SELECT 0.02 * AVG(pbt_inr_cr) AS obligation_cr, AVG(pbt_inr_cr) AS avg_pbt_3yr_cr\n    FROM\
    \ corporate_financials\n    WHERE fiscal_year IN ('FY23', 'FY24', 'FY25')\n),\nst AS (\n    SELECT c.state_code, g.state_name,\
    \ SUM(c.actual_disbursed_inr_cr) AS spend_cr, COUNT(*) AS projects\n    FROM csr_projects c\n    LEFT JOIN dim_geography\
    \ g ON g.state_code = c.state_code\n    WHERE c.fiscal_year = @fiscal_year\n    GROUP BY 1, 2\n)\nSELECT\n    st.state_name,\n\
    \    st.state_code,\n    st.projects,\n    ROUND(st.spend_cr, 2) AS csr_spend_cr,\n    ROUND(100 * st.spend_cr / SUM(st.spend_cr)\
    \ OVER (), 1) AS share_of_fy26_spend_pct,\n    ROUND(SUM(st.spend_cr) OVER (), 2) AS fy26_total_spend_cr,\n    ROUND(o.avg_pbt_3yr_cr,\
    \ 1) AS avg_net_profit_fy23_fy25_cr,\n    ROUND(o.obligation_cr, 1) AS obligation_2pct_cr,\n    ROUND(100 * SUM(st.spend_cr)\
    \ OVER () / o.obligation_cr, 1) AS spend_pct_of_obligation,\n    SUM(st.spend_cr) OVER () >= o.obligation_cr AS obligation_met\n\
    FROM st, obligation o\nORDER BY csr_spend_cr DESC, state_name;"
  params:
    fiscal_year:
      type: STRING
      default: FY26
      description: Fiscal year in FYxx format
      allowed_values:
      - FY21
      - FY22
      - FY23
      - FY24
      - FY25
      - FY26
      - FY27
  visual_kind: table
  provenance:
    source_file: data_bank/answer_key/sql/P15.sql
    sha256: 2d99647f1befef273668b87c9cb7470ba49cb0e9449a03f640daed0db2f2e4c0
    gold_objects: hrfin_silver, hrfin_gold
- id: P16
  group: Policy + live data
  canonical_question: Who has the authority to approve a ₹50 crore drilling contract under the delegated powers?
  intent_keywords:
  - has
  - authority
  - approve
  - crore
  - drilling
  - contract
  intent_description: 'A ₹50 crore drilling contract can be approved by the Functional Director concerned, with Director (Finance)
    concurrence (BDP Clause 3.3: dri'
  parameterized_sql: "-- Answer Key SQL: P16\n-- Question: Who has the authority to approve a ₹50 crore drilling contract\
    \ under the delegated powers?\n-- Type: policy_plus_data\n-- Semantic audit 2026-10-20: Old SQL listed the top-50 drilling\
    \ POs by value and never mapped them to an approval authority.\n-- Semantic audit 2026-10-20: Now maps the BDP 2015 delegation\
    \ ladder (Clauses 2.1, 3.3, 4.2, 6.1) onto drilling-category PO value\n-- Semantic audit 2026-10-20: (revised value of\
    \ drilling lines per PO, rupees -> crore), so the ₹50 cr case and actual usage are both visible.\n-- Semantic audit 2026-10-20:\
    \ Bands are upper-inclusive (\"up to ₹X Crore\"): a ₹50 cr drilling award falls in the Functional Director tier.\nWITH\
    \ po AS (\n    SELECT po_number, SUM(revised_po_value_inr) / 1e7 AS po_value_cr\n    FROM purchase_orders\n    WHERE LOWER(service_contract_category)\
    \ LIKE '%drilling%'\n    GROUP BY po_number\n),\ntiers AS (\n    SELECT * FROM UNNEST([\n        STRUCT(1 AS tier, 'Up\
    \ to ₹10 cr' AS value_band, 0.0 AS lo_cr, 10.0 AS hi_cr, 'Level 3: Asset/Basin Manager, ED heading work centre (open tender,\
    \ Associate Finance concurrence)' AS approving_authority, 'BDP Clause 2.1' AS bdp_clause),\n        STRUCT(2, '₹10-50\
    \ cr', 10.0, 50.0, 'Functional Director (drilling/well-service award) with Director (Finance) concurrence', 'BDP Clause\
    \ 3.3'),\n        STRUCT(3, '₹50-100 cr', 50.0, 100.0, 'Executive Committee (CMD + all Whole-Time Directors)', 'BDP Clause\
    \ 4.2'),\n        STRUCT(4, 'Above ₹100 cr', 100.0, 1e9, 'Board of Directors (EC appraisal first)', 'BDP Clause 6.1(a)')\n\
    \    ])\n)\nSELECT\n    t.tier,\n    t.value_band,\n    t.approving_authority,\n    t.bdp_clause,\n    COUNT(po.po_number)\
    \ AS drilling_pos,\n    ROUND(COALESCE(SUM(po.po_value_cr), 0), 1) AS drilling_po_value_cr,\n    ROUND(MAX(po.po_value_cr),\
    \ 2) AS largest_po_cr\nFROM tiers t\nLEFT JOIN po ON po.po_value_cr > t.lo_cr AND po.po_value_cr <= t.hi_cr\nGROUP BY\
    \ 1, 2, 3, 4\nORDER BY t.tier;"
  params: {}
  visual_kind: table
  provenance:
    source_file: data_bank/answer_key/sql/P16.sql
    sha256: e621d6fa862432636666b2fca6a1cc916169686fa30bef2408af495566e6a8fb
    gold_objects: hrfin_silver, hrfin_gold
- id: P17
  group: Policy + live data
  canonical_question: Does our dividend policy allow a higher payout this year, given the capex plan?
  intent_keywords:
  - capex
  - dividend
  - policy
  - allow
  - higher
  - payout
  intent_description: 'Yes, but only modestly: FY26 internal accruals after the dividend (₹41,422 cr) covered capex of ₹35,878
    cr with ₹5,544 cr to spare, which is'
  parameterized_sql: "-- Answer Key SQL: P17\n-- Question: Does our dividend policy allow a higher payout this year, given\
    \ the capex plan?\n-- Type: policy_plus_data\n-- Semantic audit 2026-10-20: Old SQL returned only FY26 PAT/dividend/DPS\
    \ and ignored the capex plan the question hinges on.\n-- Semantic audit 2026-10-20: Now FY26 (last full FY) payout vs\
    \ DIPAM floor (30% of PAT; 5%-of-net-worth leg not computable: no\n-- Semantic audit 2026-10-20: net worth in data), internal\
    \ accruals after dividend (PAT + DD&A - dividend) vs capex, and the\n-- Semantic audit 2026-10-20: max extra DPS = surplus\
    \ / implied share count (dividend / DPS); current-year capex run-rate: FY27 Apr-Sep actual vs FY26 Apr-Sep actual (equal\
    \ 6-month coverage, capex_budget).\nWITH h1 AS (\n    SELECT\n        SUM(IF(fiscal_year = 'FY27', actual_spend_inr_cr,\
    \ 0)) AS fy27_h1_capex_cr,\n        SUM(IF(fiscal_year = @fiscal_year AND month BETWEEN '2025-04' AND '2025-09', actual_spend_inr_cr,\
    \ 0)) AS fy26_h1_capex_cr,\n        SUM(IF(fiscal_year = 'FY27', budget_estimate_be_inr_cr, 0)) AS fy27_h1_capex_be_cr\n\
    \    FROM capex_budget\n    WHERE fiscal_year IN ('FY26', 'FY27')\n)\nSELECT\n    f.fiscal_year,\n    f.pat_inr_cr,\n\
    \    f.total_dividend_payout_inr_cr AS dividend_cr,\n    f.dividend_per_share_inr,\n    ROUND(100 * f.total_dividend_payout_inr_cr\
    \ / f.pat_inr_cr, 1) AS payout_pct_of_pat,\n    ROUND(0.30 * f.pat_inr_cr, 0) AS dipam_floor_30pct_pat_cr,\n    ROUND(f.total_dividend_payout_inr_cr\
    \ - 0.30 * f.pat_inr_cr, 0) AS paid_above_floor_cr,\n    f.dda_inr_cr,\n    f.total_capex_spent_inr_cr AS capex_cr,\n\
    \    ROUND(f.pat_inr_cr + f.dda_inr_cr - f.total_dividend_payout_inr_cr, 0) AS accruals_after_dividend_cr,\n    ROUND(f.pat_inr_cr\
    \ + f.dda_inr_cr - f.total_dividend_payout_inr_cr - f.total_capex_spent_inr_cr, 0) AS surplus_after_capex_cr,\n    ROUND((f.pat_inr_cr\
    \ + f.dda_inr_cr - f.total_dividend_payout_inr_cr - f.total_capex_spent_inr_cr)\n          / (f.total_dividend_payout_inr_cr\
    \ / f.dividend_per_share_inr), 2) AS max_extra_dps_from_surplus_inr,\n    ROUND(h1.fy26_h1_capex_cr, 0) AS fy26_apr_sep_capex_cr,\n\
    \    ROUND(h1.fy27_h1_capex_cr, 0) AS fy27_apr_sep_capex_cr,\n    ROUND(h1.fy27_h1_capex_be_cr, 0) AS fy27_apr_sep_capex_be_cr,\n\
    \    ROUND(100 * (h1.fy27_h1_capex_cr - h1.fy26_h1_capex_cr) / h1.fy26_h1_capex_cr, 1) AS capex_h1_change_pct\nFROM corporate_financials\
    \ f, h1\nWHERE f.fiscal_year = @fiscal_year;"
  params:
    fiscal_year:
      type: STRING
      default: FY26
      description: Fiscal year in FYxx format
      allowed_values:
