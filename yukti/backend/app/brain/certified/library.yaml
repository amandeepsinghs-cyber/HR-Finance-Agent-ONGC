    -- Semantic audit 2026-10-20: Old SQL listed all 36 FY27 programmes without checking eligibility or whether they are still\
    \ ahead of 2026-10-19.\n-- Semantic audit 2026-10-20: Now filters to the employee's grade and experience prerequisite\
    \ and flags still_open / discipline_listed.\n\nWITH me AS (\n    SELECT current_grade_id AS grade_id, discipline_id, total_tenure_years\n\
    \    FROM employee_master\n    WHERE emp_id = @self_emp_id\n)\nSELECT\n    t.programme_id,\n    t.programme_name,\n  \
