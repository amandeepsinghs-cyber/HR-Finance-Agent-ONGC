    \ r'(7\\.1 .*?) \\(7\\.1\\)')) AS quote_snippet\n  FROM c WHERE doc_id = 'R&P/Promotion' AND clause_ref = 'Clause 7.0'\n\
    )\nORDER BY seq;"
  params: {}
