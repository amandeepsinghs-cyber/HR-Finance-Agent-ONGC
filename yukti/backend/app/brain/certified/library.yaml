    gold_objects: hrfin_gold.v_field_pnl, hrfin_silver.field_pnl_annual
- id: H1
  group: Director (HR)
  canonical_question: List the executives with more than 3 years at their current station (rotation policy), by asset and
    grade.
  intent_keywords:
  - rotation
  - grade
  - executives
  - more
  - than
  - years
  intent_description: 11,594 of 13,453 active executives (86.2%) have been at their current station for more than 3 years
    as of 19-Oct-2026, spread over 46 work c
  parameterized_sql: "-- Answer Key SQL: H1\n-- Question: List the executives with more than 3 years at their current station\
    \ (rotation policy), by asset and grade.\n-- Type: data\n-- Semantic audit 2026-10-20: old SQL counted ALL current executives\
    \ per WC/grade (no tenure test, LIMIT 20). Now: active executives\n-- (cadre='executive') whose continuous stay at the\
    \ current work centre began more than 3 years before 2026-10-19\n-- (posting islands, so in-place promotions do not reset\
    \ station tenure); all WC x grade rows, no LIMIT.\nWITH numbered_postings AS (\n    SELECT\n        p.emp_id, p.wc_id,\
    \ p.from_date, p.is_current_posting, p.grade_id,\n        -- exemption columns hold the literal string 'None' when no\
    \ exemption exists\n        IF(LOWER(IFNULL(p.exemption_tag, 'none')) IN ('none', ''), NULL, p.exemption_tag) AS exemption_tag,\n\
    \        IF(LOWER(IFNULL(p.exemption_reason_code, 'none')) IN ('none', ''), NULL, p.exemption_reason_code) AS exemption_reason_code,\n\
    \        ROW_NUMBER() OVER (PARTITION BY p.emp_id ORDER BY p.from_date, p.posting_id) -\n        ROW_NUMBER() OVER (PARTITION\
    \ BY p.emp_id, p.wc_id ORDER BY p.from_date, p.posting_id) AS island_id\n    FROM posting_history p\n),\ncurrent_station\
    \ AS (\n    -- continuous stay at the current work centre (in-place promotions do not reset station tenure)\n    SELECT\n\
    \        emp_id, wc_id,\n        MIN(from_date) AS station_from_date,\n        MAX(IF(is_current_posting, grade_id, NULL))\
    \ AS grade_id,\n        MAX(IF(is_current_posting, exemption_tag, NULL)) AS exemption_tag,\n        MAX(IF(is_current_posting,\
    \ exemption_reason_code, NULL)) AS exemption_reason_code\n    FROM numbered_postings\n    GROUP BY emp_id, wc_id, island_id\n\
    \    HAVING LOGICAL_OR(is_current_posting)\n),\nactive_execs AS (\n    SELECT cs.*, e.age_years, e.discipline_id,\n  \
    \         DATE_DIFF(DATE '2026-10-19', cs.station_from_date, MONTH) AS station_tenure_months,\n           cs.station_from_date\
    \ < DATE_SUB(DATE '2026-10-19', INTERVAL 3 YEAR) AS over_3_years\n    FROM current_station cs\n    JOIN dim_grade g ON\
    \ g.grade_id = cs.grade_id\n    JOIN employee_master e ON e.emp_id = cs.emp_id\n    WHERE LOWER(g.cadre) = 'executive'\n\
    \      AND LOWER(e.employment_status) = 'active'\n)\nSELECT\n    wc.short_name AS work_centre,\n    wc.hard_station_cat,\n\
    \    ae.grade_id,\n    COUNT(*) AS executives_over_3y,\n    ROUND(AVG(ae.station_tenure_months) / 12, 1) AS avg_station_years,\n\
    \    COUNTIF(ae.exemption_tag IS NOT NULL) AS with_recorded_exemption,\n    SUM(COUNT(*)) OVER (PARTITION BY wc.short_name)\
    \ AS work_centre_total_over_3y,\n    SUM(COUNT(*)) OVER () AS company_total_over_3y,\n    (SELECT COUNT(*) FROM active_execs)\
    \ AS company_active_executives\nFROM active_execs ae\nJOIN dim_work_centre wc ON wc.wc_id = ae.wc_id\nWHERE ae.over_3_years\n\
    GROUP BY wc.short_name, wc.hard_station_cat, ae.grade_id\nORDER BY work_centre_total_over_3y DESC, wc.short_name, executives_over_3y\
    \ DESC;"
  params: {}
  visual_kind: table
  provenance:
    source_file: data_bank/answer_key/sql/H1.sql
    sha256: 18f8f27038a4bde7a9b2429930a78b5062b153a6338ee9591777ec5485045a20
    gold_objects: hrfin_silver, hrfin_gold
- id: H2
  group: Director (HR)
  canonical_question: Which employees have never served in a hard or remote station?
  intent_keywords:
  - employees
  - never
  - served
  - hard
  - remote
  - station
  intent_description: 4,949 of 22,798 active employees (21.7%) have never served in a Category C (hard/remote) station, of
    whom 842 are executives (6.3% of active
  parameterized_sql: "-- Answer Key SQL: H2\n-- Question: Which employees have never served in a hard or remote station?\n\
    -- Type: data\n-- Semantic audit 2026-10-20: old SQL counted executives CURRENTLY posted in 4 NE work centres (the opposite\
    \ population).\n-- Now: active employees with no posting ever in a Category C (hard/remote) work centre, by grade, with\
    \ share of grade.\nWITH ever_hard AS (\n    -- 'hard or remote station' = Category C work centre (JRTP 2.0/6.1: NE, offshore,\
    \ Bokaro CBM, Rajasthan)\n    SELECT p.emp_id, LOGICAL_OR(LOWER(w.hard_station_cat) = 'c') AS served_cat_c\n    FROM posting_history\
    \ p\n    JOIN dim_work_centre w ON w.wc_id = p.wc_id\n    GROUP BY p.emp_id\n),\nactive AS (\n    SELECT e.*, g.cadre,\
    \ g.level_order, g.typical_residency_years,\n           NOT IFNULL(h.served_cat_c, FALSE) AS never_hard\n    FROM employee_master\
    \ e\n    JOIN dim_grade g ON g.grade_id = e.current_grade_id\n    LEFT JOIN ever_hard h ON h.emp_id = e.emp_id\n    WHERE\
    \ LOWER(e.employment_status) = 'active'\n)\nSELECT\n    cadre,\n    current_grade_id AS grade_id,\n    COUNTIF(never_hard)\
    \ AS never_served_hard_station,\n    COUNT(*) AS active_employees,\n    ROUND(COUNTIF(never_hard) * 100.0 / COUNT(*),\
    \ 1) AS pct_of_grade,\n    SUM(COUNTIF(never_hard)) OVER () AS company_never_hard,\n    SUM(COUNT(*)) OVER () AS company_active,\n\
    \    SUM(COUNTIF(never_hard AND LOWER(cadre) = 'executive')) OVER () AS executives_never_hard\nFROM active\nGROUP BY cadre,\
    \ current_grade_id, level_order\nORDER BY level_order;"
  params: {}
  visual_kind: table
  provenance:
    source_file: data_bank/answer_key/sql/H2.sql
    sha256: e7b40a4cd0351b79f87d225d20032ab37f38dc3f0e4529dfe807e3c9f38e07f7
    gold_objects: hrfin_silver, hrfin_gold
- id: H3
  group: Director (HR)
  canonical_question: What is the vacancy position (sanctioned vs. in-position) by asset and discipline?
  intent_keywords:
  - discipline
  - vacancy
  - position
  - sanctioned
  - in-position
  - asset
  intent_description: 'FY26 vacancy position: 25,149 sanctioned posts against 23,117 in position, leaving 2,032 vacancies
    (8.1%).'
  parameterized_sql: "-- Answer Key SQL: H3\n-- Question: What is the vacancy position (sanctioned vs. in-position) by asset\
    \ and discipline?\n-- Type: data\n-- Semantic audit 2026-10-20: old SQL averaged row-level vacancy_rate_pct (unweighted\
    \ mean of tiny category cells) and\n-- truncated at LIMIT 100 ordered alphabetically (591 WC x discipline cells exist),\
    \ and omitted sanctioned/in-position.\n-- Now: FY26 sanctioned, in-position, vacancies and weighted vacancy rate per work\
    \ centre x discipline, all cells, largest gaps first.\nSELECT\n    wc.short_name AS work_centre,\n    d.name AS discipline,\n\
    \    SUM(sp.sanctioned_strength) AS sanctioned,\n    SUM(sp.in_position_strength) AS in_position,\n    SUM(sp.vacancy_count)\
    \ AS vacancies,\n    ROUND(SUM(sp.vacancy_count) * 100.0 / NULLIF(SUM(sp.sanctioned_strength), 0), 1) AS vacancy_rate_pct,\n\
    \    SUM(SUM(sp.sanctioned_strength)) OVER () AS company_sanctioned,\n    SUM(SUM(sp.vacancy_count)) OVER () AS company_vacancies\n\
    FROM sanctioned_posts sp\nJOIN dim_work_centre wc ON sp.wc_id = wc.wc_id\nJOIN dim_discipline d ON sp.discipline_id =\
    \ d.discipline_id\nWHERE sp.fiscal_year = @fiscal_year\nGROUP BY wc.short_name, d.name\nORDER BY vacancies DESC, vacancy_rate_pct\
    \ DESC, work_centre, discipline;"
  params:
    fiscal_year:
      type: STRING
      default: FY26
      description: Fiscal year in FYxx format
      allowed_values:
      - FY21
      - FY22
      - FY23
      - FY24
      - FY25
      - FY26
      - FY27
  visual_kind: table
  provenance:
    source_file: data_bank/answer_key/sql/H3.sql
    sha256: 825fd7267b8263753c78d126bf199c56bd43dd8089d8bbe8b710ac9784e541ee
    gold_objects: hrfin_silver, hrfin_gold
- id: H4
  group: Director (HR)
  canonical_question: What are attrition and voluntary-exit numbers by grade over the last 3 years? Is mid-career attrition
    (E3–E5) rising?
  intent_keywords:
  - grade
  - attrition
  - voluntary-exit
  - numbers
  - years
  - mid-career
  intent_description: 'Yes — mid-career (E3–E5) voluntary attrition is rising sharply: 36 exits in FY24 (0.39% of opening
    headcount), 4 in FY25 (0.05%) and 135 in '
  parameterized_sql: "-- Answer Key SQL: H4\n-- Question: What are attrition and voluntary-exit numbers by grade over the\
    \ last 3 years? Is mid-career attrition (E3–E5) rising?\n-- Type: data\n-- Semantic audit 2026-10-20: old SQL counted\
    \ only resignations (no total attrition, no VRS, no rates), so 'rising' could not be\n-- judged against a shrinking base.\
    \ Now: per grade, FY24-FY26 (last 3 full FYs) total separations, voluntary exits\n-- (resignation + VRS) and voluntary-exit\
    \ rate on opening headcount (headcount_snapshot March of the prior FY, a stock).\nWITH seps AS (\n    SELECT last_grade_id\
    \ AS grade_id, fiscal_year,\n           COUNT(*) AS total_exits,\n           COUNTIF(LOWER(separation_type) IN ('resignation',\
    \ 'vrs')) AS voluntary_exits\n    FROM separations\n    WHERE fiscal_year IN ('FY24', 'FY25', 'FY26')\n    GROUP BY 1,\
    \ 2\n),\nopening AS (\n    SELECT grade_id,\n           CASE month WHEN '2023-03' THEN 'FY24' WHEN '2024-03' THEN 'FY25'\
    \ WHEN '2025-03' THEN 'FY26' END AS fiscal_year,\n           SUM(headcount) AS opening_hc\n    FROM headcount_snapshot\n\
    \    WHERE month IN ('2023-03', '2024-03', '2025-03')\n    GROUP BY 1, 2\n),\ngrid AS (\n    SELECT o.grade_id, o.fiscal_year,\
    \ o.opening_hc, IFNULL(s.total_exits, 0) AS total_exits, IFNULL(s.voluntary_exits, 0) AS voluntary_exits\n    FROM opening\
    \ o LEFT JOIN seps s ON s.grade_id = o.grade_id AND s.fiscal_year = o.fiscal_year\n)\nSELECT\n    g.grade_id,\n    g.grade_id\
    \ IN ('E3', 'E4', 'E5') AS is_mid_career,\n    SUM(IF(fiscal_year = 'FY24', total_exits, 0)) AS total_exits_fy24,\n  \
    \  SUM(IF(fiscal_year = 'FY25', total_exits, 0)) AS total_exits_fy25,\n    SUM(IF(fiscal_year = @fiscal_year, total_exits,\
    \ 0)) AS total_exits_fy26,\n    SUM(IF(fiscal_year = 'FY24', voluntary_exits, 0)) AS voluntary_fy24,\n    SUM(IF(fiscal_year\
    \ = 'FY25', voluntary_exits, 0)) AS voluntary_fy25,\n    SUM(IF(fiscal_year = @fiscal_year, voluntary_exits, 0)) AS voluntary_fy26,\n\
    \    SUM(IF(fiscal_year = 'FY24', opening_hc, 0)) AS opening_hc_fy24,\n    SUM(IF(fiscal_year = 'FY25', opening_hc, 0))\
    \ AS opening_hc_fy25,\n    SUM(IF(fiscal_year = @fiscal_year, opening_hc, 0)) AS opening_hc_fy26,\n    ROUND(SUM(IF(fiscal_year\
    \ = 'FY24', voluntary_exits, 0)) * 100.0 / NULLIF(SUM(IF(fiscal_year = 'FY24', opening_hc, 0)), 0), 2) AS voluntary_rate_fy24_pct,\n\
    \    ROUND(SUM(IF(fiscal_year = 'FY25', voluntary_exits, 0)) * 100.0 / NULLIF(SUM(IF(fiscal_year = 'FY25', opening_hc,\
    \ 0)), 0), 2) AS voluntary_rate_fy25_pct,\n    ROUND(SUM(IF(fiscal_year = @fiscal_year, voluntary_exits, 0)) * 100.0 /\
    \ NULLIF(SUM(IF(fiscal_year = @fiscal_year, opening_hc, 0)), 0), 2) AS voluntary_rate_fy26_pct\nFROM grid\nJOIN dim_grade\
    \ g ON g.grade_id = grid.grade_id\nGROUP BY g.grade_id, g.level_order\nORDER BY g.level_order;"
  params:
    fiscal_year:
      type: STRING
      default: FY26
      description: Fiscal year in FYxx format
      allowed_values:
      - FY21
      - FY22
      - FY23
      - FY24
      - FY25
      - FY26
      - FY27
  visual_kind: table
  provenance:
    source_file: data_bank/answer_key/sql/H4.sql
    sha256: b4e3f26c7184e9e03bc9e5037cabf16f9e55879184a23d74863753fb6b862cc8
    gold_objects: hrfin_silver, hrfin_gold
- id: H5
  group: Director (HR)
  canonical_question: How many DPC (promotion) cases are pending, and for how long?
  intent_keywords:
  - promotion
  - dpc
  - cases
  - pending
  - long
  - director
  intent_description: '228 executives are awaiting DPCs that have not been held: 128 for E4→E5 and 100 for E5→E6, the earliest
    due on 2025-06-30.'
  parameterized_sql: "-- Answer Key SQL: H5\n-- Question: How many DPC (promotion) cases are pending, and for how long?\n\
    -- Type: data\n-- Semantic audit 2026-10-20: old SQL used delay_months >= 6 as the 'pending' test and gave no duration.\
    \ Now: pending = status\n-- 'delayed' (DPC not held; same 228 cases), by promotion step, with recorded delay_months (stale\
    \ extract value) AND months\n-- overdue since due_date as of 2026-10-19.\nSELECT\n    from_grade_id,\n    to_grade_id,\n\
    \    COUNT(DISTINCT emp_id) AS pending_candidates,\n    MIN(due_date) AS earliest_due_date,\n    ROUND(AVG(delay_months),\
    \ 1) AS avg_recorded_delay_months,\n    MAX(delay_months) AS max_recorded_delay_months,\n    ROUND(AVG(DATE_DIFF(DATE\
    \ '2026-10-19', due_date, MONTH)), 1) AS avg_months_overdue_asof_2026_10_19,\n    MAX(DATE_DIFF(DATE '2026-10-19', due_date,\
    \ MONTH)) AS max_months_overdue_asof_2026_10_19,\n    SUM(COUNT(DISTINCT emp_id)) OVER () AS total_pending\nFROM dpc_cases\n\
    WHERE LOWER(status) = 'delayed' AND held_date IS NULL\nGROUP BY from_grade_id, to_grade_id\nORDER BY from_grade_id;"
  params: {}
  visual_kind: table
  provenance:
    source_file: data_bank/answer_key/sql/H5.sql
    sha256: f8e6b4cb56d157a4642adc54c74cda3c28a9def2054ea09df2d01b84854a6220
    gold_objects: hrfin_silver, hrfin_gold
- id: H6
  group: Director (HR)
  canonical_question: Are we compliant with reservation norms (SC/ST/OBC/EWS/PwD) by grade?
  intent_keywords:
  - grade
  - compliant
  - reservation
  - norms
  - obc
  - ews
  intent_description: 'Not fully: representation falls short of the statutory norm in 37 of 59 grade-category cells across
    12 grades, driven by EWS (below 10% in 1'
  parameterized_sql: "-- Answer Key SQL: H6\n-- Question: Are we compliant with reservation norms (SC/ST/OBC/EWS/PwD) by grade?\n\
    -- Type: data\n-- Semantic audit 2026-10-20: old SQL LEFT JOINed employee_master on discipline_id (fan-out weighting every\
    \ cell by the\n-- discipline's headcount) and reported fill rate (in-position/sanctioned) instead of representation vs\
    \ norm; PwD absent.\n-- Now: FY26 in-position representation of SC/ST/OBC/EWS/PwD as % of the grade's in-position strength\
    \ vs statutory norm,\n-- with backlog reserved vacancies, by grade (board posts excluded).\nWITH posts AS (\n    SELECT\
    \ sp.*,\n           IF(LOWER(IFNULL(sp.pwd_category, 'none')) IN ('none', ''), FALSE, TRUE) AS is_pwd\n    FROM sanctioned_posts\
    \ sp\n    WHERE sp.fiscal_year = @fiscal_year\n),\nby_cat AS (\n    SELECT grade_id, social_category AS category, SUM(sanctioned_strength)\
    \ AS sanctioned, SUM(in_position_strength) AS in_position,\n           SUM(vacancy_count) AS vacancies, SUM(backlog_vacancies)\
    \ AS backlog_vacancies\n    FROM posts WHERE LOWER(social_category) IN ('sc', 'st', 'obc', 'ews')\n    GROUP BY 1, 2\n\
    \    UNION ALL\n    SELECT grade_id, 'PwD', SUM(sanctioned_strength), SUM(in_position_strength), SUM(vacancy_count), SUM(backlog_vacancies)\n\
    \    FROM posts WHERE is_pwd\n    GROUP BY 1\n),\ngrade_tot AS (\n    SELECT grade_id, SUM(in_position_strength) AS grade_in_position,\
    \ SUM(sanctioned_strength) AS grade_sanctioned\n    FROM posts GROUP BY 1\n),\nnorms AS (\n    -- statutory reservation\
    \ norms (DoPT / Presidential directives): SC 15%, ST 7.5%, OBC 27%, EWS 10%, PwD 4%\n    SELECT 'SC' AS category, 15.0\
    \ AS norm_pct UNION ALL SELECT 'ST', 7.5 UNION ALL SELECT 'OBC', 27.0\n    UNION ALL SELECT 'EWS', 10.0 UNION ALL SELECT\
    \ 'PwD', 4.0\n)\nSELECT\n    c.grade_id,\n    c.category,\n    c.in_position,\n    t.grade_in_position,\n    ROUND(c.in_position\
    \ * 100.0 / t.grade_in_position, 1) AS representation_pct,\n    n.norm_pct,\n    ROUND(c.in_position * 100.0 / t.grade_in_position\
    \ - n.norm_pct, 1) AS gap_vs_norm_pp,\n    c.backlog_vacancies,\n    c.in_position * 100.0 / t.grade_in_position >= n.norm_pct\
    \ AS meets_norm\nFROM by_cat c\nJOIN grade_tot t ON t.grade_id = c.grade_id\nJOIN norms n ON n.category = c.category\n\
    JOIN dim_grade g ON g.grade_id = c.grade_id\nWHERE LOWER(g.cadre) <> 'board'\nORDER BY g.level_order, n.norm_pct DESC,\
    \ c.category;"
  params:
    fiscal_year:
      type: STRING
      default: FY26
      description: Fiscal year in FYxx format
      allowed_values:
      - FY21
      - FY22
      - FY23
      - FY24
      - FY25
      - FY26
      - FY27
  visual_kind: table
  provenance:
