  - leave
  - balance
  - el
  - cl
  - hpl
  parameterized_sql: "WITH latest AS (\n  SELECT emp_id, fiscal_year, leave_type, closing_balance_days, encashable_balance_days\n\
    \  FROM leave_ledger\n  WHERE emp_id = @self_emp_id\n  QUALIFY ROW_NUMBER() OVER (PARTITION BY leave_type ORDER BY fiscal_year\
    \ DESC, to_date DESC) = 1\n)\nSELECT emp_id, fiscal_year, leave_type, closing_balance_days,\n  encashable_balance_days\
    \ AS encashable_days_per_ledger,\n  IF(LOWER(leave_type) IN ('el', 'earned_leave_el'), LEAST(30, GREATEST(closing_balance_days\
    \ - 30, 0)), NULL) AS in_service_encashable_per_rule_4_3\nFROM latest\nORDER BY leave_type;"
