- id: W4
  group: What-if
  canonical_question: If the windfall tax is removed, how much does net realisation per barrel improve?
  intent_keywords:
  - windfall
  - tax
  - removed
  - net
  - realisation
  - barrel
  intent_description: 'Removing the windfall tax lifts net realisation by the full SAED per barrel: $4.00/bbl at the last
    levied rate (Nov-2024) and $4.91/bbl on a'
  parameterized_sql: "-- Answer Key SQL: W4\n-- Question: If the windfall tax is removed, how much does net realisation per\
    \ barrel improve?\n-- Type: what_if\n-- Semantic audit 2026-10-20: Old SQL averaged SAED over all 12 months of each FY\
    \ (incl. months with no levy), diluting the per-barrel uplift (FY23 12.15 vs 16.20 $/bbl when levied; FY25 3.27 vs 4.91).\n\
    -- Semantic audit 2026-10-20: Now: per FY, months levied, average SAED $/bbl and Rs/bbl in levied months, last levied\
    \ rate, FY-average, Brent, realisation and SAED paid (corporate_financials).\n\nSELECT\n    p.fiscal_year,\n    COUNTIF(p.windfall_tax_saed_usd_bbl\
    \ > 0) AS months_saed_levied,\n    ROUND(AVG(IF(p.windfall_tax_saed_usd_bbl > 0, p.windfall_tax_saed_usd_bbl, NULL)),\
    \ 2) AS avg_saed_usd_bbl_when_levied,\n    ROUND(AVG(IF(p.windfall_tax_saed_usd_bbl > 0, p.windfall_tax_saed_inr_bbl,\
    \ NULL)), 2) AS avg_saed_inr_bbl_when_levied,\n    ARRAY_AGG(IF(p.windfall_tax_saed_usd_bbl > 0, p.windfall_tax_saed_usd_bbl,\
    \ NULL) IGNORE NULLS ORDER BY p.month DESC LIMIT 1)[SAFE_OFFSET(0)] AS last_levied_saed_usd_bbl,\n    ROUND(AVG(p.windfall_tax_saed_usd_bbl),\
    \ 2) AS fy_avg_saed_usd_bbl,\n    ROUND(AVG(p.brent_usd_bbl), 2) AS avg_brent_usd_bbl,\n    ROUND(AVG(p.ongc_crude_net_realisation_usd_bbl),\
    \ 2) AS avg_net_realisation_usd_bbl,\n    ROUND(AVG(p.inr_usd_fx_rate), 2) AS avg_fx_rate,\n    ANY_VALUE(c.saed_windfall_tax_inr_cr)\
    \ AS saed_paid_inr_cr\nFROM price_fx_monthly p\nLEFT JOIN corporate_financials c ON c.fiscal_year = p.fiscal_year\nWHERE\
    \ p.fiscal_year IN ('FY23', 'FY24', 'FY25', @fiscal_year)\nGROUP BY p.fiscal_year\nORDER BY p.fiscal_year;"
  params:
    fiscal_year:
      type: STRING
      default: FY26
      description: Fiscal year in FYxx format
      allowed_values:
      - FY21
      - FY22
      - FY23
      - FY24
      - FY25
      - FY26
      - FY27
