  intent_description: In the 7 days to 19-Oct-2026, 15 users were denied access to confidential data (15 blocked attempts)
    and 2 authorised users accessed it (HR_
  parameterized_sql: "-- Answer Key SQL: M5\n-- Question: CMD: \"Who tried to access confidential data this week?\"\n-- Type:\
    \ data\n-- Semantic audit 2026-10-20: Old SQL had no date window (all 91 days of log) despite 'this week'.\n-- Semantic\
    \ audit 2026-10-20: Now: confidential-resource access attempts in the 7 days to 19-Oct-2026 (13-19 Oct), per user, with\
    \ denied/allowed split.\n\nSELECT\n    a.user_id,\n    a.user_role,\n    a.user_department,\n    a.user_grade,\n    a.user_wc_id,\n\
    \    a.resource_data_classification,\n    a.requested_resource,\n    COUNT(*) AS attempts,\n    COUNTIF(LOWER(a.access_decision)\
    \ LIKE 'denied%') AS denied_attempts,\n    COUNTIF(LOWER(a.access_decision) = 'allowed') AS allowed_attempts,\n    MAX(a.date)\
    \ AS last_attempt_date\nFROM access_audit_log a\nWHERE a.date BETWEEN DATE_SUB(DATE '2026-10-19', INTERVAL 6 DAY) AND\
    \ DATE '2026-10-19'\n  AND LOWER(a.resource_data_classification) LIKE 'confidential%'\nGROUP BY a.user_id, a.user_role,\
    \ a.user_department, a.user_grade, a.user_wc_id, a.resource_data_classification, a.requested_resource\nORDER BY denied_attempts\
    \ DESC, last_attempt_date DESC, a.user_id;"
