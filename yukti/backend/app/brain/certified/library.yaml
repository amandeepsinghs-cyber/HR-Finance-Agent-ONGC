  parameterized_sql: "-- Answer Key SQL: T3\n-- Question: \"Which GMs retire in 2027?\" → \"Who is ready to succeed each?\"\
    \ → \"Which successors haven't served in the North East?\"\n-- Type: chain\n-- Semantic audit 2026-10-20: Old SQL was\
    \ not restricted to GMs (included the CMD and a CGM), used a 19-Oct-2026..Dec-2027 window, and only saw GMs who already\
    \ have a succession_plan row (4 of 12).\n-- Semantic audit 2026-10-20: Now: every active GM (E7) retiring in calendar\
    \ 2027 from employee_master, LEFT JOINed to succession_plan (successor, readiness, NE flag, no-plan flag).\n\nSELECT\n\
    \    e.emp_id AS gm_emp_id,\n    e.current_designation,\n    e.current_wc_id,\n    e.discipline_id,\n    e.retirement_date,\n\
    \    sp.position_id,\n    sp.criticality_tier,\n    sp.successor_1_emp_id,\n    sp.successor_1_readiness,\n    sp.successor_1_has_ne_hard_station,\n\
    \    sp.position_id IS NULL AS no_succession_plan\nFROM employee_master e\nLEFT JOIN succession_plan sp ON sp.incumbent_emp_id\
    \ = e.emp_id\nWHERE LOWER(e.employment_status) = 'active'\n  AND e.current_grade_id = 'E7'\n  AND e.retirement_date BETWEEN\
    \ DATE '2027-01-01' AND DATE '2027-12-31'\nORDER BY e.retirement_date, e.emp_id;"
