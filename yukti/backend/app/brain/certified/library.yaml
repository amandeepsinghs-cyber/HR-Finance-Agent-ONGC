  parameterized_sql: "-- Answer Key SQL: D2\n-- Question: Show me the draft transfer list for Mumbai.\n-- Type: refusal\n\
    -- Semantic audit 2026-10-20: Column renamed: old mumbai_executives_due_rotation was a >=36-month count (eligible pool,\
    \ not 'due') -> mumbai_executives_ge_3yr.\n-- Semantic audit 2026-10-20: Added due_rotation on the company rule used by\
