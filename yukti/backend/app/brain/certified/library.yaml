- id: H7
  group: Director (HR)
  canonical_question: What is women's representation by grade and asset, and what has it been for offshore postings?
  intent_keywords:
  - grade
  - women
  - representation
  - asset
  - has
  - offshore
  intent_description: Women are 8.1% of active employees (1,848 of 22,798), but only 1.5% offshore (92 of 6,279).
  parameterized_sql: "-- Answer Key SQL: H7\n-- Question: What is women's representation by grade and asset, and what has\
    \ it been for offshore postings?\n-- Type: data\n-- Semantic audit 2026-10-20: old SQL listed raw counts of women executives\
    \ for the top-20 grade x WC cells (no share, no\n-- denominator, nothing on offshore). Now: women's representation (%\
    \ of active employees) by grade, by work location class,\n-- by asset (type='asset'), and the offshore trend from March\
    \ headcount snapshots (2021-03 ... 2026-03, latest 2026-09).\nWITH act AS (\n    SELECT e.emp_id, e.gender, e.current_grade_id,\
    \ w.short_name, w.type, w.onshore_offshore, g.level_order\n    FROM employee_master e\n    JOIN dim_work_centre w ON w.wc_id\
    \ = e.current_wc_id\n    JOIN dim_grade g ON g.grade_id = e.current_grade_id\n    WHERE LOWER(e.employment_status) = 'active'\n\
    ),\noffshore_trend AS (\n    SELECT h.month, SUM(IF(LOWER(h.gender) = 'female', h.headcount, 0)) AS women, SUM(h.headcount)\
    \ AS total\n    FROM headcount_snapshot h\n    JOIN dim_work_centre w ON w.wc_id = h.wc_id\n    WHERE LOWER(w.onshore_offshore)\
    \ = 'offshore'\n      AND h.month IN ('2021-03', '2022-03', '2023-03', '2024-03', '2025-03', '2026-03', '2026-09')\n \
    \   GROUP BY h.month\n)\nSELECT '1. Company' AS dimension, 'All active employees' AS label, 0 AS sort_key,\n       COUNTIF(LOWER(gender)\
    \ = 'female') AS women, COUNT(*) AS total,\n       ROUND(COUNTIF(LOWER(gender) = 'female') * 100.0 / COUNT(*), 1) AS women_pct\n\
    FROM act\nUNION ALL\nSELECT '2. Grade', current_grade_id, MIN(level_order),\n       COUNTIF(LOWER(gender) = 'female'),\
    \ COUNT(*), ROUND(COUNTIF(LOWER(gender) = 'female') * 100.0 / COUNT(*), 1)\nFROM act GROUP BY current_grade_id\nUNION\
    \ ALL\nSELECT '3. Location class', onshore_offshore, 0,\n       COUNTIF(LOWER(gender) = 'female'), COUNT(*), ROUND(COUNTIF(LOWER(gender)\
    \ = 'female') * 100.0 / COUNT(*), 1)\nFROM act GROUP BY onshore_offshore\nUNION ALL\nSELECT '4. Offshore trend (headcount\
    \ snapshot)', month, 0, women, total, ROUND(women * 100.0 / total, 1)\nFROM offshore_trend\nUNION ALL\nSELECT '5. Asset',\
    \ short_name, 0,\n       COUNTIF(LOWER(gender) = 'female'), COUNT(*), ROUND(COUNTIF(LOWER(gender) = 'female') * 100.0\
    \ / COUNT(*), 1)\nFROM act WHERE LOWER(type) = 'asset' GROUP BY short_name\nORDER BY dimension, sort_key, label;"
  params: {}
  visual_kind: table
  provenance:
    source_file: data_bank/answer_key/sql/H7.sql
    sha256: 346afba28a3d4381eb72752363e5860192cb1aab507bb4557d889319f24253a0
    gold_objects: hrfin_silver, hrfin_gold
- id: H8
  group: Director (HR)
  canonical_question: What were training hours per executive last year, and which disciplines are below target?
  intent_keywords:
  - discipline
  - were
  - training
  - hours
  - executive
  - year
  intent_description: 'In FY26 executives received 14.3 training hours each on average (1,97,900 hours across 13,878 executives
    on rolls); 8 of 16 disciplines are '
  parameterized_sql: "-- Answer Key SQL: H8\n-- Question: What were training hours per executive last year, and which disciplines\
    \ are below target?\n-- Type: data\n-- Semantic audit 2026-10-20: old SQL averaged hours per training RECORD for all employees\
    \ (incl. non-executives) and defined\n-- no target. Now: FY26 (last full FY) training hours per executive on rolls at\
    \ 31-Mar-2026 (untrained executives count as 0),\n-- per trained executive (MET-HR-037) and a below-company-average flag.\
    \ No discipline-level training target exists in the\n-- data (GAP), so the company executive average is the benchmark.\n\
    WITH execs AS (\n    -- executives on rolls at FY26 end (31-Mar-2026): active today or separated after FY26\n    SELECT\
    \ e.emp_id, e.discipline_id, e.current_wc_id\n    FROM employee_master e\n    JOIN dim_grade g ON g.grade_id = e.current_grade_id\n\
    \    WHERE LOWER(g.cadre) = 'executive'\n      AND (LOWER(e.employment_status) = 'active' OR e.separation_date > DATE\
    \ '2026-03-31')\n),\ntr AS (\n    SELECT emp_id, SUM(training_hours) AS hours\n    FROM training_records\n    WHERE fiscal_year\
    \ = @fiscal_year\n    GROUP BY emp_id\n),\nbase AS (\n    SELECT x.*, IFNULL(t.hours, 0) AS hours, t.emp_id IS NOT NULL\
    \ AS trained\n    FROM execs x LEFT JOIN tr t ON t.emp_id = x.emp_id\n)\nSELECT\n    d.name AS discipline,\n    COUNT(*)\
    \ AS executives,\n    COUNTIF(b.trained) AS trained_executives,\n    ROUND(SUM(b.hours), 1) AS total_hours,\n    ROUND(SUM(b.hours)\
    \ / COUNT(*), 1) AS hours_per_executive,\n    ROUND(SUM(b.hours) / NULLIF(COUNTIF(b.trained), 0), 1) AS hours_per_trained_executive,\n\
    \    ROUND(SUM(SUM(b.hours)) OVER () / SUM(COUNT(*)) OVER (), 1) AS company_hours_per_executive,\n    SUM(b.hours) / COUNT(*)\
    \ < SUM(SUM(b.hours)) OVER () / SUM(COUNT(*)) OVER () AS below_company_average\nFROM base b\nJOIN dim_discipline d ON\
    \ d.discipline_id = b.discipline_id\nGROUP BY d.name\nORDER BY hours_per_executive;"
  params:
    fiscal_year:
      type: STRING
      default: FY26
      description: Fiscal year in FYxx format
      allowed_values:
      - FY21
      - FY22
      - FY23
      - FY24
      - FY25
      - FY26
      - FY27
  visual_kind: table
  provenance:
    source_file: data_bank/answer_key/sql/H8.sql
    sha256: a976f78c3ceeeddc0a1f180099f4b24a5594904e7e547fa2edc5d704e1471de9
    gold_objects: hrfin_silver, hrfin_gold
- id: H9
  group: Director (HR)
  canonical_question: How many grievances and service litigations are pending, and how old are they?
  intent_keywords:
  - grievances
  - service
  - litigations
  - pending
  - old
  - they
  intent_description: '208 grievances and service cases are open (pending or stayed): 190 litigations and 18 internal grievances;
    70 are more than 3 years old.'
  parameterized_sql: "-- Answer Key SQL: H9\n-- Question: How many grievances and service litigations are pending, and how\
    \ old are they?\n-- Type: data\n-- Semantic audit 2026-10-20: old SQL counted only status 'pending' (68 'stayed' cases\
    \ are also undisposed/sub judice) and gave\n-- no age profile or case-type split. Now: open = pending + stayed, by case\
    \ type, with ageing computed from filing_date as of\n-- 2026-10-19; 11 cases carry filing dates AFTER 2026-10-19 (data\
    \ defect) and are counted separately, excluded from ages.\nWITH open_cases AS (\n    SELECT case_type, LOWER(status) AS\
    \ status, filing_date,\n           DATE_DIFF(DATE '2026-10-19', filing_date, DAY) AS age_days_asof\n    FROM grievances_litigation\n\
    \    WHERE LOWER(status) IN ('pending', 'stayed')\n)\nSELECT\n    case_type,\n    COUNT(*) AS open_cases,\n    COUNTIF(status\
    \ = 'stayed') AS of_which_stayed,\n    COUNTIF(age_days_asof BETWEEN 0 AND 364) AS aged_under_1y,\n    COUNTIF(age_days_asof\
    \ BETWEEN 365 AND 1095) AS aged_1_to_3y,\n    COUNTIF(age_days_asof > 1095) AS aged_over_3y,\n    COUNTIF(age_days_asof\
    \ < 0) AS future_dated_filings,\n    ROUND(AVG(IF(age_days_asof >= 0, age_days_asof, NULL)) / 365.25, 1) AS avg_age_years,\n\
    \    SUM(COUNT(*)) OVER () AS total_open,\n    SUM(COUNTIF(age_days_asof > 1095)) OVER () AS total_over_3y\nFROM open_cases\n\
    GROUP BY case_type\nORDER BY open_cases DESC;"
  params: {}
  visual_kind: table
  provenance:
    source_file: data_bank/answer_key/sql/H9.sql
    sha256: 4225f74c0f1bbb779afd6b6092411c8a435608218d183312afc27508c2216e83
    gold_objects: hrfin_silver, hrfin_gold
- id: H10
  group: Director (HR)
  canonical_question: Generate an Excel transfer proposal for FY27 using rotation rules.
  intent_keywords:
  - rotation
  - excel
  - transfer
  - proposal
  - fy27
  - using
  intent_description: 'FY27 transfer proposal: 8,457 of 13,453 active executives are due for rotation — continuous stay of
    5 years or more (10,050), less 1,592 wit'
  parameterized_sql: "-- Answer Key SQL: H10\n-- Question: Generate an Excel transfer proposal for FY27 using rotation rules.\n\
    -- Type: document\n-- Semantic audit 2026-10-20: old SQL counted ALL employees (incl. non-executives, exempt and age 57+)\
    \ with >=36 months per WC, and\n-- the legacy document prose reported the 46-row count as '{eligible_officers_count}'.\n\
    -- Semantic audit 2026-10-20 (rev 2, coordinator): 'due' redefined per JRTP 3.1/3.2 and C1/MET-HR-011 as continuous stay\
    \ >= 60\n-- months (hrfin_gold.v_continuous_stay) with no valid exemption and not within 3 yrs of superannuation; 3-5\
    \ yr stays shown\n-- separately as eligible_3_to_5y; stays starting exactly 2020-07-01 (left-censored posting history)\
    \ counted per WC.\nWITH stay AS (\n    -- current continuous stay per hrfin_gold.v_continuous_stay (same source as C1\
    \ / MET-HR-011)\n    SELECT v.emp_id, v.wc_id, v.grade_id, v.discipline_id, v.retirement_date,\n           v.continuous_from_date,\
    \ v.continuous_stay_months,\n           IF(LOWER(IFNULL(p.exemption_tag, 'none')) IN ('none', ''), NULL, p.exemption_tag)\
    \ AS exemption_tag,\n           p.exemption_valid_until\n    FROM `ongc-hr-finance-agent.hrfin_gold.v_continuous_stay`\
    \ v\n    JOIN dim_grade g ON g.grade_id = v.grade_id\n    JOIN employee_master e ON e.emp_id = v.emp_id\n    LEFT JOIN\
    \ posting_history p ON p.emp_id = v.emp_id AND p.is_current_posting\n    WHERE v.is_current_stay\n      AND LOWER(g.cadre)\
    \ = 'executive'\n      AND LOWER(e.employment_status) = 'active'\n),\never_hard AS (\n    SELECT p.emp_id, LOGICAL_OR(LOWER(w.hard_station_cat)\
    \ = 'c') AS served_cat_c\n    FROM posting_history p JOIN dim_work_centre w ON w.wc_id = p.wc_id\n    GROUP BY p.emp_id\n\
    ),\nrotation AS (\n    -- JRTP 3.1/3.2: 3 yrs is the MINIMUM; rotation normally after 3-5 yrs -> 'due' = continuous stay\
    \ >= 60 months (C1 rule).\n    -- Protected: within 3 yrs of superannuation (JRTP 7.1, C1 rule: retirement_date - 2026-10-19\
    \ <= 3*365.25 days)\n    -- or a recorded exemption still valid on 2026-10-19.\n    SELECT s.*, IFNULL(h.served_cat_c,\
    \ FALSE) AS served_cat_c,\n           DATE_DIFF(s.retirement_date, DATE '2026-10-19', DAY) <= 3 * 365.25 AS retiring_3y,\n\
    \           s.exemption_tag IS NOT NULL AND IFNULL(s.exemption_valid_until, DATE '9999-12-31') >= DATE '2026-10-19' AS\
    \ valid_exemption,\n           s.continuous_stay_months >= @min_stay_months AS stay_ge_5y,\n           s.continuous_stay_months\
    \ BETWEEN 36 AND 59 AS stay_3_to_5y,\n           s.continuous_from_date = DATE '2020-07-01' AS censored_2020_07_01\n \
    \   FROM stay s\n    LEFT JOIN ever_hard h ON h.emp_id = s.emp_id\n),\nflags AS (\n    SELECT r.*,\n           r.stay_ge_5y\
    \ AND NOT r.retiring_3y AND NOT r.valid_exemption AS due_for_rotation,\n           r.stay_3_to_5y AND NOT r.retiring_3y\
    \ AND NOT r.valid_exemption AS eligible_3_to_5y\n    FROM rotation r\n)\n, vac AS (\n    SELECT sp.wc_id, SUM(sp.vacancy_count)\
    \ AS exec_vacancies_fy26\n    FROM sanctioned_posts sp JOIN dim_grade g ON g.grade_id = sp.grade_id\n    WHERE sp.fiscal_year\
    \ = @fiscal_year AND LOWER(g.cadre) = 'executive'\n    GROUP BY sp.wc_id\n)\nSELECT\n    wc.short_name AS work_centre,\n\
    \    wc.hard_station_cat,\n    COUNT(*) AS active_executives,\n    COUNTIF(f.stay_ge_5y) AS stay_ge_5y,\n    COUNTIF(f.due_for_rotation)\
    \ AS due_for_rotation,\n    COUNTIF(f.stay_ge_5y AND f.retiring_3y) AS protected_retiring_3y,\n    COUNTIF(f.stay_ge_5y\
    \ AND NOT f.retiring_3y AND f.valid_exemption) AS protected_exemption_only,\n    COUNTIF(f.eligible_3_to_5y) AS eligible_3_to_5y,\n\
    \    COUNTIF(f.due_for_rotation AND NOT f.served_cat_c) AS due_never_served_cat_c,\n    COUNTIF(f.censored_2020_07_01)\
    \ AS stay_starts_2020_07_01,\n    IFNULL(MAX(v.exec_vacancies_fy26), 0) AS exec_vacancies_fy26,\n    SUM(COUNTIF(f.due_for_rotation))\
    \ OVER () AS company_due_for_rotation,\n    SUM(COUNTIF(f.eligible_3_to_5y)) OVER () AS company_eligible_3_to_5y,\n  \
    \  SUM(COUNTIF(f.censored_2020_07_01)) OVER () AS company_stay_starts_2020_07_01,\n    SUM(COUNTIF(f.due_for_rotation\
    \ AND f.censored_2020_07_01)) OVER () AS company_due_stay_starts_2020_07_01,\n    SUM(COUNT(*)) OVER () AS company_active_executives\n\
    FROM flags f\nJOIN dim_work_centre wc ON wc.wc_id = f.wc_id\nLEFT JOIN vac v ON v.wc_id = f.wc_id\nGROUP BY wc.short_name,\
    \ wc.hard_station_cat\nORDER BY wc.hard_station_cat DESC, due_for_rotation DESC, work_centre;"
  params:
    fiscal_year:
      type: STRING
      default: FY26
      description: Fiscal year in FYxx format
      allowed_values:
      - FY21
      - FY22
      - FY23
      - FY24
      - FY25
      - FY26
      - FY27
    min_stay_months:
      type: INT64
      default: 60
      description: Minimum continuous posting duration in months
      allowed_values:
      - 12
      - 24
      - 36
      - 48
      - 60
      - 72
      - 84
      - 96
      - 120
  visual_kind: document
  provenance:
    source_file: data_bank/answer_key/sql/H10.sql
    sha256: fc2b3c5e9e4ffa2191de0e728131a9b4115c71cfb3325efd463222bf68aaa058
    gold_objects: hrfin_silver, hrfin_gold
- id: F1
  group: Director (Finance)
  canonical_question: What is the lifting cost ($/bbl) by asset, and which assets are above the company average?
  intent_keywords:
  - lifting
  - cost
  - bbl
  - asset
  - assets
  - above
  intent_description: 'In FY26, 9 of 15 producing assets had lifting cost above the production-weighted company average of
    $9.13/BOE: Jorhat Asset, Cauvery Asset, '
  parameterized_sql: "-- Answer Key SQL: F1\n-- Question: What is the lifting cost ($/bbl) by asset, and which assets are\
    \ above the company average?\n-- Type: data\n-- Semantic audit 2026-10-20: was an unweighted AVG of field-level $/BOE\
    \ ratios with no company average and no\n-- Semantic audit 2026-10-20: above/below flag. Now production-weighted (opex\
    \ / BOE) per asset for FY26 (last full FY),\n-- Semantic audit 2026-10-20: field lines only, compared with the production-weighted\
    \ company average across all fields.\n\nWITH asset AS (\n    SELECT\n        pnl.asset_wc_id,\n        wc.short_name AS\
    \ asset_name,\n        wc.onshore_offshore,\n        SUM(pnl.total_production_boe) AS boe,\n        SUM(pnl.total_opex_inr_cr)\
    \ AS opex_cr,\n        SUM(pnl.lifting_cost_per_boe_usd * pnl.total_production_boe) AS usd_x_boe\n    FROM field_pnl_annual\
    \ pnl\n    JOIN dim_work_centre wc ON pnl.asset_wc_id = wc.wc_id\n    WHERE pnl.fiscal_year = @fiscal_year\n      AND\
    \ LOWER(pnl.line_type) = 'field'\n      AND pnl.total_production_boe > 0\n    GROUP BY pnl.asset_wc_id, wc.short_name,\
    \ wc.onshore_offshore\n),\ncompany AS (\n    SELECT ROUND(SUM(usd_x_boe) / SUM(boe), 2) AS company_avg_usd_boe FROM asset\n\
    )\nSELECT\n    a.asset_wc_id,\n    a.asset_name,\n    a.onshore_offshore,\n    ROUND(a.boe / 1e6, 2) AS production_mmboe,\n\
    \    ROUND(a.opex_cr, 1) AS opex_inr_cr,\n    ROUND(a.usd_x_boe / a.boe, 2) AS lifting_cost_usd_boe,\n    ROUND(a.opex_cr\
    \ * 1e7 / a.boe, 0) AS lifting_cost_inr_boe,\n    c.company_avg_usd_boe,\n    ROUND(a.usd_x_boe / a.boe, 2) > c.company_avg_usd_boe\
    \ AS above_company_avg\nFROM asset a\nCROSS JOIN company c\nORDER BY lifting_cost_usd_boe DESC;"
  params:
    fiscal_year:
      type: STRING
      default: FY26
      description: Fiscal year in FYxx format
      allowed_values:
      - FY21
      - FY22
      - FY23
      - FY24
      - FY25
      - FY26
      - FY27
  visual_kind: table
  provenance:
    source_file: data_bank/answer_key/sql/F1.sql
    sha256: 9641b7476a6df9f490020ca4e669f24f01ed9c20e38fe7426e71d80f26685d62
    gold_objects: hrfin_gold.v_lifting_cost
- id: F2
  group: Director (Finance)
  canonical_question: What is capex utilisation (budget vs. revised estimate vs. actual) by asset for the current year?
  intent_keywords:
  - capex
  - utilisation
  - budget
  - revised
  - estimate
  - actual
  intent_description: FY27 year-to-date (6 months to September 2026) capex is ₹18,020 cr against a phased BE of ₹18,915 cr
    and RE of ₹18,537 cr - utilisation 95.3
  parameterized_sql: "-- Answer Key SQL: F2\n-- Question: What is capex utilisation (budget vs. revised estimate vs. actual)\
    \ by asset for the current year?\n-- Type: data\n-- Semantic audit 2026-10-20: was a list of project_progress milestone\
    \ rows with RCE > sanctioned cost (6 duplicate\n-- Semantic audit 2026-10-20: milestone rows per project, no BE/RE/actual,\
    \ no current-year filter). Now capex_budget for\n-- Semantic audit 2026-10-20: the current FY27 year-to-date (Apr-Sep\
    \ 2026, 6 months; BE/RE are phased monthly) by asset:\n-- Semantic audit 2026-10-20: BE, RE, actual, utilisation vs BE\
    \ and vs RE.\n\nSELECT\n    cb.asset_wc_id,\n    wc.short_name AS asset_name,\n    wc.onshore_offshore,\n    COUNT(DISTINCT\
    \ cb.prj_id) AS projects,\n    COUNT(DISTINCT cb.month) AS months_covered,\n    ROUND(SUM(cb.budget_estimate_be_inr_cr),\
    \ 1) AS be_ytd_cr,\n    ROUND(SUM(cb.revised_estimate_re_inr_cr), 1) AS re_ytd_cr,\n    ROUND(SUM(cb.actual_spend_inr_cr),\
    \ 1) AS actual_ytd_cr,\n    ROUND(SUM(cb.actual_spend_inr_cr) * 100 / NULLIF(SUM(cb.budget_estimate_be_inr_cr), 0), 1)\
    \ AS utilisation_vs_be_pct,\n    ROUND(SUM(cb.actual_spend_inr_cr) * 100 / NULLIF(SUM(cb.revised_estimate_re_inr_cr),\
    \ 0), 1) AS utilisation_vs_re_pct,\n    ROUND(SUM(cb.actual_spend_inr_cr) - SUM(cb.budget_estimate_be_inr_cr), 1) AS variance_vs_be_cr\n\
    FROM capex_budget cb\nLEFT JOIN dim_work_centre wc ON wc.wc_id = cb.asset_wc_id\nWHERE cb.fiscal_year = 'FY27'\nGROUP\
    \ BY cb.asset_wc_id, wc.short_name, wc.onshore_offshore\nORDER BY actual_ytd_cr DESC;"
  params: {}
