  - one
  - cluster
  - purposes
  intent_description: 'ONGC has 13 Geographic Clusters; all work centres inside one cluster count as a single station for
    tenure, so moves within a cluster do not '
  parameterized_sql: "-- Answer Key SQL: P2\n-- Question: Which stations count as one cluster for tenure purposes?\n-- Type:\
    \ policy\n-- Semantic audit 2026-10-20: old query returned the JRTP 5.0 metadata header (no cluster list) plus 4 TA-regulation\n\
    -- chunks (P1-16) irrelevant to clusters. Now lists the 13 clusters from dim_work_centre (structured) with\n-- their work\
    \ centres and checks each is named in JRTP Clause 5.2.\n\nWITH doc AS (\n  SELECT REGEXP_REPLACE(text, r'\\s+', ' ') AS\
    \ body\n  FROM `ongc-hr-finance-agent.hrfin_docs.silver_chunks`\n  WHERE doc_id = 'JRTP' AND clause_ref = 'Clause 5.0'\n\
    )\nSELECT\n    w.cluster_id,\n    w.cluster_name,\n    COUNT(*) AS work_centres,\n    STRING_AGG(DISTINCT w.city, ', '\
    \ ORDER BY w.city) AS cities,\n    STRING_AGG(w.short_name, '; ' ORDER BY w.wc_id) AS work_centre_names,\n    LOGICAL_AND(STRPOS(doc.body,\
    \ CONCAT('Cluster ', w.cluster_id, ' ')) > 0) AS listed_in_jrtp_5_2\nFROM dim_work_centre w\nCROSS JOIN doc\nGROUP BY\
    \ w.cluster_id, w.cluster_name\nORDER BY work_centres DESC, w.cluster_id;"
