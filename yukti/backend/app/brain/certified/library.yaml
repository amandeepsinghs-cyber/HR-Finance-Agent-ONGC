  group: E1–E4 officer self-service
  canonical_question: When am I due for transfer, and what is the rotation policy for my grade?
  intent_keywords:
  - rotation
  - grade
  - when
  - due
  - transfer
  - policy
  intent_description: 'You have been at Corporate HQ Delhi (Deendayal Urja Bhawan) since 2021-08-16 (62 months), past the
    end of the JRTP 3–5 year rotation window '
  parameterized_sql: "-- Answer Key SQL: E2\n-- Question: When am I due for transfer, and what is the rotation policy for\
    \ my grade?\n-- Type: policy_plus_data\n-- Semantic audit 2026-10-20: Old SQL listed the posting only. Now applies JRTP\
    \ 3.0 (rotation window 36-60 months) and 9.1 (AGT effective by 1 July) to the current posting (is_current_posting).\n\n\
    SELECT\n    p.emp_id,\n    p.wc_id,\n    w.name AS work_centre,\n    w.cluster_id,\n    p.grade_id,\n    p.from_date AS\
    \ station_since,\n    DATE_DIFF(DATE '2026-10-19', p.from_date, MONTH) AS tenure_months,\n    DATE_ADD(p.from_date, INTERVAL\
    \ 36 MONTH) AS rotation_window_opens,\n    DATE_ADD(p.from_date, INTERVAL 60 MONTH) AS rotation_window_closes,\n    CASE\n\
    \        WHEN DATE_DIFF(DATE '2026-10-19', p.from_date, MONTH) > 60 THEN 'beyond 5-year window - due in next AGT'\n  \
    \      WHEN DATE_DIFF(DATE '2026-10-19', p.from_date, MONTH) >= 36 THEN 'within 3-5 year window - eligible'\n        ELSE\
    \ 'not yet eligible (under 3 years)'\n    END AS rotation_status,\n    DATE '2027-07-01' AS next_agt_effective_by,\n \
    \   p.exemption_tag\nFROM posting_history p\nJOIN dim_work_centre w ON p.wc_id = w.wc_id\nWHERE p.emp_id = @self_emp_id\n\
    \  AND p.is_current_posting = TRUE;"
  params:
    self_emp_id:
      type: STRING
      default: EMP-102451
      description: Caller's own employee ID bound from server-side Principal.emp_id
