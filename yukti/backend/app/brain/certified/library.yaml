    source_file: data_bank/answer_key/sql/X5.sql
    sha256: 0b5502d56163e17cf47b06a5a368f97367f5372c3bff7dd5d507bab17a38cf56
    gold_objects: hrfin_silver, hrfin_gold
- id: X6
  group: Additional themes
  canonical_question: How much capex went to ONGC Green / renewables vs. the Net Zero 2038 path, and how many people have
    been reskilled?
  intent_keywords:
  - capex
  - went
  - ongc
  - green
  - renewables
  - net
  intent_description: Green and renewable capex totalled ₹25,408 cr over FY22-FY26, rising to ₹11,983 cr in FY26 (33.4% of
    company capex of ₹35,878 cr), and 6,912
  parameterized_sql: "-- Answer Key SQL: X6\n-- Question: How much capex went to ONGC Green / renewables vs. the Net Zero\
    \ 2038 path, and how many people have been reskilled?\n-- Type: data\n-- Semantic audit 2026-10-20: Answers all three\
    \ parts: green capex per FY (FY22-FY26) with running cumulative (sum of annual_capex -\n-- the stored cumulative_capex\
    \ column does not reconcile), share of company capex, MW installed, roadmap milestone\n-- flag, and distinct employees\
    \ completing renewable reskilling (counted once, at first completion). Old SQL showed FY26 by technology only, no reskilling.\n\
    -- GAP: no Net Zero 2038 spend trajectory exists in the data; only a boolean milestone flag.\nWITH g AS (\n    SELECT\
    \ fiscal_year,\n        SUM(annual_capex_inr_cr) AS green_capex_cr,\n        SUM(installed_capacity_mw) AS installed_mw,\n\
    \        LOGICAL_AND(net_zero_2038_roadmap_milestone_met) AS all_roadmap_milestones_met\n    FROM energy_transition\n\
    \    GROUP BY fiscal_year\n),\nfirst_completion AS (\n    SELECT emp_id, MIN(fiscal_year) AS first_fy\n    FROM training_records\n\
    \    WHERE is_renewable_reskilling AND LOWER(completion_status) = 'completed'\n    GROUP BY emp_id\n),\nr AS (\n    SELECT\
    \ first_fy AS fiscal_year, COUNT(*) AS employees_newly_reskilled\n    FROM first_completion\n    GROUP BY first_fy\n)\n\
    SELECT\n    g.fiscal_year,\n    ROUND(g.green_capex_cr, 1) AS green_capex_cr,\n    ROUND(SUM(g.green_capex_cr) OVER (ORDER\
    \ BY g.fiscal_year), 1) AS cumulative_green_capex_cr,\n    c.total_capex_spent_inr_cr AS company_capex_cr,\n    ROUND(g.green_capex_cr\
    \ * 100 / c.total_capex_spent_inr_cr, 1) AS green_share_of_capex_pct,\n    g.installed_mw,\n    g.all_roadmap_milestones_met,\n\
    \    r.employees_newly_reskilled,\n    SUM(r.employees_newly_reskilled) OVER (ORDER BY g.fiscal_year) AS cumulative_distinct_employees_reskilled\n\
    FROM g\nJOIN corporate_financials c ON c.fiscal_year = g.fiscal_year\nLEFT JOIN r ON r.fiscal_year = g.fiscal_year\nORDER\
    \ BY g.fiscal_year;"
  params: {}
  visual_kind: table
  provenance:
    source_file: data_bank/answer_key/sql/X6.sql
    sha256: 60fe9ef6b4b3a8c152b0f0e2dd1286458d7b7ca681e47b6621250ee3f3d90fe0
    gold_objects: hrfin_silver, hrfin_gold
- id: X7
  group: Additional themes
  canonical_question: 'Draft a reply to a Parliament question: "Vacancies in ONGC in the North-East region, category-wise."'
  intent_keywords:
  - vacancies
  - draft
  - reply
  - parliament
  - question
  - ongc
  intent_description: '**Draft reply (Minister of Petroleum & Natural Gas):** As on 31 March 2026, ONGC had 143 vacancies
    against 4,548 sanctioned posts (3.1%) in '
  parameterized_sql: "-- Answer Key SQL: X7\n-- Question: Draft a reply to a Parliament question: \"Vacancies in ONGC in the\
    \ North-East region, category-wise.\"\n-- Type: document\n-- Semantic audit 2026-10-20: Category-wise as the Parliament\
    \ question asks (old SQL was work-centre-wise with no category split).\n-- All six NE work centres (Assam + Tripura),\
    \ FY26 sanctioned-posts roster, by social category with state split.\nSELECT\n    sp.social_category AS category,\n  \
    \  SUM(sp.sanctioned_strength) AS sanctioned,\n    SUM(sp.in_position_strength) AS in_position,\n    SUM(sp.vacancy_count)\
    \ AS vacancies,\n    SUM(IF(wc.state = 'Assam', sp.vacancy_count, 0)) AS vacancies_assam,\n    SUM(IF(wc.state = 'Tripura',\
    \ sp.vacancy_count, 0)) AS vacancies_tripura,\n    ROUND(SUM(sp.vacancy_count) * 100 / SUM(sp.sanctioned_strength), 1)\
    \ AS vacancy_rate_pct,\n    SUM(sp.backlog_vacancies) AS backlog_reserved_vacancies\nFROM sanctioned_posts sp\nJOIN dim_work_centre\
    \ wc ON sp.wc_id = wc.wc_id\nWHERE wc.sector = 'NE' AND sp.fiscal_year = @fiscal_year\nGROUP BY sp.social_category\nORDER\
    \ BY CASE sp.social_category WHEN 'SC' THEN 1 WHEN 'ST' THEN 2 WHEN 'OBC' THEN 3 WHEN 'EWS' THEN 4 ELSE 5 END;"
  params:
    fiscal_year:
      type: STRING
      default: FY26
      description: Fiscal year in FYxx format
      allowed_values:
      - FY21
      - FY22
      - FY23
      - FY24
      - FY25
      - FY26
      - FY27
  visual_kind: document
  provenance:
    source_file: data_bank/answer_key/sql/X7.sql
    sha256: ef59bcd362d55c630ca6f190dbc825cbe2fa70da5805af01af33a6297af4f3cc
    gold_objects: hrfin_silver, hrfin_gold
- id: X8
  group: Additional themes
  canonical_question: How many audit (CAG) objections and right-to-information (RTI) applications are pending, and how old
    are they?
  intent_keywords:
  - cag
  - rti
  - audit
  - objections
  - right-to-information
  - applications
  intent_description: '36 CAG audit paras and 82 RTI applications are pending as of 19-Oct-2026; 20 of the paras are over
    three years old (6 over five) and 63 RTI '
  parameterized_sql: "-- Answer Key SQL: X8\n-- Question: How many audit (CAG) objections and right-to-information (RTI) applications\
    \ are pending, and how old are they?\n-- Type: data\n-- Semantic audit 2026-10-20: Adds the ageing the question asks for\
    \ (old SQL returned two counts only). Open CAG paras (status <> closed)\n-- by age band from notification date and pending\
    \ RTI applications by days since receipt, both as of 2026-10-19.\nWITH cag AS (\n    SELECT DATE_DIFF(DATE '2026-10-19',\
    \ notification_date, DAY) AS age_days, financial_implication_inr_cr\n    FROM cag_paras\n    WHERE LOWER(current_status)\
    \ != 'closed'\n),\nrti AS (\n    SELECT DATE_DIFF(DATE '2026-10-19', received_date, DAY) AS age_days\n    FROM rti_applications\n\
    \    WHERE LOWER(status) LIKE 'pending%'\n)\nSELECT 'CAG audit paras (open)' AS item,\n    CASE WHEN age_days < 365 THEN\
    \ '1: under 1 year' WHEN age_days < 3 * 365 THEN '2: 1-3 years'\n         WHEN age_days < 5 * 365 THEN '3: 3-5 years'\
    \ ELSE '4: over 5 years' END AS age_band,\n    COUNT(*) AS pending_count,\n    ROUND(AVG(age_days) / 365.25, 1) AS avg_age_years,\n\
    \    MAX(age_days) AS oldest_days,\n    ROUND(SUM(financial_implication_inr_cr), 1) AS financial_implication_cr\nFROM\
    \ cag GROUP BY age_band\nUNION ALL\nSELECT 'RTI applications (pending)',\n    CASE WHEN age_days <= 30 THEN '1: within\
    \ 30 days' WHEN age_days <= 90 THEN '2: 31-90 days'\n         WHEN age_days <= 365 THEN '3: 91-365 days' ELSE '4: over\
    \ 1 year' END,\n    COUNT(*), ROUND(AVG(age_days) / 365.25, 1), MAX(age_days), NULL\nFROM rti GROUP BY 2\nORDER BY item,\
    \ age_band;"
  params: {}
  visual_kind: table
  provenance:
    source_file: data_bank/answer_key/sql/X8.sql
    sha256: 97f2e8c237588f46b8d02fa524faa589e23e4665ee5b1eff8ddcfa5c331d1785
    gold_objects: hrfin_silver, hrfin_gold
- id: X9
  group: Additional themes
  canonical_question: CSR spend by state and theme vs. the policy's priority areas
  intent_keywords:
  - csr
  - spend
  - state
  - theme
  - policy
  - priority
  intent_description: FY26 CSR spend was ₹949 cr across 14 states, led by Uttar Pradesh (₹155.0 cr) and Maharashtra (₹137.6
    cr); by theme, Education (₹221.9 cr) a
  parameterized_sql: "-- Answer Key SQL: X9\n-- Question: CSR spend by state and theme vs. the policy's priority areas\n--\
    \ Type: data\n-- Semantic audit 2026-10-20: Adds the policy-priority dimension (CSR Policy 2025 cl.1.1: preference to\
    \ Operational Areas; aspirational\n-- districts): FY26 spend by state and theme with operational-area and aspirational-district\
    \ spend.\nSELECT\n    g.state_name,\n    c.csr_theme,\n    COUNT(*) AS projects,\n    ROUND(SUM(c.actual_disbursed_inr_cr),\
    \ 2) AS spend_cr,\n    ROUND(SUM(IF(c.is_operational_field_area, c.actual_disbursed_inr_cr, 0)), 2) AS operational_area_spend_cr,\n\
    \    ROUND(SUM(IF(c.is_aspirational_district, c.actual_disbursed_inr_cr, 0)), 2) AS aspirational_district_spend_cr,\n\
    \    g.ongc_operational_presence AS state_has_ongc_operations\nFROM csr_projects c\nJOIN dim_geography g ON c.state_code\
    \ = g.state_code\nWHERE c.fiscal_year = @fiscal_year\nGROUP BY g.state_name, c.csr_theme, g.ongc_operational_presence\n\
    ORDER BY spend_cr DESC;"
  params:
    fiscal_year:
      type: STRING
      default: FY26
      description: Fiscal year in FYxx format
      allowed_values:
      - FY21
      - FY22
      - FY23
      - FY24
      - FY25
      - FY26
      - FY27
  visual_kind: table
  provenance:
    source_file: data_bank/answer_key/sql/X9.sql
    sha256: ab983a827c3eba276fe4d240fa7a5cdb13672ced919bd0c385752daab40f45b3
    gold_objects: hrfin_silver, hrfin_gold
- id: X10
  group: Additional themes
  canonical_question: '*Unprompted:* "3 projects slipped this week; 42 rotation cases overdue; Field X lifting cost up 12%."'
  intent_keywords:
  - rotation
  - unprompted
  - projects
  - slipped
  - week
  - cases
  intent_description: 'The data supports only part of the alert: 7 capital projects are currently behind schedule (max slippage
    19 months; 9 projects incl. complet'
  parameterized_sql: "-- Answer Key SQL: X10\n-- Question: *Unprompted:* \"3 projects slipped this week; 42 rotation cases\
    \ overdue; Field X lifting cost up 12%.\"\n-- Type: data\n-- Semantic audit 2026-10-20: Each alert component is now computed\
    \ from its proper source: (1) open capital projects behind schedule\n-- (project grain, not milestone rows); (2) executives\
    \ past the JRTP cl.3.2 5-year rotation window at their current\n-- station per hrfin_gold.v_continuous_stay (>=60 months),\
    \ excluding valid exemption tags and officers within 3 years of\n-- superannuation (same rule as C1/H10) (old: anyone\
    \ incl. non-executives with >=36 months -> 20,488); (3) largest field-level YoY change in\n-- lifting cost FY26 vs FY25\
    \ on line_type='field' (old: AVG over all line types and years = 68,922,047 USD/BOE).\n-- GAP: no weekly project or cost\
    \ data exists, so 'this week' cannot be evaluated.\nWITH proj AS (\n    SELECT p.prj_id, d.name AS project_name, d.status\
    \ AS project_status,\n        MAX(p.schedule_slippage_months) AS slippage_months,\n        MAX(p.scheduled_completion_date)\
    \ AS scheduled_completion,\n        MAX(p.anticipated_or_actual_completion_date) AS anticipated_completion,\n        MAX(p.cost_overrun_inr_cr)\
    \ AS cost_overrun_cr,\n        ANY_VALUE(p.delay_root_cause_category) AS delay_root_cause,\n        COUNTIF(LOWER(p.milestone_status)\
    \ = 'delayed_critical_path') AS critical_path_milestones_delayed\n    FROM project_progress p\n    JOIN dim_project d\
    \ ON d.prj_id = p.prj_id\n    WHERE p.schedule_slippage_months > 0\n    GROUP BY p.prj_id, d.name, d.status\n),\nexempt\
    \ AS (\n    SELECT emp_id\n    FROM posting_history\n    WHERE is_current_posting AND NULLIF(exemption_tag, 'None') IS\
    \ NOT NULL\n      AND (exemption_valid_until IS NULL OR exemption_valid_until >= DATE '2026-10-19')\n),\noverdue AS (\n\
    \    SELECT v.emp_id, v.wc_id, v.grade_id, v.continuous_stay_months AS months_at_station\n    FROM `ongc-hr-finance-agent.hrfin_gold.v_continuous_stay`\
    \ v\n    WHERE v.is_current_stay AND STARTS_WITH(v.grade_id, 'E') AND v.continuous_stay_months >= @min_stay_months\n \
    \     AND v.emp_id NOT IN (SELECT emp_id FROM exempt)\n      AND DATE_DIFF(v.retirement_date, DATE '2026-10-19', DAY)\
    \ > 3 * 365.25\n),\nf AS (\n    SELECT field_id, fiscal_year, lifting_cost_per_boe_usd, total_production_boe\n    FROM\
    \ field_pnl_annual\n    WHERE LOWER(line_type) = 'field' AND fiscal_year IN ('FY25', 'FY26')\n),\nlift AS (\n    SELECT\
    \ a.field_id, d.name AS field_name, a.lifting_cost_per_boe_usd AS lifting_fy25_usd_boe,\n        b.lifting_cost_per_boe_usd\
    \ AS lifting_fy26_usd_boe,\n        ROUND((b.lifting_cost_per_boe_usd - a.lifting_cost_per_boe_usd) * 100 / a.lifting_cost_per_boe_usd,\
    \ 1) AS lifting_change_pct\n    FROM f a\n    JOIN f b ON a.field_id = b.field_id AND a.fiscal_year = 'FY25' AND b.fiscal_year\
    \ = @fiscal_year\n    LEFT JOIN dim_field d ON d.field_id = a.field_id\n)\nSELECT '1: Capital projects behind schedule\
    \ (open)' AS indicator,\n    CAST(COUNTIF(LOWER(project_status) != 'completed') AS FLOAT64) AS value,\n    CONCAT('max\
    \ slippage ', CAST(MAX(IF(LOWER(project_status) != 'completed', slippage_months, NULL)) AS STRING), ' months; ',\n   \
    \        CAST(COUNT(*) AS STRING), ' projects incl. completed ones with slippage') AS detail\nFROM proj\nUNION ALL\nSELECT\
    \ '2: Executives overdue for rotation (>=5 yrs at station, non-exempt, >3 yrs to retirement)',\n    CAST(COUNT(*) AS FLOAT64),\n\
    \    CONCAT('of ', CAST((SELECT COUNTIF(is_current_posting AND STARTS_WITH(grade_id, 'E')) FROM posting_history) AS STRING),\n\
    \           ' executives in current postings; median ', CAST(APPROX_QUANTILES(months_at_station, 2)[OFFSET(1)] AS STRING),\
    \ ' months at station')\nFROM overdue\nUNION ALL\nSELECT '3: Largest field lifting-cost increase FY26 vs FY25 (%)',\n\
    \    MAX(lifting_change_pct),\n    CONCAT(ARRAY_AGG(field_name ORDER BY lifting_change_pct DESC LIMIT 1)[OFFSET(0)], ';\
    \ fields up >=12%: ',\n           CAST(COUNTIF(lifting_change_pct >= 12) AS STRING), ' of ', CAST(COUNT(*) AS STRING))\n\
    FROM lift\nORDER BY indicator;"
  params:
    fiscal_year:
      type: STRING
      default: FY26
      description: Fiscal year in FYxx format
      allowed_values:
      - FY21
      - FY22
      - FY23
      - FY24
      - FY25
      - FY26
      - FY27
    min_stay_months:
      type: INT64
      default: 60
      description: Minimum continuous posting duration in months
      allowed_values:
      - 12
      - 24
      - 36
      - 48
      - 60
      - 72
      - 84
      - 96
      - 120
  visual_kind: table
  provenance:
    source_file: data_bank/answer_key/sql/X10.sql
    sha256: 8f998c3dd063b608ba3d7189a22babdca912e6fd7fb84ab8b2b7ec3bb7eddff2
    gold_objects: hrfin_silver, hrfin_gold
self_queries:
- id: my_payslip
  group: self
  data_class: self
  canonical_question: Show my latest payslip and monthly pay breakdown.
  intent_keywords:
  - my
  - payslip
  - pay
  - salary
  - monthly
  parameterized_sql: "SELECT payroll_id, emp_id, pay_period, fiscal_year, wc_id, grade_id, discipline_id,\n  basic_pay_inr,\
    \ da_inr, hra_inr, cafeteria_allowances_inr, mining_offshore_allowance_inr,\n  prp_inr, gross_salary_inr, income_tax_tds_inr,\
    \ net_salary_inr\nFROM payroll_monthly\nWHERE emp_id = @self_emp_id\nORDER BY pay_period DESC\nLIMIT 12;"
