- id: X5
  group: Additional themes
  canonical_question: How did ONGC Videsh, MRPL and HPCL contribute to group profit and dividend?
  intent_keywords:
  - ongc
  - videsh
  - mrpl
  - hpcl
  - contribute
  - group
  intent_description: In FY26 HPCL, MRPL and OVL together contributed ₹11,964 cr of ONGC-attributable profit (24.0% of group
    PAT of ₹49,793 cr) and paid ONGC ₹2,8
  parameterized_sql: "-- Answer Key SQL: X5\n-- Question: How did ONGC Videsh, MRPL and HPCL contribute to group profit and\
    \ dividend?\n-- Type: data\n-- Semantic audit 2026-10-20: Restricted to the three entities asked (old SQL included OTPC\
    \ and OPAL) and adds the contribution metrics:\n-- ONGC-attributable PAT (PAT x equity holding), its share of FY26 consolidated\
    \ PAT, and dividend received as a share of\n-- ONGC standalone PAT.\nSELECT\n    s.entity_code,\n    s.entity_name,\n\
    \    s.ongc_equity_holding_pct,\n    s.pat_inr_cr AS pat_cr,\n    ROUND(s.pat_inr_cr * s.ongc_equity_holding_pct / 100,\
    \ 1) AS ongc_share_of_pat_cr,\n    ROUND(s.pat_inr_cr * s.ongc_equity_holding_pct / c.consolidated_pat_inr_cr, 1) AS share_of_group_pat_pct,\n\
    \    s.dividend_received_by_ongc_inr_cr AS dividend_received_by_ongc_cr,\n    ROUND(s.dividend_received_by_ongc_inr_cr\
    \ * 100 / c.pat_inr_cr, 1) AS dividend_as_pct_of_ongc_standalone_pat,\n    c.consolidated_pat_inr_cr AS group_consolidated_pat_cr,\n\
    \    c.pat_inr_cr AS ongc_standalone_pat_cr\nFROM subsidiary_financials s\nJOIN corporate_financials c ON c.fiscal_year\
    \ = s.fiscal_year\nWHERE s.fiscal_year = @fiscal_year AND s.entity_code IN ('OVL', 'MRPL', 'HPCL')\nORDER BY ongc_share_of_pat_cr\
    \ DESC;"
  params:
    fiscal_year:
      type: STRING
      default: FY26
      description: Fiscal year in FYxx format
      allowed_values:
      - FY21
      - FY22
      - FY23
      - FY24
      - FY25
      - FY26
      - FY27
  visual_kind: table
