- id: F5
  group: Director (Finance)
  canonical_question: Which contracts or vendors make up the top 80% of spend, and where were the cost overruns?
  intent_keywords:
  - contracts
  - vendors
  - make
  - top
  - spend
  - where
  intent_description: 870 of 2,000 vendors account for the top 80% of FY26 contract spend (₹12,703 cr of ₹15,878 cr; cumulative
    80.0% at the cut-off), led by Pall
  parameterized_sql: "-- Answer Key SQL: F5\n-- Question: Which contracts or vendors make up the top 80% of spend, and where\
    \ were the cost overruns?\n-- Type: data\n-- Semantic audit 2026-10-20: was every vendor alphabetically with LIMIT 100\
    \ (no Pareto cut), grouped by vendor NAME\n-- Semantic audit 2026-10-20: (2,000 vendor_ids share 1,975 names -> merged\
    \ vendors), raw rupees. Now FY26 (last full FY)\n-- Semantic audit 2026-10-20: paid spend by vendor_id, cumulative share,\
    \ and only vendors inside the top 80% of spend\n-- Semantic audit 2026-10-20: (incl. the vendor that crosses 80%), with\
    \ cost overrun (revised - original PO) in crore.\n\nWITH v AS (\n    SELECT\n        po.vendor_id,\n        SUM(po.actual_paid_amount_inr)\
    \ / 1e7 AS paid_cr,\n        SUM(po.original_po_value_inr) / 1e7 AS original_po_cr,\n        SUM(po.cost_overrun_inr)\
    \ / 1e7 AS overrun_cr,\n        COUNTIF(po.cost_overrun_inr > 0) AS overrun_lines,\n        COUNT(DISTINCT po.po_number)\
    \ AS pos\n    FROM purchase_orders po\n    WHERE po.fiscal_year = @fiscal_year\n    GROUP BY po.vendor_id\n),\nr AS (\n\
    \    SELECT *,\n        ROW_NUMBER() OVER (ORDER BY paid_cr DESC, vendor_id) AS spend_rank,\n        SUM(paid_cr) OVER\
    \ (ORDER BY paid_cr DESC, vendor_id ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW)\n            / SUM(paid_cr) OVER\
    \ () * 100 AS cum_share_pct,\n        SUM(paid_cr) OVER () AS total_paid_cr,\n        COUNT(*) OVER () AS total_vendors,\n\
    \        SUM(overrun_cr) OVER () AS total_overrun_cr\n    FROM v\n)\nSELECT\n    r.spend_rank,\n    r.vendor_id,\n   \
    \ d.name AS vendor_name,\n    d.category AS vendor_category,\n    r.pos,\n    ROUND(r.paid_cr, 2) AS paid_fy26_cr,\n \
    \   ROUND(r.cum_share_pct, 2) AS cum_share_pct,\n    ROUND(r.overrun_cr, 2) AS cost_overrun_cr,\n    ROUND(r.overrun_cr\
    \ * 100 / NULLIF(r.original_po_cr, 0), 2) AS overrun_pct_of_po,\n    r.overrun_lines,\n    ROUND(r.total_paid_cr, 0) AS\
    \ total_paid_all_vendors_cr,\n    r.total_vendors,\n    ROUND(r.total_overrun_cr, 1) AS total_overrun_all_vendors_cr\n\
    FROM r\nLEFT JOIN dim_vendor d ON d.vendor_id = r.vendor_id\nWHERE r.cum_share_pct - r.paid_cr / r.total_paid_cr * 100\
    \ < 80\nORDER BY r.spend_rank;"
  params:
    fiscal_year:
      type: STRING
      default: FY26
      description: Fiscal year in FYxx format
      allowed_values:
      - FY21
      - FY22
      - FY23
      - FY24
      - FY25
      - FY26
      - FY27
  visual_kind: bar_chart
  provenance:
    source_file: data_bank/answer_key/sql/F5.sql
    sha256: f112365e4dd5c0b15a0ee00a1918ed87a1225fd706797727bf841e5cfd0cdc31
    gold_objects: hrfin_silver, hrfin_gold
- id: F6
  group: Director (Finance)
  canonical_question: How old are receivables from oil marketing companies and gas buyers, by customer?
  intent_keywords:
  - old
  - receivables
  - oil
  - marketing
  - companies
  - gas
  intent_description: Trade receivables of ₹13,168 cr were outstanding at 31-Mar-2026 across 26 customers; 61.3% is under
    30 days and ₹1,595 cr (12.1%) is older t
  parameterized_sql: "-- Answer Key SQL: F6\n-- Question: How old are receivables from oil marketing companies and gas buyers,\
    \ by customer?\n-- Type: data\n-- Semantic audit 2026-10-20: was customer x bucket rows ordered alphabetically with LIMIT\
    \ 100 (125 combinations exist ->\n-- Semantic audit 2026-10-20: 25 rows silently dropped). Now one row per customer with\
    \ the aging buckets pivoted, total,\n-- Semantic audit 2026-10-20: >90-day share and disputed amount. Balances are as\
    \ at 31-Mar-2026 (only FY26 invoices carry\n-- Semantic audit 2026-10-20: outstanding; aging_days is measured from invoice\
    \ date to FY26 year-end).\n\nSELECT\n    c.short_name AS customer,\n    c.type AS customer_type,\n    STRING_AGG(DISTINCT\
    \ r.product_type, ', ') AS products,\n    ROUND(SUM(r.outstanding_amount_inr_cr), 1) AS outstanding_cr,\n    ROUND(SUM(IF(r.aging_days\
    \ <= 30, r.outstanding_amount_inr_cr, 0)), 1) AS d0_30_cr,\n    ROUND(SUM(IF(r.aging_days BETWEEN 31 AND 60, r.outstanding_amount_inr_cr,\
    \ 0)), 1) AS d31_60_cr,\n    ROUND(SUM(IF(r.aging_days BETWEEN 61 AND 90, r.outstanding_amount_inr_cr, 0)), 1) AS d61_90_cr,\n\
    \    ROUND(SUM(IF(r.aging_days BETWEEN 91 AND 180, r.outstanding_amount_inr_cr, 0)), 1) AS d91_180_cr,\n    ROUND(SUM(IF(r.aging_days\
    \ > 180, r.outstanding_amount_inr_cr, 0)), 1) AS d180_plus_cr,\n    ROUND(SUM(IF(r.aging_days > 90, r.outstanding_amount_inr_cr,\
    \ 0)) * 100 / SUM(r.outstanding_amount_inr_cr), 1) AS over_90d_pct,\n    ROUND(SUM(IF(r.is_disputed, r.outstanding_amount_inr_cr,\
    \ 0)), 1) AS disputed_cr\nFROM receivables r\nLEFT JOIN dim_customer c ON r.customer_id = c.customer_id\nWHERE r.outstanding_amount_inr_cr\
    \ > 0\nGROUP BY c.short_name, c.type\nORDER BY outstanding_cr DESC;"
  params: {}
  visual_kind: table
  provenance:
    source_file: data_bank/answer_key/sql/F6.sql
    sha256: f1571a6d0aa251feb39948c9029c4733ef4e2df3f7351c58f591fe47e5d28ed6
    gold_objects: hrfin_silver, hrfin_gold
- id: F7
  group: Director (Finance)
  canonical_question: What is the employee cost as a percentage of revenue, by asset, and how has it trended?
  intent_keywords:
  - employee
  - cost
  - percentage
  - revenue
  - asset
  - has
  intent_description: 'Allocated employee cost was 6.3% of field revenue across producing assets in FY26, ranging from 45.7%
    at Jorhat Asset to 2.6% at Ankleshwar '
  parameterized_sql: "-- Answer Key SQL: F7\n-- Question: What is the employee cost as a percentage of revenue, by asset,\
    \ and how has it trended?\n-- Type: data\n-- Semantic audit 2026-10-20: grouped by asset name AND field values, so it\
    \ returned one row per field labelled with the\n-- Semantic audit 2026-10-20: asset name (295 rows, several per asset-year;\
    \ corporate/plant lines with zero revenue mixed\n-- Semantic audit 2026-10-20: in). Now aggregated to asset (field lines\
    \ only): allocated manpower cost / gross revenue\n-- Semantic audit 2026-10-20: for each FY21-FY26 (5-year trend) plus\
    \ FY26 cost and revenue and the FY21->FY26 change.\n\nWITH a AS (\n    SELECT\n        pnl.asset_wc_id,\n        pnl.fiscal_year,\n\
    \        SUM(pnl.allocated_manpower_cost_inr_cr) AS mp,\n        SUM(pnl.gross_revenue_inr_cr) AS rev\n    FROM field_pnl_annual\
    \ pnl\n    WHERE LOWER(pnl.line_type) = 'field'\n      AND pnl.fiscal_year IN ('FY21', 'FY22', 'FY23', 'FY24', 'FY25',\
    \ 'FY26')\n    GROUP BY pnl.asset_wc_id, pnl.fiscal_year\n)\nSELECT\n    wc.short_name AS asset_name,\n    wc.onshore_offshore,\n\
    \    ROUND(SUM(IF(a.fiscal_year = @fiscal_year, a.mp, 0)), 1) AS manpower_cost_fy26_cr,\n    ROUND(SUM(IF(a.fiscal_year\
    \ = @fiscal_year, a.rev, 0)), 0) AS revenue_fy26_cr,\n    ROUND(SAFE_DIVIDE(SUM(IF(a.fiscal_year = 'FY21', a.mp, 0)),\
    \ SUM(IF(a.fiscal_year = 'FY21', a.rev, 0))) * 100, 1) AS pct_fy21,\n    ROUND(SAFE_DIVIDE(SUM(IF(a.fiscal_year = 'FY22',\
    \ a.mp, 0)), SUM(IF(a.fiscal_year = 'FY22', a.rev, 0))) * 100, 1) AS pct_fy22,\n    ROUND(SAFE_DIVIDE(SUM(IF(a.fiscal_year\
    \ = 'FY23', a.mp, 0)), SUM(IF(a.fiscal_year = 'FY23', a.rev, 0))) * 100, 1) AS pct_fy23,\n    ROUND(SAFE_DIVIDE(SUM(IF(a.fiscal_year\
    \ = 'FY24', a.mp, 0)), SUM(IF(a.fiscal_year = 'FY24', a.rev, 0))) * 100, 1) AS pct_fy24,\n    ROUND(SAFE_DIVIDE(SUM(IF(a.fiscal_year\
    \ = 'FY25', a.mp, 0)), SUM(IF(a.fiscal_year = 'FY25', a.rev, 0))) * 100, 1) AS pct_fy25,\n    ROUND(SAFE_DIVIDE(SUM(IF(a.fiscal_year\
    \ = @fiscal_year, a.mp, 0)), SUM(IF(a.fiscal_year = @fiscal_year, a.rev, 0))) * 100, 1) AS pct_fy26,\n    ROUND((SAFE_DIVIDE(SUM(IF(a.fiscal_year\
    \ = @fiscal_year, a.mp, 0)), SUM(IF(a.fiscal_year = @fiscal_year, a.rev, 0)))\n         - SAFE_DIVIDE(SUM(IF(a.fiscal_year\
    \ = 'FY21', a.mp, 0)), SUM(IF(a.fiscal_year = 'FY21', a.rev, 0)))) * 100, 1) AS change_fy21_fy26_pp\nFROM a\nJOIN dim_work_centre\
    \ wc ON a.asset_wc_id = wc.wc_id\nGROUP BY wc.short_name, wc.onshore_offshore\nORDER BY pct_fy26 DESC;"
  params:
    fiscal_year:
      type: STRING
      default: FY26
      description: Fiscal year in FYxx format
      allowed_values:
      - FY21
      - FY22
      - FY23
      - FY24
      - FY25
      - FY26
      - FY27
  visual_kind: table
  provenance:
    source_file: data_bank/answer_key/sql/F7.sql
    sha256: ef4afe9c6c71feb2f58149058c8b5a035bbd3615dc19cc5851a558e031903df8
    gold_objects: hrfin_silver, hrfin_gold
- id: F8
  group: Director (Finance)
  canonical_question: What is the finding & development cost and reserve replacement ratio, by basin?
  intent_keywords:
  - finding
  - development
  - cost
  - reserve
  - replacement
  - ratio
  intent_description: In FY26 ONGC replaced 1.17x its production with 2P reserves (47.35 MMTOE accreted vs 40.47 produced)
    at a finding & development cost of $14.
  parameterized_sql: "-- Answer Key SQL: F8\n-- Question: What is the finding & development cost and reserve replacement ratio,\
    \ by basin?\n-- Type: data\n-- Semantic audit 2026-10-20: RRR was an unweighted AVG of field ratios; now basin RRR = SUM(2P\
    \ accretion) / SUM(production)\n-- Semantic audit 2026-10-20: (MMTOE, FY26), F&D costs accretion-weighted, plus production,\
    \ accretion and a company row.\n\nWITH b AS (\n    SELECT\n        basin_name,\n        SUM(annual_production_mmtoe) AS\
    \ prod,\n        SUM(gross_reserves_accretion_mmtoe) AS acc,\n        SUM(finding_cost_usd_per_boe * gross_reserves_accretion_mmtoe)\
    \ AS fc_x,\n        SUM(development_cost_usd_per_boe * gross_reserves_accretion_mmtoe) AS dc_x,\n        SUM(reserves_2p_total_mmtoe)\
    \ AS r2p\n    FROM reserves_annual\n    WHERE fiscal_year = @fiscal_year\n    GROUP BY basin_name\n),\nu AS (\n    SELECT\
    \ * FROM b\n    UNION ALL\n    SELECT 'ALL BASINS', SUM(prod), SUM(acc), SUM(fc_x), SUM(dc_x), SUM(r2p) FROM b\n)\nSELECT\n\
    \    basin_name,\n    ROUND(prod, 2) AS production_mmtoe,\n    ROUND(acc, 2) AS reserve_accretion_2p_mmtoe,\n    ROUND(acc\
    \ / NULLIF(prod, 0), 2) AS rrr_2p,\n    ROUND(fc_x / NULLIF(acc, 0), 2) AS finding_cost_usd_boe,\n    ROUND(dc_x / NULLIF(acc,\
    \ 0), 2) AS development_cost_usd_boe,\n    ROUND((fc_x + dc_x) / NULLIF(acc, 0), 2) AS fd_cost_usd_boe,\n    ROUND(r2p,\
    \ 1) AS reserves_2p_mmtoe\nFROM u\nORDER BY basin_name = 'ALL BASINS', fd_cost_usd_boe DESC;"
  params:
    fiscal_year:
      type: STRING
      default: FY26
      description: Fiscal year in FYxx format
      allowed_values:
      - FY21
      - FY22
      - FY23
      - FY24
      - FY25
      - FY26
      - FY27
  visual_kind: table
  provenance:
    source_file: data_bank/answer_key/sql/F8.sql
    sha256: 4889e47a2295628cea4f4c78d2dc92ec6c354e050ed46c33dcedda6fa5221db3
    gold_objects: hrfin_silver, hrfin_gold
- id: F9
  group: Director (Finance)
  canonical_question: What are the forex exposure and hedging position on dollar-linked contracts?
  intent_keywords:
  - forex
  - exposure
  - hedging
  - position
  - dollar-linked
  - contracts
  intent_description: ONGC's FY26 active forex book is $2,991.3 mn of exposure, 78.3% hedged, leaving $648.6 mn open.
  parameterized_sql: "-- Answer Key SQL: F9\n-- Question: What are the forex exposure and hedging position on dollar-linked\
    \ contracts?\n-- Type: data\n-- Semantic audit 2026-10-20: unlabelled sums in raw USD by currency only. Now FY26 active\
    \ book by currency pair in USD\n-- Semantic audit 2026-10-20: million: gross exposure, hedged via derivatives vs natural\
    \ hedge (crude-sales designated),\n-- Semantic audit 2026-10-20: unhedged, hedge ratio and MTM (Rs cr). Non-USD exposures\
    \ are stated in USD equivalent.\n\nSELECT\n    COALESCE(fh.currency_pair, 'ALL CURRENCIES') AS currency_pair,\n    COUNT(*)\
    \ AS positions,\n    ROUND(SUM(gross_exposure_usd) / 1e6, 1) AS gross_exposure_usd_mn,\n    ROUND(SUM(IF(LOWER(instrument_type)\
    \ LIKE 'natural_hedge%', hedged_amount_usd, 0)) / 1e6, 1) AS natural_hedge_usd_mn,\n    ROUND(SUM(IF(LOWER(instrument_type)\
    \ NOT LIKE 'natural_hedge%', hedged_amount_usd, 0)) / 1e6, 1) AS derivative_hedged_usd_mn,\n    ROUND(SUM(unhedged_exposure_usd)\
    \ / 1e6, 1) AS unhedged_usd_mn,\n    ROUND(SUM(hedged_amount_usd) * 100 / SUM(gross_exposure_usd), 1) AS hedge_ratio_pct,\n\
    \    ROUND(SUM(mtm_gain_loss_inr_cr), 1) AS mtm_gain_loss_inr_cr\nFROM forex_hedges fh\nWHERE fiscal_year = @fiscal_year\
    \ AND LOWER(hedge_status) = 'active'\nGROUP BY ROLLUP (fh.currency_pair)\nORDER BY GROUPING(fh.currency_pair), gross_exposure_usd_mn\
    \ DESC;"
  params:
    fiscal_year:
      type: STRING
      default: FY26
      description: Fiscal year in FYxx format
      allowed_values:
      - FY21
      - FY22
      - FY23
      - FY24
      - FY25
      - FY26
      - FY27
  visual_kind: table
  provenance:
    source_file: data_bank/answer_key/sql/F9.sql
    sha256: de726fad82b844e1e02e057c001cdeaefdba6b8f8558e5d8fc92a901284734a6
    gold_objects: hrfin_silver, hrfin_gold
- id: F10
  group: Director (Finance)
  canonical_question: Generate a quarterly asset-wise P&L sheet.
  intent_keywords:
  - quarterly
  - asset-wise
  - sheet
  - director
  - finance
  intent_description: 'The FY26 quarterly asset-wise P&L covers 15 producing assets: field revenue of ₹1,25,145 cr and EBITDA
    of ₹75,278 cr for the year, with quar'
  parameterized_sql: "-- Answer Key SQL: F10\n-- Question: Generate a quarterly asset-wise P&L sheet.\n-- Type: document\n\
    -- Semantic audit 2026-10-20: was an ANNUAL FY26 sheet (not quarterly) that mixed corporate/plant/reconciliation lines\n\
    -- Semantic audit 2026-10-20: into 19 'work centres'. No quarterly P&L table exists (GAP), so FY26 (last full FY) field-line\n\
    -- Semantic audit 2026-10-20: P&L per producing asset is phased into quarters: oil revenue by monthly (oil+condensate)\
    \ x\n-- Semantic audit 2026-10-20: ONGC crude realisation, gas revenue by monthly gas volume x APM price x FX, royalty/SAED\
    \ by\n-- Semantic audit 2026-10-20: gross-revenue share, cess by oil share, opex by the cost_ledger quarterly profile\
    \ of the asset\n-- Semantic audit 2026-10-20: (even if absent), DD&A evenly. Quarters sum exactly to the annual field\
    \ P&L.\n\nWITH m AS (\n    SELECT\n        p.asset_wc_id,\n        CASE WHEN SUBSTR(p.month, 6, 2) IN ('04', '05', '06')\
    \ THEN 'Q1'\n             WHEN SUBSTR(p.month, 6, 2) IN ('07', '08', '09') THEN 'Q2'\n             WHEN SUBSTR(p.month,\
    \ 6, 2) IN ('10', '11', '12') THEN 'Q3'\n             ELSE 'Q4' END AS quarter,\n        SUM((p.oil_production_mt + p.condensate_production_mt)\
    \ * 7.33 * x.ongc_crude_net_realisation_inr_bbl) AS oil_val,\n        SUM(p.gas_production_mmscm * x.apm_gas_price_usd_mmbtu\
    \ * x.inr_usd_fx_rate) AS gas_val,\n        SUM(p.total_production_boe) AS boe\n    FROM production_monthly p\n    JOIN\
    \ price_fx_monthly x ON x.month = p.month\n    WHERE p.fiscal_year = @fiscal_year\n    GROUP BY p.asset_wc_id, quarter\n\
    ),\nms AS (\n    SELECT *,\n        IFNULL(SAFE_DIVIDE(oil_val, SUM(oil_val) OVER (PARTITION BY asset_wc_id)), 0.25) AS\
    \ oil_share,\n        IFNULL(SAFE_DIVIDE(gas_val, SUM(gas_val) OVER (PARTITION BY asset_wc_id)), 0.25) AS gas_share\n\
    \    FROM m\n),\ncl AS (\n    SELECT wc_id AS asset_wc_id,\n        CASE WHEN SUBSTR(month, 6, 2) IN ('04', '05', '06')\
    \ THEN 'Q1'\n             WHEN SUBSTR(month, 6, 2) IN ('07', '08', '09') THEN 'Q2'\n             WHEN SUBSTR(month, 6,\
    \ 2) IN ('10', '11', '12') THEN 'Q3'\n             ELSE 'Q4' END AS quarter,\n        SUM(amount_inr) AS amt\n    FROM\
    \ cost_ledger\n    WHERE fiscal_year = @fiscal_year\n    GROUP BY asset_wc_id, quarter\n),\ncls AS (\n    SELECT asset_wc_id,\
    \ quarter, SAFE_DIVIDE(amt, SUM(amt) OVER (PARTITION BY asset_wc_id)) AS opex_share FROM cl\n),\na AS (\n    SELECT asset_wc_id,\n\
    \        SUM(oil_revenue_inr_cr) AS oil_rev, SUM(gas_revenue_inr_cr) AS gas_rev, SUM(gross_revenue_inr_cr) AS gross,\n\
    \        SUM(statutory_royalty_inr_cr) AS royalty, SUM(statutory_cess_inr_cr) AS cess,\n        SUM(statutory_windfall_tax_saed_inr_cr)\
    \ AS saed, SUM(total_opex_inr_cr) AS opex,\n        SUM(dda_depreciation_inr_cr) AS dda, SUM(ebitda_inr_cr) AS ebitda_fy\n\
    \    FROM field_pnl_annual\n    WHERE fiscal_year = @fiscal_year AND LOWER(line_type) = 'field'\n    GROUP BY asset_wc_id\n\
    ),\nq AS (\n    SELECT\n        a.asset_wc_id, ms.quarter, a.ebitda_fy, ms.boe,\n        a.oil_rev * ms.oil_share AS oil_q,\n\
    \        a.gas_rev * ms.gas_share AS gas_q,\n        a.cess * ms.oil_share AS cess_q,\n        a.opex * IFNULL(cls.opex_share,\
    \ 0.25) AS opex_q,\n        a.dda * 0.25 AS dda_q,\n        a.royalty, a.saed, a.gross\n    FROM a\n    JOIN ms ON ms.asset_wc_id\
    \ = a.asset_wc_id\n    LEFT JOIN cls ON cls.asset_wc_id = a.asset_wc_id AND cls.quarter = ms.quarter\n),\nq2 AS (\n  \
    \  SELECT *,\n        oil_q + gas_q AS gross_q,\n        (royalty + saed) * SAFE_DIVIDE(oil_q + gas_q, gross) AS royalty_saed_q\n\
    \    FROM q\n)\nSELECT\n    wc.short_name AS asset_name,\n    CONCAT('FY26-', q2.quarter) AS quarter,\n    ROUND(q2.boe\
    \ / 1e6, 2) AS production_mmboe,\n    ROUND(q2.oil_q, 1) AS crude_revenue_cr,\n    ROUND(q2.gas_q, 1) AS gas_revenue_cr,\n\
    \    ROUND(q2.gross_q, 1) AS gross_revenue_cr,\n    ROUND(q2.royalty_saed_q + q2.cess_q, 1) AS statutory_levies_cr,\n\
    \    ROUND(q2.gross_q - q2.royalty_saed_q - q2.cess_q, 1) AS net_revenue_cr,\n    ROUND(q2.opex_q, 1) AS opex_cr,\n  \
    \  ROUND(q2.gross_q - q2.royalty_saed_q - q2.cess_q - q2.opex_q, 1) AS ebitda_cr,\n    ROUND((q2.gross_q - q2.royalty_saed_q\
    \ - q2.cess_q - q2.opex_q) * 100 / NULLIF(q2.gross_q, 0), 1) AS ebitda_margin_pct,\n    ROUND(q2.dda_q, 1) AS dda_cr,\n\
    \    ROUND(q2.gross_q - q2.royalty_saed_q - q2.cess_q - q2.opex_q - q2.dda_q, 1) AS pbt_cr,\n    ROUND(q2.ebitda_fy, 1)\
    \ AS ebitda_fy26_annual_cr\nFROM q2\nJOIN dim_work_centre wc ON wc.wc_id = q2.asset_wc_id\nORDER BY q2.ebitda_fy DESC,\
    \ q2.quarter;"
