version: '1.0'
description: Certified parameterized query library for Yukti AI Track C engine (89 Root Queries).
provenance_policy: Strict derivation from verified answer_key/sql roots. Follow-ups and paraphrases held out.
queries:
- id: C1
  group: CMD people and transfers
  canonical_question: How many executives have been posted in the Delhi office for 5 years or more? Break down by grade and
    discipline.
  intent_keywords:
  - delhi
  - discipline
  - grade
  - executives
  - posted
  - office
  intent_description: 419 executives have been in the Delhi office (WC-DEL) continuously for 5 years or more as of 19-Oct-2026.
  parameterized_sql: "-- Answer Key SQL: C1\n-- Question: How many executives have been posted in the Delhi office for 5 years\
    \ or more? Break down by grade and discipline.\n-- Type: data\n-- Semantic audit 2026-10-20: aligned with H10/X10 rotation\
    \ rule. Due = current continuous stay >= 60 months at\n-- 2026-10-19 (v_continuous_stay), minus officers retiring within\
    \ 3 x 365.25 days (JRTP 7.1 practice), minus officers\n-- whose current posting carries a valid exemption tag (literal\
    \ 'None' = no exemption; valid_until >= 2026-10-19 or NULL).\n\nWITH cur_exempt AS (\n    SELECT emp_id, LOGICAL_OR(\n\
    \        LOWER(IFNULL(exemption_tag, 'none')) NOT IN ('none', '')\n        AND (exemption_valid_until IS NULL OR exemption_valid_until\
    \ >= DATE '2026-10-19')) AS has_valid_exemption\n    FROM posting_history\n    WHERE is_current_posting\n    GROUP BY\
    \ emp_id\n),\nbase AS (\n    SELECT v.grade_id, v.discipline_id, v.emp_id,\n           DATE_DIFF(v.retirement_date, DATE\
    \ '2026-10-19', DAY) <= 3 * 365.25 AS retiring_3yr,\n           IFNULL(x.has_valid_exemption, FALSE) AS has_valid_exemption\n\
    \    FROM `ongc-hr-finance-agent.hrfin_gold.v_continuous_stay` v\n    LEFT JOIN cur_exempt x ON x.emp_id = v.emp_id\n\
    \    WHERE v.is_current_stay = TRUE\n      AND v.wc_id = @wc_id\n      AND v.grade_id LIKE 'E%'\n      AND v.continuous_stay_months\
    \ >= @min_stay_months\n)\nSELECT\n    grade_id,\n    discipline_id,\n    COUNT(DISTINCT emp_id) AS delhi_executives_ge_5yr,\n\
    \    COUNT(DISTINCT IF(retiring_3yr, emp_id, NULL)) AS exempt_retiring_3yr,\n    COUNT(DISTINCT IF(NOT retiring_3yr AND\
    \ has_valid_exemption, emp_id, NULL)) AS exempt_valid_tag,\n    COUNT(DISTINCT IF(NOT retiring_3yr AND NOT has_valid_exemption,\
    \ emp_id, NULL)) AS non_exempt_due_transfer\nFROM base\nGROUP BY grade_id, discipline_id\nORDER BY grade_id, discipline_id;"
  params:
    wc_id:
      type: STRING
      default: WC-DEL
      description: ONGC Work Centre code
      allowed_values:
      - WC-DEL
      - WC-DDN
      - WC-MUM
      - WC-TRI
      - WC-ASM
      - WC-JOR
      - WC-AAB
      - WC-AHM
      - WC-ANK
      - WC-MEH
      - WC-CAM
      - WC-RAJ
      - WC-EAS
      - WC-ROC
      - WC-ROK
      - WC-BOK
      - WC-SIL
    min_stay_months:
      type: INT64
      default: 60
      description: Minimum continuous posting duration in months
      allowed_values:
      - 12
      - 24
      - 36
      - 48
      - 60
      - 72
      - 84
      - 96
      - 120
  visual_kind: bar_chart
  provenance:
    source_file: data_bank/answer_key/sql/C1.sql
    sha256: db6db37d960ad5cc7bdaa84d5c1d058641772d0e43c47e1b6fd41ec82ab15380
    gold_objects: hrfin_gold.v_continuous_stay, hrfin_silver.posting_history
- id: C2
  group: CMD people and transfers
  canonical_question: Who is overdue for transfer under the rotation policy, and which hard or remote stations (NE, offshore)
    are short of people to receive them?
  intent_keywords:
  - rotation
  - overdue
  - transfer
  - policy
  - hard
  - remote
  intent_description: 8,457 executives are overdue for rotation under JRTP Clause 3.2 (five or more years of continuous stay
    at their current work centre, excludi
  parameterized_sql: "-- Answer Key SQL: C2\n-- Question: Who is overdue for transfer under the rotation policy, and which\
    \ hard or remote stations (NE, offshore) are short of people to receive them?\n-- Type: data\n-- Semantic audit 2026-10-20:\
    \ previous SQL only counted in-position executives at four hand-picked NE work\n-- centres (WC-ASM/JOR/TRI/SIL) - it identified\
    \ neither who is overdue nor any shortfall. Now two sections:\n--   section 'overdue_pool'      : executives overdue under\
    \ JRTP Clause 3.2 (>= 60 months continuous stay at the\n--                                 current work centre, hrfin_gold.v_continuous_stay)\
    \ excluding the Clause 7\n--                                 3-year pre-retirement protection, by current work centre\
    \ (top 10 sources);\n--   section 'receiving_station' : hard/remote stations (hard_station_cat 'C', NE sector or offshore)\
    \ with an\n--                                 executive vacancy vs FY26 sanctioned posts (sanctioned_posts, E-grades).\n\
    -- company_overdue_total repeats the company-wide overdue count on every row for the headline.\n-- Semantic audit 2026-10-20\
    \ (alignment with C1/H10/X10): overdue pool also excludes executives whose current\n-- posting carries a valid exemption_tag\
    \ ('None' = no tag; exemption_valid_until >= 2026-10-19 or NULL).\n\nWITH overdue AS (\n    SELECT v.wc_id, v.emp_id\n\
    \    FROM `ongc-hr-finance-agent.hrfin_gold.v_continuous_stay` v\n    WHERE v.is_current_stay = TRUE\n      AND v.grade_id\
    \ LIKE 'E%'\n      AND v.continuous_stay_months >= @min_stay_months\n      AND DATE_DIFF(v.retirement_date, DATE '2026-10-19',\
    \ DAY) > 3 * 365.25\n      AND v.emp_id NOT IN (\n          SELECT ph.emp_id FROM posting_history ph\n          WHERE\
    \ ph.is_current_posting = TRUE\n            AND NULLIF(ph.exemption_tag, 'None') IS NOT NULL\n            AND (ph.exemption_valid_until\
    \ >= DATE '2026-10-19' OR ph.exemption_valid_until IS NULL)\n      )\n),\nod_wc AS (\n    SELECT wc_id, COUNT(DISTINCT\
    \ emp_id) AS overdue_executives FROM overdue GROUP BY wc_id\n),\nsp AS (\n    SELECT wc_id,\n           SUM(sanctioned_strength)\
    \ AS exec_sanctioned,\n           SUM(in_position_strength) AS exec_in_position,\n           SUM(vacancy_count) AS exec_vacancy\n\
    \    FROM sanctioned_posts\n    WHERE fiscal_year = @fiscal_year AND grade_id LIKE 'E%'\n    GROUP BY wc_id\n),\ntot AS\
    \ (SELECT COUNT(DISTINCT emp_id) AS company_overdue_total FROM overdue),\npool AS (\n    SELECT 'overdue_pool' AS section,\
    \ w.wc_id, w.short_name, w.hard_station_cat, w.sector, w.onshore_offshore,\n           o.overdue_executives, sp.exec_sanctioned,\
    \ sp.exec_in_position, sp.exec_vacancy\n    FROM od_wc o\n    JOIN dim_work_centre w ON o.wc_id = w.wc_id\n    LEFT JOIN\
    \ sp ON sp.wc_id = o.wc_id\n    ORDER BY o.overdue_executives DESC\n    LIMIT 10\n),\nrecv AS (\n    SELECT 'receiving_station'\
    \ AS section, w.wc_id, w.short_name, w.hard_station_cat, w.sector, w.onshore_offshore,\n           COALESCE(o.overdue_executives,\
    \ 0) AS overdue_executives, sp.exec_sanctioned, sp.exec_in_position, sp.exec_vacancy\n    FROM sp\n    JOIN dim_work_centre\
    \ w ON sp.wc_id = w.wc_id\n    LEFT JOIN od_wc o ON o.wc_id = sp.wc_id\n    WHERE (w.hard_station_cat = 'C' OR LOWER(w.sector)\
    \ = 'ne' OR LOWER(w.onshore_offshore) = 'offshore')\n      AND sp.exec_vacancy > 0\n)\nSELECT u.*, tot.company_overdue_total,\n\
    \       ROUND(u.exec_vacancy * 100.0 / NULLIF(u.exec_sanctioned, 0), 1) AS exec_vacancy_pct\nFROM (SELECT * FROM pool\
    \ UNION ALL SELECT * FROM recv) u\nCROSS JOIN tot\nORDER BY u.section, CASE WHEN u.section = 'overdue_pool' THEN -u.overdue_executives\
    \ ELSE -u.exec_vacancy END;"
  params:
    fiscal_year:
      type: STRING
      default: FY26
      description: Fiscal year in FYxx format
      allowed_values:
      - FY21
      - FY22
      - FY23
      - FY24
      - FY25
      - FY26
      - FY27
    min_stay_months:
      type: INT64
      default: 60
      description: Minimum continuous posting duration in months
      allowed_values:
      - 12
      - 24
      - 36
      - 48
      - 60
      - 72
      - 84
      - 96
      - 120
