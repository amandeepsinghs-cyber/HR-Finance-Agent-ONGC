- id: M1
  group: E1–E4 functional split (HR vs Finance)
  canonical_question: '"What is the total headcount by asset?" (aggregate, non-identifying)'
  intent_keywords:
  - headcount
  - total
  - asset
  - aggregate
  - non-identifying
  - functional
  intent_description: The 14 operating assets employ 16,099 people at the 30-Sep-2026 snapshot (70.6% of the company's 22,803),
    led by Bassein & Satellite (1,833)
  parameterized_sql: "-- Answer Key SQL: M1\n-- Question: \"What is the total headcount by asset?\" (aggregate, non-identifying)\n\
    -- Type: data\n-- Semantic audit 2026-10-20: Old SQL summed 12 monthly headcount snapshots for FY26 vs 1 for FY21 (Eastern\
    \ Offshore '12,312', +1,182%) for 4 hand-picked assets and answered a growth question.\n-- Semantic audit 2026-10-20:\
    \ Now: headcount by asset at the latest snapshot (30-Sep-2026) for all 14 operating assets, with 31-Mar-2026 and share\
    \ of company.\n\nWITH hc AS (\n    SELECT\n        h.wc_id,\n        SUM(IF(h.month = '2026-09', h.headcount, 0)) AS hc_sep26,\n\
    \        SUM(IF(h.month = '2026-03', h.headcount, 0)) AS hc_mar26\n    FROM headcount_snapshot h\n    WHERE h.month IN\
    \ ('2026-03', '2026-09')\n    GROUP BY h.wc_id\n),\ncompany AS (\n    SELECT SUM(headcount) AS company_hc_sep26\n    FROM\
    \ headcount_snapshot\n    WHERE month = '2026-09'\n)\nSELECT\n    wc.wc_id,\n    wc.short_name AS asset,\n    wc.sector,\n\
    \    wc.onshore_offshore,\n    hc.hc_sep26 AS headcount_30sep2026,\n    hc.hc_mar26 AS headcount_31mar2026,\n    ROUND(hc.hc_sep26\
    \ * 100.0 / c.company_hc_sep26, 1) AS pct_of_company,\n    c.company_hc_sep26\nFROM dim_work_centre wc\nJOIN hc ON hc.wc_id\
    \ = wc.wc_id\nCROSS JOIN company c\nWHERE LOWER(wc.type) = 'asset'\nORDER BY headcount_30sep2026 DESC;"
  params: {}
  visual_kind: table
  provenance:
    source_file: data_bank/answer_key/sql/M1.sql
    sha256: e6486978e84aad60766b57e08d2a6d12f3cde899f85589f9c96e9c4029022451
    gold_objects: hrfin_silver, hrfin_gold
