- id: C8
  group: CMD money and assets
  canonical_question: Which loss-making mature fields are candidates for divestment, a Production Enhancement Contract, or
    a marginal-field offer?
  intent_keywords:
  - loss-making
  - divestment
  - mature
  - fields
  - candidates
  - production
  intent_description: Only 1 mature field was loss-making in FY26 - Champang (Jorhat Asset, PBT ₹-4.93 cr) - and the candidate
    list is Champang (Production Enhanc
  parameterized_sql: "-- Answer Key SQL: C8\n-- Question: Which loss-making mature fields are candidates for divestment, a\
    \ Production Enhancement Contract, or a marginal-field offer?\n-- Type: data\n-- Semantic audit 2026-10-20: old SQL returned\
    \ FY26 PBT < 0 fields only (Champang) with no maturity filter and\n-- ignored the candidate flags the question is about.\
    \ Now: FY26 mature fields that are loss-making (PBT < 0)\n-- OR carry a divestment / PEC-monetisation flag in field_pnl_annual,\
    \ with FY24-FY26 cumulative PBT, the number\n-- of loss years in that window, production, and the route implied by the\
    \ recorded flags.\n\nWITH hist AS (\n    SELECT field_id,\n           SUM(pbt_inr_cr) AS pbt_fy24_fy26_cr,\n         \
    \  COUNTIF(pbt_inr_cr < 0) AS loss_years_fy24_fy26\n    FROM field_pnl_annual\n    WHERE fiscal_year IN ('FY24', 'FY25',\
    \ 'FY26') AND LOWER(line_type) = 'field'\n    GROUP BY field_id\n)\nSELECT\n    f.name AS field_name,\n    wc.short_name\
    \ AS asset,\n    ROUND(pnl.total_production_boe / 1e6, 2) AS mmboe_fy26,\n    pnl.gross_revenue_inr_cr,\n    pnl.total_opex_inr_cr,\n\
    \    pnl.ebitda_inr_cr,\n    pnl.pbt_inr_cr,\n    ROUND(h.pbt_fy24_fy26_cr, 2) AS pbt_fy24_fy26_cr,\n    h.loss_years_fy24_fy26,\n\
    \    pnl.is_divestment_candidate,\n    pnl.pec_monetisation_potential_flag,\n    pnl.is_loss_making_3yr_consecutive,\n\
    \    CASE WHEN pnl.is_divestment_candidate THEN 'Divestment'\n         WHEN pnl.pec_monetisation_potential_flag THEN 'Production\
    \ Enhancement Contract'\n         ELSE 'Marginal-field offer (no flag recorded)' END AS route_from_flags,\n    pnl.root_cause_loss_code\n\
    FROM field_pnl_annual pnl\nJOIN dim_field f ON pnl.field_id = f.field_id\nJOIN dim_work_centre wc ON pnl.asset_wc_id =\
    \ wc.wc_id\nLEFT JOIN hist h ON h.field_id = pnl.field_id\nWHERE pnl.fiscal_year = @fiscal_year\n  AND LOWER(pnl.line_type)\
    \ = 'field'\n  AND LOWER(f.maturity) = 'mature'\n  AND (pnl.pbt_inr_cr < 0 OR pnl.is_divestment_candidate OR pnl.pec_monetisation_potential_flag)\n\
    ORDER BY pnl.pbt_inr_cr ASC;"
  params:
    fiscal_year:
      type: STRING
      default: FY26
      description: Fiscal year in FYxx format
      allowed_values:
      - FY21
      - FY22
      - FY23
