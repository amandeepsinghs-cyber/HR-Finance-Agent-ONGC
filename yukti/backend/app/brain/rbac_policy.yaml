# Single Source of Truth for Yukti v3 RBAC (P2H.1 / SPEC-06 / BEH-01 / D-41 / D-43 / D-60).
# Every enforcement point (planner, compiler, contract post-processor, narrator,
# document tools, and UI chips) derives its decision from this file via `app/brain/rbac.py`.

version: 2
unknown_persona: reject
small_cell_threshold: 5
aggregate_dimension_default: grade

# D-43: When true (default), DIR_FIN is function-scoped on HR personal data (names -> aggregate,
# individual pay/APAR -> refuse R-FUNC, sensitive -> aggregate) and DIR_HR sees fin_internal as
# aggregate. When false, both Directors receive full cross-functional allow as in v2 legacy (D-10).
director_function_scope: true

rule_refs:
  D-10: "D-10: CMD and Directors see granular and statutory-confidential data within their functional scope"
  D-11: "D-11: E1–E4 officers see aggregates only (no names; cells under 5 suppressed); individual pay, APAR, vigilance, POSH and medical records of others are refused"
  D-41: "D-41: 11 canonical personas (CMD, DIR_HR, DIR_FIN, E1_HR..E4_HR, E1_FIN..E4_FIN) + DEMO_ADMIN"
  D-43: "D-43: Function-scoped Director access (HR vs FIN) with self-scope and junior aggregate pay"

functions:
  EXEC: [HR, FIN, CORP]
  HR: [HR, CORP]
  FIN: [FIN, CORP]

persona_classes:
  leadership: [CMD]
  director: [DIR_HR, DIR_FIN]
  junior: [E1_HR, E2_HR, E3_HR, E4_HR, E1_FIN, E2_FIN, E3_FIN, E4_FIN]

# Legacy 5-class summary matrix preserved for backward compatibility with B3 tests.
matrix:
  leadership: {general: allow, named: allow, pay: allow, apar: allow, sensitive: allow}
  director:   {general: allow, named: allow, pay: allow, apar: allow, sensitive: allow}
  junior:     {general: allow, named: aggregate, pay: refuse, apar: refuse, sensitive: refuse}

