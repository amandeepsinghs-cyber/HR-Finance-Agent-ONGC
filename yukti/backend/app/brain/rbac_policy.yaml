# 12 canonical v2 data classes (SPEC-06 §5.1 / §5.2).
data_classes:
  general_hr:
    cmd: allow
    director_hr: allow
    director_fin: allow
    junior_hr: allow
    junior_fin: aggregate
    refusal_code: R-NAMED
    mask_columns: []

  general_fin:
    cmd: allow
    director_hr: allow
    director_fin: allow
    junior_hr: allow
    junior_fin: allow
    mask_columns: []

  fin_internal:
    cmd: allow
    director_hr: aggregate
    director_fin: allow
    junior_hr: aggregate
    junior_fin: allow
    refusal_code: R-FUNC
    mask_columns:
      - vendor_id
      - vendor_name
      - invoice_no
      - cost_center_owner
      - po_number

  policy:
    cmd: allow
    director_hr: allow
    director_fin: allow
    junior_hr: allow
    junior_fin: allow
    mask_columns: []

  named:
    cmd: allow
    director_hr: allow
    director_fin: function_scoped
    junior_hr: aggregate
    junior_fin: aggregate
    refusal_code: R-NAMED
    mask_columns:
      - emp_id
      - emp_name
      - name
      - employee_name
      - manager_name
      - reporting_officer
      - email
      - phone
      - posted_since
      - continuous_stay_years
      - ongc_tenure_years
      - years_to_retirement

  pay_aggregate:
    cmd: allow
    director_hr: allow
    director_fin: allow
    junior_hr: allow
    junior_fin: allow
    min_cohort_n: 5
    refusal_code: R-K5
    mask_columns:
      - emp_id
      - emp_name
      - name
      - employee_name

  pay_individual:
    cmd: allow
    director_hr: allow
    director_fin: function_scoped_refuse
    junior_hr: refuse
    junior_fin: refuse
    refusal_code: R-PAY
    mask_columns:
      - emp_id
      - emp_name
      - name
      - employee_name
      - basic_pay_inr
      - da_inr
      - hra_inr
      - perks_allowance_inr
      - performance_pay_prp_inr
      - gross_pay_inr
      - net_pay_inr
      - total_ctc_inr
      - ctc_lakh
      - avg_ctc_lakh
      - pay_band

  apar:
    cmd: allow
    director_hr: allow
    director_fin: function_scoped_refuse
    junior_hr: refuse
    junior_fin: refuse
    refusal_code: R-APAR
    mask_columns:
      - emp_id
      - emp_name
      - name
      - employee_name
      - final_score
      - final_grade
      - apar_score
      - apar_grade
      - reporting_officer_score
      - reviewing_officer_score
      - accepting_authority_score
      - promotion_ready

  sensitive:
    cmd: allow
    director_hr: allow
    director_fin: aggregate
    junior_hr: refuse
    junior_fin: refuse
    refusal_code: R-SENS
    mask_columns:
      - emp_id
      - emp_name
      - name
      - employee_name
      - case_id
      - posh_case
      - disciplinary_case
      - vigilance_flag
      - medical_category
      - pwd_flag
      - pwd_category
      - health_condition

  self:
    cmd: allow
    director_hr: allow
    director_fin: allow
    junior_hr: allow
    junior_fin: allow
    requires_param: self_emp_id
    mask_columns: []

  board_confidential:
    cmd: allow
    director_hr: refuse
    director_fin: allow
    junior_hr: refuse
    junior_fin: refuse
    refusal_code: R-BOARD
    mask_columns: []

  valuation_run:
    cmd: allow
    director_hr: refuse
    director_fin: allow
    junior_hr: refuse
    junior_fin: refuse
    refusal_code: R-FUNC
    mask_columns: []

# Result columns that carry a data class (post-query masking on any path, incl. the legacy LLM path).
column_classes:
  named: [emp_id, emp_name, name, employee_name, incumbent_emp_id, successor_1_emp_id, successor_2_emp_id,
          reporting_officer_emp_id, reviewing_officer_emp_id]
  pay: [gross_salary_inr, net_salary_inr, basic_pay_inr, da_inr, hra_inr, fy26_gross_salary_inr,
        fy26_gross_salary_lakh, avg_monthly_gross_inr, prp_inr, fy26_prp_inr, overtime_amount_inr,
        avg_gross_salary_lakh, cafeteria_allowances_inr, net_pay_inr, pay_band]
  apar: [fy26_apar_score, fy26_apar_rating, numerical_score, final_rating, avg_apar_score, apar_score]
  sensitive: [vigilance_status, posh_case_id, diagnosis, medical_condition]
  fin_internal: [vendor_id, vendor_name, invoice_no, invoice_id, cost_center_owner, cost_centre_owner, po_number, gl_account_id]

# Pattern classification for result columns not in the exact lists (legacy SQL aliases).
column_patterns:
  named: ["^emp_?name$", "^employee_?name$", "^name$", "^emp_?id$", "_emp_id$", "^officer_?name$"]
  pay: ["salary", "_pay$", "^pay_", "gross_pay", "basic_pay", "net_pay", "pay_band", "ctc", "^prp", "_prp", "allowance", "wage", "remuneration", "emolument", "bonus", "increment"]
  apar: ["apar", "appraisal", "performance_rating", "performance_score"]
  sensitive: ["vigilance", "posh", "medical", "diagnosis", "disciplinary"]
  fin_internal: ["^vendor_?name$", "^vendor_?id$", "^invoice_?(?:no|id)$", "^po_?number$", "cost_cent(?:re|er)_owner"]

# Question topics that are sensitive regardless of the metric (pre-query text guard for juniors;
# matched on word boundaries).
topic_keywords:
  pay: [salary, salaries, pay of, pay band, net pay, basic pay, gross pay, average pay, take-home pay, take home pay, compensation, ctc, wages,
        wage, remuneration, emoluments, prp, performance related pay, bonus, increment, allowance of, perks, वेतन, तनख्वाह, सैलरी, tankhwah]
  apar: [apar, apars, appraisal rating, appraisal score, performance rating, performance score, प्रदर्शन, मूल्यांकन, रेटिंग]
  sensitive: [vigilance, posh, sexual harassment, medical history, medical record, medical records, medical claim, medical claims, health record,
              health records, disciplinary, सतर्कता, चिकित्सा, स्वास्थ्य]

row_actions:
  - id: draft_transfer_note
    label: "Draft Transfer Note"
    action: draft_transfer_note
    question_template: "Draft a transfer note for the selected {n} employees"
    min_role: DIR_HR
    subjects: [workforce]

refusal_templates:
  pay_individual:
    code: R-PAY
    en: "Individual salary, CTC, and payroll breakdowns of other employees are restricted to CMD and the respective functional Director. Under your current role ({persona_label}), I can share grade-wise pay scales, starting basic pay, or cohort-level average CTC (for cohorts of 5 or more), as well as your own payslip."
    hi: "अन्य कर्मचारियों का व्यक्तिगत वेतन, CTC और पेरोल विवरण केवल CMD और संबंधित निदेशक के लिए उपलब्ध है। आपकी वर्तमान भूमिका ({persona_label}) के तहत मैं ग्रेड-वार वेतनमान, प्रारंभिक मूल वेतन, समूह-स्तरीय औसत CTC (5 या अधिक कर्मचारियों के लिए), या आपकी अपनी वेतन पर्ची साझा कर सकता हूँ।"
  pay:
    code: R-PAY
    en: "Individual salary, CTC, and payroll breakdowns of other employees are restricted to CMD and the respective functional Director. Under your current role ({persona_label}), I can share grade-wise pay scales, starting basic pay, or cohort-level average CTC (for cohorts of 5 or more), as well as your own payslip."
    hi: "अन्य कर्मचारियों का व्यक्तिगत वेतन, CTC और पेरोल विवरण केवल CMD और संबंधित निदेशक के लिए उपलब्ध है। आपकी वर्तमान भूमिका ({persona_label}) के तहत मैं ग्रेड-वार वेतनमान, प्रारंभिक मूल वेतन, समूह-स्तरीय औसत CTC (5 या अधिक कर्मचारियों के लिए), या आपकी अपनी वेतन पर्ची साझा कर सकता हूँ।"
  apar:
    code: R-APAR
    en: "Individual APAR performance scores, ratings, and DPC appraisal dossiers of other employees are confidential and accessible only to CMD and the respective functional Director. Under {persona_label}, I can share your own APAR history or organisation-level appraisal distributions."
    hi: "अन्य कर्मचारियों के व्यक्तिगत APAR प्रदर्शन स्कोर और DPC मूल्यांकन गोपनीय हैं और केवल CMD तथा संबंधित निदेशक के लिए सुलभ हैं। {persona_label} के अंतर्गत मैं आपका अपना APAR इतिहास या संगठन-स्तरीय वितरण साझा कर सकता हूँ।"
  sensitive:
    code: R-SENS
    en: "Vigilance, POSH, disciplinary, and medical case records contain sensitive personal data and are restricted to CMD and Director (HR). Under {persona_label}, I cannot disclose individual case details."
    hi: "सतर्कता, POSH, अनुशासनात्मक और चिकित्सा मामलों के रिकॉर्ड संवेदनशील व्यक्तिगत डेटा हैं और केवल CMD तथा निदेशक (HR) के लिए प्रतिबंधित हैं। {persona_label} के अंतर्गत व्यक्तिगत विवरण साझा नहीं किया जा सकता।"
  named:
    code: R-NAMED
    en: "Named employee rosters and individual service records are restricted to CMD and functional Directors. Under {persona_label}, I have provided the anonymised aggregate distribution."
    hi: "नामित कर्मचारी सूची और व्यक्तिगत सेवा रिकॉर्ड केवल CMD और निदेशकों के लिए उपलब्ध हैं। {persona_label} के अंतर्गत अनाम समग्र वितरण नीचे दिया गया है।"
  function_mismatch:
    code: R-FUNC
    en: "Cross-functional individual HR/payroll/APAR records outside your functional scope are restricted under ONGC's function-segregated access policy (D-43). Under {persona_label}, you may access individual records within your function ({persona_function}) or organisation-wide anonymised aggregates."
    hi: "आपके कार्यात्मक क्षेत्र से बाहर के व्यक्तिगत HR/पेरोल/APAR रिकॉर्ड ONGC की कार्य-विभाजित नीति (D-43) के तहत प्रतिबंधित हैं। {persona_label} के अंतर्गत आप अपने फ़ंक्शन ({persona_function}) के रिकॉर्ड या संगठन-स्तरीय समग्र आंकड़े देख सकते हैं।"
  board_confidential:
    code: R-BOARD
    en: "Board-confidential succession notes and deliberation drafts are restricted to CMD and the sponsoring functional Director. Under {persona_label}, this action is not permitted."
    hi: "बोर्ड-गोपनीय उत्तराधिकार नोट्स और विचार-विमर्श ड्राफ्ट केवल CMD और संबंधित कार्यात्मक निदेशक के लिए प्रतिबंधित हैं। {persona_label} के अंतर्गत यह अनुमति नहीं है।"
  role_escalation:
    code: R-ROLE
    en: "Persona cannot be changed from inside a question. Your active session remains {persona_label}. To switch personas in a demo, please use the top-right Persona selector (or sign in as Demo Admin)."
    hi: "प्रश्न के भीतर से भूमिका (परसोना) नहीं बदली जा सकती। आपका सक्रिय सत्र {persona_label} बना हुआ है। भूमिका बदलने के लिए कृपया शीर्ष-दाईं ओर परसोना चयनकर्ता का उपयोग करें।"
  small_cell:
    code: R-K5
    en: "This cohort has fewer than 5 employees (k < 5). To prevent indirect identification of individual compensation or personal attributes, cell values for cohorts smaller than 5 are suppressed."
    hi: "इस समूह में 5 से कम कर्मचारी हैं (k < 5)। व्यक्तिगत वेतन या विवरण की अप्रत्यक्ष पहचान रोकने के लिए 5 से छोटे समूहों के आंकड़े प्रदर्शित नहीं किए जाते।"
  default:
    code: R-NAMED
    en: "This data is restricted under your current role ({persona_label}). Please switch to an authorised Director or CMD persona, or request an aggregate summary."
    hi: "यह डेटा आपकी वर्तमान भूमिका ({persona_label}) के अंतर्गत प्रतिबंधित है। कृपया अधिकृत निदेशक या CMD भूमिका का चयन करें, अथवा समग्र सारांश का अनुरोध करें।"
